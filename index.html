 Use g = 9.8 m/s^2.","choices":["1.96 m/s^2","4.9 m/s^2","9.8 m/s^2","19.6 m/s^2"],"answer":"1.96 m/s^2","why":"a = (m_1 - m_2)g/(m_1 + m_2) = (1)(9.8)/5 = 1.96 m/s^2.","trap":"Using g for the 1 kg difference only, which gives 9.8 m/s^2.","diff":2},{"id":"phys-021","part":"II","domain":"Science","sub":"Newton's Laws","q":"A swimmer pushes water backward. What is the reaction force?","choices":["The water pushes the swimmer forward","The swimmer's weight increases","The water moves backward faster","Friction stops the swimmer"],"answer":"The water pushes the swimmer forward","why":"Newton's third law: the water pushes back on the swimmer with equal force in the opposite direction.","trap":"Expecting the reaction to cancel the force on the same body.","diff":1},{"id":"phys-022","part":"II","domain":"Science","sub":"Friction","q":"A 20 kg box slides at constant speed on a level floor under a 40 N pull. What is the coefficient of kinetic friction? Use g = 9.8 m/s^2.","choices":["0.10","0.20","2.0","4.9"],"answer":"0.20","why":"At constant speed f = 40 N. mu = f/N = 40/(20*9.8) = 0.20.","trap":"Dividing 40 by 20 to get 2.0 as the coefficient.","diff":2},{"id":"phys-023","part":"II","domain":"Science","sub":"Work and Energy","q":"A 50 N force pulls a crate 4 m along the floor in the direction of motion. How much work is done?","choices":["12.5 J","54 J","200 J","800 J"],"answer":"200 J","why":"W = F*d*cos(0) = 50*4 = 200 J.","trap":"Dividing 50 by 4 to get 12.5 J.","diff":1},{"id":"phys-024","part":"II","domain":"Science","sub":"Work and Energy","q":"A student carries a 10 kg bag 5 m horizontally at constant speed. How much work does the upward carrying force do?","choices":["0 J","49 J","98 J","490 J"],"answer":"0 J","why":"The force is vertical and the displacement is horizontal. W = F*d*cos(90) = 0.","trap":"Using W = mg*d = 98*5 = 490 J and ignoring the right angle.","diff":2},{"id":"phys-025","part":"II","domain":"Science","sub":"Work and Energy","q":"A 1000 kg car moves at 20 m/s. What is its kinetic energy?","choices":["1.0 x 10^4 J","2.0 x 10^5 J","4.0 x 10^5 J","2.0 x 10^7 J"],"answer":"2.0 x 10^5 J","why":"KE = 0.5*m*v^2 = 0.5(1000)(20^2) = 200000 J = 2.0 x 10^5 J.","trap":"Dropping the 0.5 and getting 4.0 x 10^5 J.","diff":2},{"id":"phys-026","part":"II","domain":"Science","sub":"Work and Energy","q":"A 2 kg book is lifted 3 m. What is its gain in gravitational potential energy? Use g = 9.8 m/s^2.","choices":["6 J","19.6 J","58.8 J","176.4 J"],"answer":"58.8 J","why":"PE = m*g*h = 2(9.8)(3) = 58.8 J.","trap":"Using m*h = 6 J and leaving out g.","diff":1},{"id":"phys-027","part":"II","domain":"Science","sub":"Power and Efficiency","q":"A motor lifts a 200 N load 5 m in 4 s. What is its average power?","choices":["40 W","250 W","1000 W","4000 W"],"answer":"250 W","why":"W = F*d = 200(5) = 1000 J. P = W/t = 1000/4 = 250 W.","trap":"Reporting the work, 1000 W, and skipping the division by time.","diff":2},{"id":"phys-028","part":"II","domain":"Science","sub":"Power and Efficiency","q":"A machine takes in 500 J and delivers 350 J of useful work. What is its efficiency?","choices":["30%","70%","143%","150%"],"answer":"70%","why":"Efficiency = useful work/input energy x 100 = 350/500 x 100 = 70%.","trap":"Reporting the lost fraction, 30%, as the efficiency.","diff":2},{"id":"phys-029","part":"II","domain":"Science","sub":"Work and Energy","q":"A 2 kg block slides from rest down a 5 m high frictionless ramp. What is its speed at the bottom? Use g = 9.8 m/s^2.","choices":["9.9 m/s","14 m/s","49 m/s","98 m/s"],"answer":"9.9 m/s","why":"mgh = 0.5mv^2 gives v = sqrt(2gh) = sqrt(2*9.8*5) = 9.9 m/s.","trap":"Reporting 2gh = 98 m/s and skipping the square root.","diff":3},{"id":"phys-030","part":"II","domain":"Science","sub":"Work and Energy","q":"A 4 kg cart speeds up from 2 m/s to 6 m/s. What net work was done on it?","choices":["16 J","32 J","64 J","128 J"],"answer":"64 J","why":"W = 0.5*m*(v^2 - v_0^2) = 0.5(4)(36 - 4) = 64 J.","trap":"Using only the speed change and computing 0.5*4*4^2 = 32 J.","diff":3},{"id":"phys-031","part":"II","domain":"Science","sub":"Momentum","q":"A 1200 kg car moves at 15 m/s. What is its momentum?","choices":["80 kg*m/s","1800 kg*m/s","18000 kg*m/s","36000 kg*m/s"],"answer":"18000 kg*m/s","why":"p = m*v = 1200(15) = 18000 kg*m/s.","trap":"Dividing 1200 by 15 to get 80 kg*m/s.","diff":1},{"id":"phys-032","part":"II","domain":"Science","sub":"Impulse","q":"A 0.5 kg ball is hit by a force of 200 N for 0.02 s. What impulse is delivered?","choices":["0.01 N*s","4 N*s","100 N*s","4000 N*s"],"answer":"4 N*s","why":"Impulse = F*t = 200(0.02) = 4 N*s.","trap":"Multiplying mass by force, 0.5*200 = 100 N*s, and ignoring time.","diff":2},{"id":"phys-033","part":"II","domain":"Science","sub":"Momentum","q":"A 1 kg ball at 4 m/s hits a stationary 3 kg ball and they stick together. What is their common speed?","choices":["0.75 m/s","1 m/s","1.33 m/s","4 m/s"],"answer":"1 m/s","why":"m_1*v_1 = (m_1 + m_2)v, so 1(4) = 4v and v = 1 m/s.","trap":"Dividing 4 by 3 to get 1.33 m/s from the moving mass only.","diff":2},{"id":"phys-034","part":"II","domain":"Science","sub":"Momentum","q":"A 4 kg rifle fires a 0.02 kg bullet at 300 m/s. What is the rifle's recoil speed?","choices":["0.15 m/s","1.5 m/s","6 m/s","60 m/s"],"answer":"1.5 m/s","why":"Total momentum is zero: 0.02(300) = 4v, so v = 1.5 m/s.","trap":"Multiplying 0.02 by 300 and forgetting to divide by 4, giving 6 m/s.","diff":2},{"id":"phys-035","part":"II","domain":"Science","sub":"Momentum","q":"A 2 kg cart at 3 m/s east collides with a 1 kg cart at 3 m/s west and they stick. What is the final velocity?","choices":["0 m/s","1 m/s east","1 m/s west","3 m/s east"],"answer":"1 m/s east","why":"Total p = 2(3) - 1(3) = 3 kg*m/s east. v = p/3 = 1 m/s east.","trap":"Adding both speeds to get 9/3 = 3 m/s east.","diff":3},{"id":"phys-036","part":"II","domain":"Science","sub":"Impulse","q":"Why do cars have crumple zones?","choices":["They increase the impact time and lower the force","They increase the momentum change","They reduce the impulse to zero","They add mass to stop the car"],"answer":"They increase the impact time and lower the force","why":"Impulse equals momentum change and is fixed. A longer impact time means a smaller force, since F = impulse/t.","trap":"Thinking crumple zones reduce the impulse itself.","diff":2},{"id":"phys-037","part":"II","domain":"Science","sub":"Waves and Sound","q":"A wave has frequency 50 Hz and wavelength 2 m. What is its speed?","choices":["25 m/s","100 m/s","104 m/s","0.04 m/s"],"answer":"100 m/s","why":"v = f*lambda = 50(2) = 100 m/s.","trap":"Dividing 50 by 2 to get 25 m/s.","diff":1},{"id":"phys-038","part":"II","domain":"Science","sub":"Waves and Sound","q":"A wave completes 20 cycles in 4 s. What are its frequency and period?","choices":["5 Hz and 0.2 s","0.2 Hz and 5 s","4 Hz and 0.25 s","80 Hz and 0.0125 s"],"answer":"5 Hz and 0.2 s","why":"f = cycles/time = 20/4 = 5 Hz. T = 1/f = 0.2 s.","trap":"Swapping frequency and period to get 0.2 Hz and 5 s.","diff":1},{"id":"phys-039","part":"II","domain":"Science","sub":"Waves and Sound","q":"A sound pulse reflects from a cliff and returns after 2 s. Sound speed is 340 m/s. How far is the cliff?","choices":["170 m","340 m","680 m","1360 m"],"answer":"340 m","why":"The sound travels to the cliff and back, so 2d = v*t = 340(2). d = 340 m.","trap":"Using d = v*t = 680 m and forgetting the round trip.","diff":2},{"id":"phys-040","part":"II","domain":"Science","sub":"Optics","q":"A light ray hits a flat mirror at 30 degrees from the normal. What is the angle between the reflected ray and the mirror surface?","choices":["30 degrees","60 degrees","90 degrees","120 degrees"],"answer":"60 degrees","why":"The reflected angle is 30 degrees from the normal. The angle from the surface is 90 - 30 = 60 degrees.","trap":"Giving 30 degrees, which is measured from the normal, not the surface.","diff":2},{"id":"phys-041","part":"II","domain":"Science","sub":"Optics","q":"Light moves from air into glass with index 1.5. What happens to its speed and direction?","choices":["Speed decreases and it bends toward the normal","Speed increases and it bends away from the normal","Speed is unchanged and it bends","Speed decreases and it bends away from the normal"],"answer":"Speed decreases and it bends toward the normal","why":"v = c/n, so speed falls to c/1.5. Light slows in the denser medium and bends toward the normal.","trap":"Thinking light speeds up in glass and bends away from the normal.","diff":2},{"id":"phys-042","part":"II","domain":"Science","sub":"Optics","q":"Light hits glass (n = 1.5) from air (n = 1.0) at 30 degrees to the normal. What is the angle of refraction? Use sin 30 = 0.5.","choices":["19.5 degrees","30 degrees","48.6 degrees","60 degrees"],"answer":"19.5 degrees","why":"n_1*sin(i) = n_2*sin(r): 1.0(0.5) = 1.5 sin(r). sin(r) = 0.333, so r = 19.5 degrees.","trap":"Multiplying by 1.5 instead of dividing, then taking sin(r) = 0.75.","diff":3},{"id":"phys-043","part":"II","domain":"Science","sub":"Optics","q":"An object sits beyond 2F of a converging lens. What image forms?","choices":["Real, inverted, smaller","Virtual, upright, larger","Real, upright, same size","Virtual, inverted, same size"],"answer":"Real, inverted, smaller","why":"An object beyond 2F forms a real image between F and 2F. That image is inverted and smaller.","trap":"Placing the image beyond 2F, which happens when the object is between F and 2F.","diff":2},{"id":"phys-044","part":"II","domain":"Science","sub":"Optics","q":"An object is 30 cm from a converging lens of focal length 10 cm. Where is the image? Use 1/f = 1/d_o + 1/d_i.","choices":["7.5 cm","15 cm","20 cm","40 cm"],"answer":"15 cm","why":"1/d_i = 1/f - 1/d_o = 1/10 - 1/30 = 2/30. d_i = 15 cm on the far side.","trap":"Adding 10 and 30 to get 40 cm.","diff":3},{"id":"phys-045","part":"II","domain":"Science","sub":"Waves and Sound","q":"An ambulance siren moves toward you. How does the observed pitch change?","choices":["Higher, because the waves are compressed","Lower, because the waves are stretched","Unchanged, because sound speed is fixed","Higher, because the siren gets louder"],"answer":"Higher, because the waves are compressed","why":"Motion toward the listener shortens the wavelength. Shorter wavelength means higher frequency, so higher pitch.","trap":"Confusing loudness with pitch, since the siren does get louder.","diff":1},{"id":"phys-046","part":"II","domain":"Science","sub":"Waves and Sound","q":"A guitar string 0.6 m long has tension 120 N and linear density 0.03 kg/m. What is its fundamental frequency?","choices":["26 Hz","53 Hz","63 Hz","105 Hz"],"answer":"53 Hz","why":"v = sqrt(T/mu) = sqrt(4000) = 63.2 m/s. f = v/(2L) = 63.2/1.2 = 52.7 Hz, about 53 Hz.","trap":"Using f = v/L and getting 105 Hz, which is the second harmonic.","diff":3},{"id":"phys-047","part":"II","domain":"Science","sub":"Electricity","q":"A 12 V battery is connected to a 4 ohm resistor. What current flows?","choices":["0.33 A","3 A","8 A","48 A"],"answer":"3 A","why":"I = V/R = 12/4 = 3 A.","trap":"Multiplying 12 by 4 to get 48 A.","diff":1},{"id":"phys-048","part":"II","domain":"Science","sub":"Electricity","q":"Two resistors, 6 ohm and 3 ohm, are in series across 9 V. What is the current?","choices":["1 A","1.5 A","3 A","4.5 A"],"answer":"1 A","why":"Series: R = 6 + 3 = 9 ohm. I = V/R = 9/9 = 1 A.","trap":"Using the parallel equivalent, 2 ohm, and getting 4.5 A.","diff":2},{"id":"phys-049","part":"II","domain":"Science","sub":"Electricity","q":"Two 12 ohm resistors are in parallel across 24 V. What is the total current?","choices":["1 A","2 A","4 A","8 A"],"answer":"4 A","why":"Parallel: 1/R = 1/12 + 1/12 = 1/6, so R = 6 ohm. I = 24/6 = 4 A.","trap":"Adding the resistors to get 24 ohm and then 1 A.","diff":2},{"id":"phys-050","part":"II","domain":"Science","sub":"Magnetism","q":"Two parallel wires carry currents in the same direction. What force acts between them?","choices":["They attract each other","They repel each other","No force acts between them","They rotate around each other"],"answer":"They attract each other","why":"Each wire sets a magnetic field at the other. Parallel currents in the same direction attract.","trap":"Reversing the rule and expecting like currents to repel like charges.","diff":3},{"id":"phys-051","part":"II","domain":"Science","sub":"Electricity","q":"A 60 W bulb runs on 120 V. What current does it draw?","choices":["0.5 A","2 A","60 A","7200 A"],"answer":"0.5 A","why":"P = V*I, so I = P/V = 60/120 = 0.5 A.","trap":"Multiplying 60 by 120 to get 7200 A.","diff":1},{"id":"phys-052","part":"II","domain":"Science","sub":"Electricity","q":"A 100 W fan runs for 5 hours. How much energy does it use in kWh?","choices":["0.05 kWh","0.5 kWh","5 kWh","500 kWh"],"answer":"0.5 kWh","why":"Energy = power x time = 100 W x 5 h = 500 Wh = 0.5 kWh.","trap":"Keeping watts and reporting 500 Wh as 500 kWh.","diff":2},{"id":"phys-053","part":"II","domain":"Science","sub":"Thermodynamics","q":"How much heat raises 2 kg of water by 10 C? Use c = 4200 J/kg*C.","choices":["4.2 x 10^4 J","8.4 x 10^4 J","1.7 x 10^5 J","8.4 x 10^5 J"],"answer":"8.4 x 10^4 J","why":"Q = m*c*deltaT = 2(4200)(10) = 84000 J = 8.4 x 10^4 J.","trap":"Dropping the mass and reporting 4.2 x 10^4 J.","diff":2},{"id":"phys-054","part":"II","domain":"Science","sub":"Thermodynamics","q":"A metal spoon in hot soup becomes hot at the handle. Which heat transfer process is mainly responsible?","choices":["Conduction","Convection","Radiation","Evaporation"],"answer":"Conduction","why":"Heat moves through the solid metal by direct contact between particles. That process is conduction.","trap":"Choosing convection because the soup is a liquid.","diff":1},{"id":"phys-055","part":"II","domain":"Science","sub":"Thermodynamics","q":"A 2 m steel rod is heated by 50 C. The linear expansion coefficient is 1.2 x 10^-5 per C. How much does it lengthen?","choices":["1.2 x 10^-3 m","1.2 x 10^-4 m","6.0 x 10^-4 m","1.2 x 10^-2 m"],"answer":"1.2 x 10^-3 m","why":"deltaL = L*alpha*deltaT = 2(1.2 x 10^-5)(50) = 1.2 x 10^-3 m.","trap":"Leaving out the 2 m length and reporting 6.0 x 10^-4 m.","diff":3},{"id":"math-adv-001","part":"III","domain":"Mathematics","sub":"Domain and Range","q":"What is the domain of f(x) = sqrt(x - 3)?","choices":["x >= 3","x > 3","x <= 3","all real numbers"],"answer":"x >= 3","why":"The radicand must be nonnegative. x - 3 >= 0 gives x >= 3. At x = 3 the value is 0, so 3 is included.","trap":"Setting x - 3 > 0 and excluding x = 3.","diff":1},{"id":"math-adv-002","part":"III","domain":"Mathematics","sub":"Domain and Range","q":"What is the range of f(x) = x^2 + 4?","choices":["y >= 4","y > 4","y <= 4","all real numbers"],"answer":"y >= 4","why":"x^2 >= 0 for every real x. Adding 4 gives x^2 + 4 >= 4, and x = 0 attains 4.","trap":"Ignoring the vertical shift and answering all real numbers.","diff":2},{"id":"math-adv-003","part":"III","domain":"Mathematics","sub":"Composition","q":"If f(x) = 2x + 1 and g(x) = x^2, what is f(g(3))?","choices":["19","49","13","37"],"answer":"19","why":"Work inside out. g(3) = 3^2 = 9. Then f(9) = 2(9) + 1 = 19.","trap":"Squaring f(3) = 7 instead, which gives 49.","diff":2},{"id":"math-adv-004","part":"III","domain":"Mathematics","sub":"Inverse Functions","q":"What is the inverse of f(x) = 3x - 6?","choices":["f^-1(x) = (x + 6)/3","f^-1(x) = (x - 6)/3","f^-1(x) = 3x + 6","f^-1(x) = x/3 + 6"],"answer":"f^-1(x) = (x + 6)/3","why":"Write y = 3x - 6. Swap x and y: x = 3y - 6. Solve for y: y = (x + 6)/3.","trap":"Moving the 6 without changing its sign, which gives (x - 6)/3.","diff":2},{"id":"math-adv-005","part":"III","domain":"Mathematics","sub":"Even and Odd Functions","q":"The function f(x) = x^3 - x is:","choices":["odd","even","neither odd nor even","both odd and even"],"answer":"odd","why":"f(-x) = (-x)^3 - (-x) = -x^3 + x = -(x^3 - x) = -f(x). So f is odd.","trap":"Testing f(2) and f(-2), seeing unequal outputs, and calling it neither.","diff":2},{"id":"math-adv-006","part":"III","domain":"Mathematics","sub":"Transformations","q":"The graph of y = (x - 2)^2 + 5 is the graph of y = x^2 shifted:","choices":["2 units right and 5 units up","2 units left and 5 units up","2 units right and 5 units down","5 units right and 2 units up"],"answer":"2 units right and 5 units up","why":"Inside the square, x - 2 moves the graph right by 2. The +5 outside moves it up by 5.","trap":"Reading x - 2 as a shift left because the sign is negative.","diff":2},{"id":"math-adv-007","part":"III","domain":"Mathematics","sub":"Piecewise Functions","q":"Let f(x) = x + 1 if x < 0, and f(x) = x^2 if x >= 0. What is f(-2)?","choices":["-1","4","1","-4"],"answer":"-1","why":"Since -2 < 0, use the first rule: f(-2) = -2 + 1 = -1.","trap":"Using x^2 because it looks like the main rule, which gives 4.","diff":1},{"id":"math-adv-008","part":"III","domain":"Mathematics","sub":"Composition","q":"If f(x) = 1/x and g(x) = x - 2, what is the domain of f(g(x))?","choices":["all real numbers except 2","all real numbers except 0","all real numbers except -2","all real numbers"],"answer":"all real numbers except 2","why":"f(g(x)) = 1/(x - 2). The denominator cannot be zero, so x - 2 is not 0, which means x is not 2.","trap":"Copying the domain of f, which excludes 0, and ignoring the inner function.","diff":2},{"id":"math-adv-009","part":"III","domain":"Mathematics","sub":"Domain and Range","q":"What is the range of f(x) = -x^2 + 1?","choices":["y <= 1","y >= 1","y <= -1","all real numbers"],"answer":"y <= 1","why":"x^2 >= 0, so -x^2 <= 0. Adding 1 gives -x^2 + 1 <= 1. The vertex (0, 1) attains 1.","trap":"Ignoring the negative sign and answering y >= 1.","diff":2},{"id":"math-adv-010","part":"III","domain":"Mathematics","sub":"Composition","q":"If f(x) = x^2 and g(x) = x - 2, solve f(g(x)) = g(f(x)).","choices":["x = 3/2","x = 2","x = 0","x = 1/2"],"answer":"x = 3/2","why":"f(g(x)) = (x - 2)^2 and g(f(x)) = x^2 - 2. Expand: x^2 - 4x + 4 = x^2 - 2. Then -4x = -6, so x = 3/2.","trap":"Dropping the -2 on the right, which gives (x - 2)^2 = x^2 and x = 1.","diff":3},{"id":"math-adv-011","part":"III","domain":"Mathematics","sub":"Logarithms","q":"Solve for x: log_3(x) = 4.","choices":["81","12","64","7"],"answer":"81","why":"log_3(x) = 4 means 3^4 = x. Compute 3^4 = 81.","trap":"Multiplying 3 by 4 to get 12.","diff":1},{"id":"math-adv-012","part":"III","domain":"Mathematics","sub":"Logarithms","q":"Solve for b: log_b(8) = 3.","choices":["2","3","8/3","24"],"answer":"2","why":"log_b(8) = 3 means b^3 = 8. The real cube root of 8 is 2.","trap":"Dividing 8 by 3 to get 8/3.","diff":2},{"id":"math-adv-013","part":"III","domain":"Mathematics","sub":"Laws of Logarithms","q":"What is log(2) + log(5)? Use base 10.","choices":["1","7","log(7)","10"],"answer":"1","why":"log(2) + log(5) = log(2 × 5) = log(10) = 1.","trap":"Adding the arguments to get log(7).","diff":2},{"id":"math-adv-014","part":"III","domain":"Mathematics","sub":"Change of Base","q":"What is log_4(32)?","choices":["5/2","8","2/5","3"],"answer":"5/2","why":"Change of base: log_4(32) = log_2(32)/log_2(4) = 5/2.","trap":"Dividing 32 by 4 to get 8.","diff":3},{"id":"math-adv-015","part":"III","domain":"Mathematics","sub":"Exponential Growth","q":"A culture starts with 500 bacteria and doubles every 3 hours. How many bacteria are there after 12 hours?","choices":["8000","4000","6000","16000"],"answer":"8000","why":"12 hours is 4 doubling periods. The count is 500 × 2^4 = 500 × 16 = 8000.","trap":"Stopping after three doublings, which gives 4000.","diff":3},{"id":"math-adv-016","part":"III","domain":"Mathematics","sub":"Half-Life","q":"A sample of 80 mg of a radioisotope has a half-life of 6 days. How much remains after 24 days?","choices":["5 mg","10 mg","20 mg","2.5 mg"],"answer":"5 mg","why":"24 days is 4 half-lives. Remaining mass is 80 × (1/2)^4 = 80/16 = 5 mg.","trap":"Stopping after three half-lives, which gives 10 mg.","diff":2},{"id":"math-adv-017","part":"III","domain":"Mathematics","sub":"Exponential Equations","q":"Solve for x: 2^(x + 1) = 32.","choices":["4","5","6","3"],"answer":"4","why":"Write 32 as 2^5. Then x + 1 = 5, so x = 4.","trap":"Writing 32 as 2^4 and getting x = 3.","diff":2},{"id":"math-adv-018","part":"III","domain":"Mathematics","sub":"Natural Logarithms","q":"What is ln(e^7)?","choices":["7","e","1","7e"],"answer":"7","why":"ln and e are inverse functions, so ln(e^7) = 7.","trap":"Writing e^7 as 7e first.","diff":1},{"id":"math-adv-019","part":"III","domain":"Mathematics","sub":"Logarithmic Equations","q":"Solve for x, using base 10: log(x) + log(x - 3) = 1.","choices":["5","-2","2","5 or -2"],"answer":"5","why":"Combine: log(x(x - 3)) = 1, so x^2 - 3x = 10. Then (x - 5)(x + 2) = 0. Reject x = -2 because log(-2) is undefined.","trap":"Keeping both roots without checking the domain of the logarithm.","diff":3},{"id":"math-adv-020","part":"III","domain":"Mathematics","sub":"Laws of Exponents","q":"Simplify: (2^5 × 2^3) / 2^6.","choices":["4","2","8","16"],"answer":"4","why":"Add exponents in the numerator: 2^5 × 2^3 = 2^8. Then subtract: 2^8 / 2^6 = 2^2 = 4.","trap":"Simplifying only 2^3 to 8 and ignoring the other factors.","diff":1},{"id":"math-adv-021","part":"III","domain":"Mathematics","sub":"Arithmetic Sequences","q":"In an arithmetic sequence with first term 3 and common difference 4, what is the 10th term?","choices":["39","40","43","36"],"answer":"39","why":"a_n = a_1 + (n - 1)d. a_10 = 3 + 9(4) = 3 + 36 = 39.","trap":"Using 10d instead of 9d, which gives 43.","diff":1},{"id":"math-adv-022","part":"III","domain":"Mathematics","sub":"Arithmetic Series","q":"What is the sum of the first 20 terms of the arithmetic sequence 5, 8, 11, ...?","choices":["670","660","1340","335"],"answer":"670","why":"d = 3. S_n = n/2 [2a_1 + (n - 1)d]. S_20 = 10[10 + 19(3)] = 10(67) = 670.","trap":"Forgetting to halve and doubling the result to 1340.","diff":2},{"id":"math-adv-023","part":"III","domain":"Mathematics","sub":"Geometric Sequences","q":"What is the 5th term of the geometric sequence 2, 6, 18, ...?","choices":["162","54","486","96"],"answer":"162","why":"r = 3. a_5 = a_1 × r^(n - 1) = 2 × 3^4 = 2 × 81 = 162.","trap":"Using 3^5 instead of 3^4, which gives 486.","diff":2},{"id":"math-adv-024","part":"III","domain":"Mathematics","sub":"Geometric Series","q":"What is the sum of the first 6 terms of 1 + 2 + 4 + ...?","choices":["63","64","31","127"],"answer":"63","why":"r = 2. S_6 = a_1(r^6 - 1)/(r - 1) = 1(64 - 1)/1 = 63.","trap":"Giving 2^6 = 64, which is the next term, not the sum.","diff":2},{"id":"math-adv-025","part":"III","domain":"Mathematics","sub":"Infinite Geometric Series","q":"What is the sum of the infinite geometric series 8 + 4 + 2 + ...?","choices":["16","12","4","8"],"answer":"16","why":"r = 1/2. S = a_1/(1 - r) = 8/(1 - 1/2) = 8/(1/2) = 16.","trap":"Multiplying 8 by (1 - 1/2) instead of dividing, which gives 4.","diff":2},{"id":"math-adv-026","part":"III","domain":"Mathematics","sub":"Infinite Geometric Series","q":"An infinite geometric series converges when its common ratio r satisfies:","choices":["|r| < 1","|r| > 1","r > 0","r = 1"],"answer":"|r| < 1","why":"The partial sums approach a_1/(1 - r) only when the powers r^n shrink to 0. That happens exactly when |r| < 1.","trap":"Thinking only positive ratios converge, or that any r below 1 works, including r = -3.","diff":1},{"id":"math-adv-027","part":"III","domain":"Mathematics","sub":"Arithmetic Sequences","q":"In the arithmetic sequence 5, 9, 13, ..., which term is equal to 61?","choices":["15th","14th","16th","13th"],"answer":"15th","why":"a_n = 5 + 4(n - 1). Set 5 + 4(n - 1) = 61. Then 4(n - 1) = 56, n - 1 = 14, n = 15.","trap":"Forgetting to subtract 1 from n, which gives the 14th term.","diff":2},{"id":"math-adv-028","part":"III","domain":"Mathematics","sub":"Geometric Sequences","q":"The numbers 3, x, 27 form a geometric sequence with positive x. What is x?","choices":["9","15","12","81"],"answer":"9","why":"In a geometric sequence, x/3 = 27/x. So x^2 = 81, and x = 9 since x is positive.","trap":"Averaging 3 and 27 to get 15, which is the arithmetic mean.","diff":2},{"id":"math-adv-029","part":"III","domain":"Mathematics","sub":"Geometric Sequences","q":"A geometric sequence has third term 12 and fifth term 48. What is the positive common ratio?","choices":["2","4","3","6"],"answer":"2","why":"a_5/a_3 = r^2 = 48/12 = 4. The positive square root is r = 2.","trap":"Dividing 48 by 12 and stopping at 4, which is r^2, not r.","diff":3},{"id":"math-adv-030","part":"III","domain":"Mathematics","sub":"Arithmetic Means","q":"Three arithmetic means are inserted between 2 and 18. What is the second mean?","choices":["10","8","12","14"],"answer":"10","why":"There are 4 equal steps from 2 to 18. d = (18 - 2)/4 = 4. The terms are 2, 6, 10, 14, 18.","trap":"Dividing the gap by 3 means instead of 4 steps.","diff":3},{"id":"math-adv-031","part":"III","domain":"Mathematics","sub":"Mean","q":"What is the mean of 4, 6, 8, 10, and 12?","choices":["8","7","9","10"],"answer":"8","why":"Sum = 4 + 6 + 8 + 10 + 12 = 40. Divide by 5: 40/5 = 8.","trap":"Dividing the sum by 4 instead of 5, which gives 10.","diff":1},{"id":"math-adv-032","part":"III","domain":"Mathematics","sub":"Median","q":"What is the median of 3, 7, 8, 10, 12, and 15?","choices":["9","8","10","8.5"],"answer":"9","why":"The data are already ordered. With 6 values, the median is the mean of the 3rd and 4th: (8 + 10)/2 = 9.","trap":"Reporting the 3rd value, 8, as the median of an even set.","diff":2},{"id":"math-adv-033","part":"III","domain":"Mathematics","sub":"Mode","q":"What is the mode of 2, 4, 4, 5, 7, 7, 7, 9?","choices":["7","4","5","9"],"answer":"7","why":"Count each value. 7 appears three times, 4 appears twice, and the others once. The mode is 7.","trap":"Choosing the largest value, 9, instead of the most frequent.","diff":1},{"id":"math-adv-034","part":"III","domain":"Mathematics","sub":"Range","q":"What is the range of 12, 7, 15, 9, and 20?","choices":["13","8","11","20"],"answer":"13","why":"Range = maximum - minimum = 20 - 7 = 13.","trap":"Reporting the maximum 20 instead of the spread.","diff":1},{"id":"math-adv-035","part":"III","domain":"Mathematics","sub":"Variance","q":"If 5 is added to every value in a data set, what happens to the variance?","choices":["It stays the same","It increases by 5","It increases by 25","It is multiplied by 5"],"answer":"It stays the same","why":"Adding a constant shifts every value and the mean by 5. Each deviation x - mean is unchanged, so the variance is unchanged.","trap":"Thinking the spread grows by 5, so the variance grows by 25.","diff":3},{"id":"math-adv-036","part":"III","domain":"Mathematics","sub":"Counting Principle","q":"A student has 4 shirts, 3 pairs of pants, and 2 pairs of shoes. How many different outfits can be formed?","choices":["24","9","12","48"],"answer":"24","why":"Multiply the choices: 4 × 3 × 2 = 24.","trap":"Adding the choices: 4 + 3 + 2 = 9.","diff":2},{"id":"math-adv-037","part":"III","domain":"Mathematics","sub":"Permutations","q":"What is P(6, 3)?","choices":["120","20","216","720"],"answer":"120","why":"P(6, 3) = 6!/(6 - 3)! = 6 × 5 × 4 = 120.","trap":"Computing C(6, 3) = 20, which ignores order.","diff":2},{"id":"math-adv-038","part":"III","domain":"Mathematics","sub":"Combinations","q":"A committee of 3 is chosen from 8 students. How many committees are possible?","choices":["56","336","24","28"],"answer":"56","why":"Order does not matter, so use C(8, 3) = 8!/(3!5!) = (8 × 7 × 6)/(3 × 2 × 1) = 56.","trap":"Using P(8, 3) = 336, which counts each committee 6 times.","diff":2},{"id":"math-adv-039","part":"III","domain":"Mathematics","sub":"Simple Probability","q":"A bag has 5 red and 3 blue marbles. One marble is drawn at random. What is P(red)?","choices":["5/8","3/8","5/3","1/2"],"answer":"5/8","why":"There are 5 red marbles out of 8 total. P(red) = 5/8.","trap":"Forming the ratio 5/3, which compares red to blue instead of red to total.","diff":1},{"id":"math-adv-040","part":"III","domain":"Mathematics","sub":"Complement","q":"If P(A) = 0.35, what is P(not A)?","choices":["0.65","0.55","0.75","0.35"],"answer":"0.65","why":"A and not A are complementary, so P(not A) = 1 - P(A) = 1 - 0.35 = 0.65.","trap":"Misaligning the decimal and computing 1.00 - 0.35 as 0.75.","diff":1},{"id":"math-adv-041","part":"III","domain":"Mathematics","sub":"Normal Curve","q":"In a normal distribution, about what percent of values lie between z = -1 and z = 1?","choices":["68%","95%","99.7%","50%"],"answer":"68%","why":"The empirical rule states that about 68% of values fall within one standard deviation of the mean.","trap":"Confusing the 68-95-99.7 bands and choosing 95% for one standard deviation.","diff":1},{"id":"math-adv-042","part":"III","domain":"Mathematics","sub":"z-score","q":"A test has mean 70 and standard deviation 5. What is the z-score of a score of 80?","choices":["2","10","0.5","1"],"answer":"2","why":"z = (x - mean)/standard deviation = (80 - 70)/5 = 10/5 = 2.","trap":"Stopping at x - mean = 10 and choosing 10.","diff":2},{"id":"math-adv-043","part":"III","domain":"Mathematics","sub":"Probability of Independent Events","q":"A and B are independent with P(A) = 0.5 and P(B) = 0.4. What is P(A and B)?","choices":["0.2","0.9","0.1","0.45"],"answer":"0.2","why":"For independent events, P(A and B) = P(A) × P(B) = 0.5 × 0.4 = 0.2.","trap":"Adding the probabilities to get 0.9, which is P(A or B) only for disjoint events.","diff":3},{"id":"math-adv-044","part":"III","domain":"Mathematics","sub":"Conic Sections","q":"What is the equation of the circle with center (2, -3) and radius 4?","choices":["(x - 2)^2 + (y + 3)^2 = 16","(x + 2)^2 + (y - 3)^2 = 16","(x - 2)^2 + (y - 3)^2 = 16","(x - 2)^2 + (y + 3)^2 = 4"],"answer":"(x - 2)^2 + (y + 3)^2 = 16","why":"Standard form is (x - h)^2 + (y - k)^2 = r^2. Here h = 2, k = -3, r^2 = 16.","trap":"Forgetting to flip the signs of h and k, or writing r instead of r^2.","diff":2},{"id":"math-adv-045","part":"III","domain":"Mathematics","sub":"Conic Sections","q":"For the parabola y^2 = 12x, where is the focus?","choices":["(3, 0)","(0, 3)","(12, 0)","(6, 0)"],"answer":"(3, 0)","why":"The form y^2 = 4px gives 4p = 12, so p = 3. The focus is (p, 0) = (3, 0).","trap":"Using 12 as the focal distance, or placing the focus on the y-axis.","diff":2},{"id":"math-adv-046","part":"III","domain":"Mathematics","sub":"Sigma Notation","q":"Evaluate the sum from k = 1 to 4 of (2k + 1).","choices":["24","21","25","20"],"answer":"24","why":"The terms are 3, 5, 7, 9. Their sum is 3 + 5 + 7 + 9 = 24.","trap":"Using k = 0 to 4, which adds an extra 1 and gives 25.","diff":2},{"id":"math-adv-047","part":"III","domain":"Mathematics","sub":"Limits","q":"What is the limit as x approaches 2 of (x^2 + 3x - 1)?","choices":["9","7","11","5"],"answer":"9","why":"The polynomial is continuous, so substitute x = 2: 4 + 6 - 1 = 9.","trap":"Computing 2^2 + 3 = 7 by dropping the x in 3x.","diff":1},{"id":"math-adv-048","part":"III","domain":"Mathematics","sub":"Limits","q":"What is the limit as x approaches 3 of (x^2 - 9)/(x - 3)?","choices":["6","0","3","does not exist"],"answer":"6","why":"Factor: (x - 3)(x + 3)/(x - 3) = x + 3 for x not equal to 3. The limit is 3 + 3 = 6.","trap":"Substituting directly, getting 0/0, and concluding the limit does not exist.","diff":2},{"id":"math-adv-049","part":"III","domain":"Mathematics","sub":"Conic Sections","q":"For the ellipse x^2/25 + y^2/9 = 1, what is the length of the major axis?","choices":["10","5","6","3"],"answer":"10","why":"a^2 = 25, so a = 5. The major axis has length 2a = 10.","trap":"Giving a = 5, which is the semi-major axis, or using b = 3.","diff":3},{"id":"math-adv-050","part":"III","domain":"Mathematics","sub":"Derivative Rules","q":"What is the derivative of x^5 with respect to x?","choices":["5x^4","x^4","5x^6","4x^5"],"answer":"5x^4","why":"Power rule: d/dx x^n = n x^(n - 1). Here n = 5, so the derivative is 5x^4.","trap":"Decreasing the exponent but keeping the coefficient, giving x^4.","diff":1},{"id":"math-adv-051","part":"III","domain":"Mathematics","sub":"Derivative Rules","q":"What is the derivative of 3x^2 - 4x + 7?","choices":["6x - 4","6x + 7","3x - 4","6x - 4 + 7"],"answer":"6x - 4","why":"Differentiate term by term: 3x^2 gives 6x, -4x gives -4, and 7 gives 0. The result is 6x - 4.","trap":"Keeping the constant 7 in the derivative.","diff":1},{"id":"math-adv-052","part":"III","domain":"Mathematics","sub":"Tangent Line","q":"What is the slope of the tangent line to y = x^2 at x = 3?","choices":["6","9","3","2"],"answer":"6","why":"The derivative is y' = 2x. At x = 3, the slope is 2(3) = 6.","trap":"Using the y-value 9, which is the height of the point, not the slope.","diff":2},{"id":"math-adv-053","part":"III","domain":"Mathematics","sub":"Maxima and Minima","q":"At what value of x does f(x) = x^2 - 6x + 5 reach its minimum?","choices":["3","-3","6","0"],"answer":"3","why":"f'(x) = 2x - 6. Set it to 0: 2x - 6 = 0, so x = 3.","trap":"Using -b/2a with the wrong sign, giving -3, or taking the constant term.","diff":2},{"id":"math-adv-054","part":"III","domain":"Mathematics","sub":"Rate of Change","q":"A particle moves along a line with position s(t) = 3t^2 + 2t meters. What is its velocity at t = 2 seconds?","choices":["14 m/s","12 m/s","16 m/s","8 m/s"],"answer":"14 m/s","why":"Velocity is s'(t) = 6t + 2. At t = 2, v = 12 + 2 = 14 m/s.","trap":"Evaluating the position s(2) = 16 instead of the derivative.","diff":3},{"id":"math-adv-055","part":"III","domain":"Mathematics","sub":"Derivative Rules","q":"What is the derivative of x^2(x + 1)?","choices":["3x^2 + 2x","2x","3x^2","2x(x + 1)"],"answer":"3x^2 + 2x","why":"Expand first: x^3 + x^2. Then differentiate: 3x^2 + 2x. The product rule gives the same result.","trap":"Differentiating each factor and multiplying: (2x)(1) = 2x.","diff":3},{"id":"math-alg-001","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Find the least common multiple of 12 and 18.","choices":["36","6","72","216"],"answer":"36","why":"12 = 2^2 × 3 and 18 = 2 × 3^2. Take the highest power of each prime: 2^2 × 3^2 = 36.","trap":"Choosing 6, the GCD, or 216, the product.","diff":1},{"id":"math-alg-002","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Find the greatest common divisor of 84 and 120.","choices":["12","6","24","4"],"answer":"12","why":"84 = 2^2 × 3 × 7 and 120 = 2^3 × 3 × 5. The shared prime powers give 2^2 × 3 = 12.","trap":"Using 24 because 120 has 2^3, but 24 does not divide 84.","diff":1},{"id":"math-alg-003","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"What is the remainder when 3^100 is divided by 5?","choices":["1","3","4","0"],"answer":"1","why":"Powers of 3 mod 5 cycle 3, 4, 2, 1 with length 4. Since 100 is a multiple of 4, the remainder is 1.","trap":"Assuming the answer is 3 because 3^100 starts with digit 3.","diff":2},{"id":"math-alg-004","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"The four-digit number 52d8 is divisible by 9, where d is one digit. Find d.","choices":["3","6","0","9"],"answer":"3","why":"A number is divisible by 9 when its digit sum is a multiple of 9. The sum is 15 + d, so 15 + d = 18 and d = 3.","trap":"Setting 15 + d = 15 and answering 0.","diff":2},{"id":"math-alg-005","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Two numbers are in the ratio 3:5 and their sum is 72. Find the larger number.","choices":["45","27","40","48"],"answer":"45","why":"The ratio has 3 + 5 = 8 parts. Each part is 72 / 8 = 9. The larger share is 5 × 9 = 45.","trap":"Reporting the smaller share, 3 × 9 = 27.","diff":2},{"id":"math-alg-006","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"A price drops from 250 pesos to 200 pesos. What is the percent decrease?","choices":["20%","25%","50%","80%"],"answer":"20%","why":"The decrease is 250 - 200 = 50. Percent decrease = 50 / 250 × 100 = 20%.","trap":"Dividing 50 by 200 to get 25%, which uses the new price as base.","diff":2},{"id":"math-alg-007","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Which of these numbers is prime?","choices":["89","87","91","93"],"answer":"89","why":"91 = 7 × 13, 87 = 3 × 29, and 93 = 3 × 31. Only 89 has no factor other than 1 and itself.","trap":"Choosing 91 because it is odd and ends in 1.","diff":2},{"id":"math-alg-008","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Five workers finish a job in 12 days. At the same rate, how long will 8 workers take?","choices":["7.5 days","19.2 days","8 days","6 days"],"answer":"7.5 days","why":"The job needs 5 × 12 = 60 worker-days. With 8 workers, 60 / 8 = 7.5 days.","trap":"Setting a direct proportion, 12 × 8 / 5 = 19.2 days.","diff":2},{"id":"math-alg-009","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"What is the remainder when 2^50 is divided by 7?","choices":["4","1","2","3"],"answer":"4","why":"2^3 = 8 leaves remainder 1 mod 7, so powers repeat every 3. 50 = 3 × 16 + 2, so the remainder equals 2^2 = 4.","trap":"Assuming the answer is 1 because 2^3 leaves remainder 1.","diff":3},{"id":"math-alg-010","part":"III","domain":"Mathematics","sub":"Arithmetic","q":"Two positive integers have product 1800 and GCD 30. Find their LCM.","choices":["60","30","54000","54"],"answer":"60","why":"For two positive integers, GCD × LCM equals the product. So LCM = 1800 / 30 = 60.","trap":"Multiplying 1800 by 30 to get 54000.","diff":3},{"id":"math-alg-011","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve for x: 3x - 7 = 11.","choices":["6","4","18","5"],"answer":"6","why":"Add 7 to both sides: 3x = 18. Divide by 3: x = 6.","trap":"Subtracting 7 to get 3x = 4.","diff":1},{"id":"math-alg-012","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve for x: 2(x - 3) = 10.","choices":["8","5","11","2"],"answer":"8","why":"Divide both sides by 2: x - 3 = 5. Add 3: x = 8.","trap":"Distributing as 2x - 3 = 10, which gives x = 6.5.","diff":1},{"id":"math-alg-013","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve the system x + y = 10 and x - y = 4. Find x.","choices":["7","3","6","4"],"answer":"7","why":"Add the two equations: 2x = 14, so x = 7. Then y = 3.","trap":"Subtracting to get 2y = 6 and reporting y = 3 as x.","diff":2},{"id":"math-alg-014","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve the system 3x + 2y = 16 and x - y = 2. Find x.","choices":["4","2","6","3"],"answer":"4","why":"From x - y = 2, x = y + 2. Substitute: 3y + 6 + 2y = 16, so 5y = 10, y = 2, x = 4.","trap":"Stopping at y = 2 and reporting it as x.","diff":2},{"id":"math-alg-015","part":"III","domain":"Mathematics","sub":"Algebra","q":"Factor completely: x^2 - 5x + 6.","choices":["(x - 2)(x - 3)","(x + 2)(x + 3)","(x - 1)(x - 6)","(x + 1)(x + 6)"],"answer":"(x - 2)(x - 3)","why":"Find two numbers with product 6 and sum -5: they are -2 and -3. So x^2 - 5x + 6 = (x - 2)(x - 3).","trap":"Using +2 and +3, which gives the middle term +5x.","diff":1},{"id":"math-alg-016","part":"III","domain":"Mathematics","sub":"Algebra","q":"Find the roots of x^2 + 2x - 15 = 0.","choices":["3 and -5","-3 and 5","3 and 5","-3 and -5"],"answer":"3 and -5","why":"Factor: x^2 + 2x - 15 = (x + 5)(x - 3). Set each factor to zero: x = -5 or x = 3.","trap":"Reading the factors as x = 5 and x = -3, which flips both signs.","diff":2},{"id":"math-alg-017","part":"III","domain":"Mathematics","sub":"Algebra","q":"Find the discriminant of 2x^2 - 4x + 5 = 0.","choices":["-24","24","56","-56"],"answer":"-24","why":"Here a = 2, b = -4, c = 5. Discriminant = b^2 - 4ac = 16 - 40 = -24.","trap":"Squaring -4 as -16, which gives -56.","diff":2},{"id":"math-alg-018","part":"III","domain":"Mathematics","sub":"Algebra","q":"Find the sum of the roots of x^2 - 7x + 10 = 0.","choices":["7","-7","10","-10"],"answer":"7","why":"For ax^2 + bx + c = 0, the sum of roots is -b/a. Here -(-7)/1 = 7.","trap":"Using b/a = -7.","diff":2},{"id":"math-alg-019","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve the inequality: 2x + 5 > 11.","choices":["x > 3","x < 3","x > 8","x < 8"],"answer":"x > 3","why":"Subtract 5 from both sides: 2x > 6. Divide by 2: x > 3.","trap":"Treating 5 as part of the coefficient to get 2x > 16, so x > 8.","diff":1},{"id":"math-alg-020","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve the inequality: -3x ≥ 12.","choices":["x ≤ -4","x ≥ -4","x ≤ 4","x ≥ 4"],"answer":"x ≤ -4","why":"Divide both sides by -3 and reverse the inequality sign: x ≤ -4.","trap":"Keeping x ≥ -4 by forgetting to flip the sign.","diff":2},{"id":"math-alg-021","part":"III","domain":"Mathematics","sub":"Algebra","q":"Simplify and give the value: 2^3 × 2^4.","choices":["128","64","256","49"],"answer":"128","why":"Add the exponents: 2^3 × 2^4 = 2^(3+4) = 2^7 = 128.","trap":"Adding the bases first and squaring 7 to get 49.","diff":1},{"id":"math-alg-022","part":"III","domain":"Mathematics","sub":"Algebra","q":"Simplify: (x^3)^2 × x^-4.","choices":["x^2","x^10","x^6","x^-2"],"answer":"x^2","why":"Multiply the inner exponents: (x^3)^2 = x^6. Then x^6 × x^-4 = x^(6-4) = x^2.","trap":"Adding exponents as 6 + 4 = 10 and ignoring the negative sign.","diff":2},{"id":"math-alg-023","part":"III","domain":"Mathematics","sub":"Algebra","q":"Add the polynomials: (x^2 + 3x - 4) + (2x^2 - x + 5).","choices":["3x^2 + 2x + 1","3x^2 + 4x + 1","3x^2 + 2x - 9","2x^2 + 2x + 1"],"answer":"3x^2 + 2x + 1","why":"Group like terms: (1 + 2)x^2 + (3 - 1)x + (-4 + 5) = 3x^2 + 2x + 1.","trap":"Adding -4 and 5 as -9 by adding their magnitudes.","diff":2},{"id":"math-alg-024","part":"III","domain":"Mathematics","sub":"Algebra","q":"Expand: (x + 3)(x - 3).","choices":["x^2 - 9","x^2 + 9","x^2 - 6x + 9","x^2 - 6x - 9"],"answer":"x^2 - 9","why":"This is a difference of squares: (x + 3)(x - 3) = x^2 - 3^2 = x^2 - 9.","trap":"Writing x^2 + 9 because the constants appear to add.","diff":1},{"id":"math-alg-025","part":"III","domain":"Mathematics","sub":"Algebra","q":"Divide (x^3 - 8) by (x - 2), for x not equal to 2.","choices":["x^2 + 2x + 4","x^2 + 4","x^2 - 2x + 4","x^2 - 4"],"answer":"x^2 + 2x + 4","why":"x^3 - 8 is a difference of cubes: (x - 2)(x^2 + 2x + 4). Cancel the factor x - 2.","trap":"Writing x^2 + 4 and dropping the middle term.","diff":3},{"id":"math-alg-026","part":"III","domain":"Mathematics","sub":"Algebra","q":"Find the remainder when x^3 - 2x + 1 is divided by x - 1.","choices":["0","1","-2","2"],"answer":"0","why":"By the remainder theorem, evaluate the polynomial at x = 1: 1 - 2 + 1 = 0.","trap":"Substituting x = -1 to get -1 + 2 + 1 = 2.","diff":2},{"id":"math-alg-027","part":"III","domain":"Mathematics","sub":"Algebra","q":"Simplify, for x not equal to 3 and x not equal to -4: (x^2 - 9) / (x^2 + x - 12).","choices":["(x + 3) / (x + 4)","(x - 3) / (x - 4)","(x + 3) / (x - 4)","(x - 3) / (x + 4)"],"answer":"(x + 3) / (x + 4)","why":"Factor: x^2 - 9 = (x - 3)(x + 3) and x^2 + x - 12 = (x + 4)(x - 3). Cancel x - 3.","trap":"Cancelling x^2 directly to leave -9 / (x - 12).","diff":2},{"id":"math-alg-028","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve for x: 2 / (x - 1) = 3 / (x + 2).","choices":["7","-7","1","-2"],"answer":"7","why":"Cross multiply: 2(x + 2) = 3(x - 1). So 2x + 4 = 3x - 3, which gives x = 7.","trap":"Distributing to get 2x + 4 = 3x + 3, which gives x = 1.","diff":3},{"id":"math-alg-029","part":"III","domain":"Mathematics","sub":"Algebra","q":"Simplify √50.","choices":["5√2","2√5","25√2","10√5"],"answer":"5√2","why":"Factor 50 as 25 × 2. Then √50 = √25 × √2 = 5√2.","trap":"Leaving 25 under the radical to get 25√2.","diff":2},{"id":"math-alg-030","part":"III","domain":"Mathematics","sub":"Algebra","q":"Solve for x: √(x + 7) = x - 5.","choices":["9","2","2 and 9","-2"],"answer":"9","why":"Square: x + 7 = x^2 - 10x + 25, so x^2 - 11x + 18 = 0 and x = 2 or 9. Check: x = 2 fails.","trap":"Keeping both roots because squaring hides the extraneous one.","diff":3},{"id":"math-alg-031","part":"III","domain":"Mathematics","sub":"Geometry","q":"A rectangle has length 12 cm and width 5 cm. Find its perimeter.","choices":["34 cm","60 cm","17 cm","29 cm"],"answer":"34 cm","why":"Perimeter = 2(length + width) = 2(12 + 5) = 2 × 17 = 34 cm.","trap":"Computing 12 × 5 = 60 cm, which is the area.","diff":1},{"id":"math-alg-032","part":"III","domain":"Mathematics","sub":"Geometry","q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","choices":["70°","40°","100°","140°"],"answer":"70°","why":"The base angles are equal. Each is (180 - 40) / 2 = 140 / 2 = 70°.","trap":"Halving the vertex angle to get 20°.","diff":1},{"id":"math-alg-033","part":"III","domain":"Mathematics","sub":"Geometry","q":"In two similar triangles, a side of 6 cm corresponds to 8 cm, and 9 cm corresponds to x. Find x.","choices":["12 cm","13.5 cm","10.5 cm","7 cm"],"answer":"12 cm","why":"Corresponding sides are proportional: 6/8 = 9/x. Cross multiply: 6x = 72, so x = 12 cm.","trap":"Applying the ratio 9/6 = 1.5 to 9 to get 13.5 cm.","diff":2},{"id":"math-alg-034","part":"III","domain":"Mathematics","sub":"Geometry","q":"Which condition always proves two triangles congruent?","choices":["SSS","AAA","SSA","AA"],"answer":"SSS","why":"SSS fixes all three sides, so the triangle is rigid. AAA and AA give only shape, and SSA is ambiguous.","trap":"Choosing SSA, which can produce two different triangles.","diff":2},{"id":"math-alg-035","part":"III","domain":"Mathematics","sub":"Geometry","q":"An angle is inscribed in a semicircle. What is its measure?","choices":["90°","180°","45°","60°"],"answer":"90°","why":"An inscribed angle is half its intercepted arc. The semicircle arc is 180°, so the angle is 90°.","trap":"Using the full 180° as the angle.","diff":1},{"id":"math-alg-036","part":"III","domain":"Mathematics","sub":"Geometry","q":"A central angle measures 80°. Find the inscribed angle that intercepts the same arc.","choices":["40°","80°","160°","20°"],"answer":"40°","why":"The central angle equals its arc, 80°. An inscribed angle on the same arc is half of it: 40°.","trap":"Doubling to 160° by applying the relation backwards.","diff":2},{"id":"math-alg-037","part":"III","domain":"Mathematics","sub":"Geometry","q":"A triangle has base 12 cm and height 9 cm. Find its area.","choices":["54 cm^2","108 cm^2","21 cm^2","27 cm^2"],"answer":"54 cm^2","why":"Area = (1/2) × base × height = (1/2) × 12 × 9 = 54 cm^2.","trap":"Forgetting the 1/2 to get 108 cm^2.","diff":1},{"id":"math-alg-038","part":"III","domain":"Mathematics","sub":"Geometry","q":"Find the area of a circle with radius 7 cm.","choices":["49π cm^2","14π cm^2","98π cm^2","7π cm^2"],"answer":"49π cm^2","why":"Area = πr^2 = π × 7^2 = 49π cm^2.","trap":"Using 2πr = 14π, which is the circumference.","diff":1},{"id":"math-alg-039","part":"III","domain":"Mathematics","sub":"Geometry","q":"Find the total surface area of a cube with edge 5 cm.","choices":["150 cm^2","125 cm^2","100 cm^2","30 cm^2"],"answer":"150 cm^2","why":"A cube has 6 square faces. Each face is 5^2 = 25 cm^2, so the total is 6 × 25 = 150 cm^2.","trap":"Computing 5^3 = 125, which is the volume.","diff":2},{"id":"math-alg-040","part":"III","domain":"Mathematics","sub":"Geometry","q":"Find the volume of a cylinder with radius 3 cm and height 10 cm.","choices":["90π cm^3","30π cm^3","60π cm^3","45π cm^3"],"answer":"90π cm^3","why":"Volume = πr^2h = π × 3^2 × 10 = 90π cm^3.","trap":"Using the cone formula (1/3)πr^2h = 30π cm^3.","diff":3},{"id":"math-alg-041","part":"III","domain":"Mathematics","sub":"Geometry","q":"Find the distance between points (1, 2) and (4, 6).","choices":["5","7","25","√7"],"answer":"5","why":"Distance = √((4 - 1)^2 + (6 - 2)^2) = √(9 + 16) = √25 = 5.","trap":"Stopping at 25 and forgetting the square root.","diff":2},{"id":"math-alg-042","part":"III","domain":"Mathematics","sub":"Geometry","q":"A cone has radius 3 cm and slant height 5 cm. Find its lateral surface area.","choices":["15π cm^2","24π cm^2","12π cm^2","9π cm^2"],"answer":"15π cm^2","why":"Lateral area = πrl = π × 3 × 5 = 15π cm^2.","trap":"Adding the base, 9π, to get 24π total surface area.","diff":3},{"id":"math-alg-043","part":"III","domain":"Mathematics","sub":"Trigonometry","q":"What is the exact value of sin 30°?","choices":["1/2","√3/2","√2/2","1"],"answer":"1/2","why":"In a 30-60-90 triangle the side opposite 30° is half the hypotenuse, so sin 30° = 1/2.","trap":"Choosing √3/2, which is cos 30°.","diff":1},{"id":"math-alg-044","part":"III","domain":"Mathematics","sub":"Trigonometry","q":"What is the exact value of tan 45°?","choices":["1","1/2","√3","√3/3"],"answer":"1","why":"At 45° the opposite and adjacent sides are equal, so tan 45° = 1/1 = 1.","trap":"Choosing √3, which is tan 60°.","diff":1},{"id":"math-alg-045","part":"III","domain":"Mathematics","sub":"Trigonometry","q":"In a right triangle, the side opposite θ is 3 and the hypotenuse is 5. Find sin θ.","choices":["3/5","4/5","3/4","4/3"],"answer":"3/5","why":"sin θ = opposite / hypotenuse = 3/5.","trap":"Using adjacent over hypotenuse, 4/5, which is cos θ.","diff":2},{"id":"math-alg-046","part":"III","domain":"Mathematics","sub":"Trigonometry","q":"In a right triangle, the side opposite θ is 5 and the adjacent side is 12. Find tan θ.","choices":["5/12","12/5","5/13","12/13"],"answer":"5/12","why":"tan θ = opposite / adjacent = 5/12. The hypotenuse is 13 but is not needed.","trap":"Using 5/13, which is sin θ.","diff":2},{"id":"math-alg-047","part":"III","domain":"Mathematics","sub":"Trigonometry","q":"Find the exact value of (sin 45°)(cos 45°).","choices":["1/2","1","√2/2","1/4"],"answer":"1/2","why":"sin 45° = cos 45° = √2/2. Their product is (√2/2)^2 = 2/4 = 1/2.","trap":"Adding the two values to get √2.","diff":2},{"id":"math-alg-048","part const KEY = 'dost.v1';
const PART_LABEL = {I:'Creative Reasoning + Language', II:'Science', III:'Mathematics'};
const PART_MIN = {I:45, II:65, III:70};
const MOCK_PER_PART = 40;
const VERBAL_SUBS = new Set(['Analogies','Odd One Out','Syllogisms and Logical Deduction','Sentence Completion','Vocabulary in Context']);
const GROUP_NOTE = {
  'Abstract Reasoning': 'Mechanical · Spatial · series · coding',
  'Verbal Reasoning': 'Analogies · logic · vocabulary',
  'Language and Literature': 'Grammar · reading · literature',
  'Science': 'Biology · Chemistry · Physics · Earth · Space',
  'Mathematics': 'Algebra · geometry · trig · stats · calculus',
};
const EXAM = '2026-11-15T00:00:00+08:00';

let S = load();
let view = 'home';
let pickPart = 'all';
let ses = null;
let tick = null;
let mock = null;
let mtick = null;
let mockPart = 'III';

function load(){
  try{
    const v = JSON.parse(localStorage.getItem(KEY));
    if(v && typeof v === 'object' && v.cards) return v;
  }catch(e){}
  return {cards:{}, missed:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function cs(id){
  if(!S.cards[id]) S.cards[id] = {box:0, seen:0, right:0, wrong:0};
  return S.cards[id];
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function mmss(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60) + ':' + pad(s%60);
}
function mmssUp(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + pad(s % 60);
}
function daysLeft(){
  return Math.ceil((new Date(EXAM) - Date.now()) / 864e5);
}
function groupOf(c){
  if(c.domain === 'Creative Reasoning') return VERBAL_SUBS.has(c.sub) ? 'Verbal Reasoning' : 'Abstract Reasoning';
  return c.domain;
}
function groupsOf(part){
  const m = new Map();
  for(const c of DECK){
    if(part !== 'all' && c.part !== part) continue;
    const g = groupOf(c);
    m.set(g, (m.get(g)||0) + 1);
  }
  return [...m.entries()];
}
function pool(part, domain){
  return DECK.filter(c => (part === 'all' || c.part === part) && (domain === 'all' || c.domain === domain));
}
function learned(){
  return DECK.filter(c => (S.cards[c.id]?.seen || 0) > 0).length;
}
function mastered(){
  return DECK.filter(c => (S.cards[c.id]?.box || 0) >= 3).length;
}
function accuracy(){
  let r = 0, w = 0;
  for(const c of DECK){ const s = S.cards[c.id]; if(s){ r += s.right; w += s.wrong; } }
  return r + w ? Math.round(100 * r / (r + w)) : 0;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  if(view === 'home') app.innerHTML = homeHTML();
  else if(view === 'study') app.innerHTML = studyHTML();
  else if(view === 'summary') app.innerHTML = sumHTML();
  else if(view === 'mock-setup') app.innerHTML = mockSetupHTML();
  else if(view === 'mock') app.innerHTML = mockHTML();
  else app.innerHTML = mockResultHTML();
  bind();
}

          <button class="btn primary" data-act="submittxt" ${ses.answered ? 'disabled' : ''}>Check</button>
        </div>`}
        ${fb}
      </div>
    </div>`;
}

  const total = ses.right + ses.wrong;
  const pct = total ? Math.round(100 * ses.right / total) : 0;
  const el = Date.now() - ses.t0;

/* ---------- session ---------- */
function startSession(part, domain, ids){
  if(mtick) clearInterval(mtick);
  mock = null;
  const cards = ids ? DECK.filter(c => ids.includes(c.id)) : pool(part, domain);
  if(!cards.length) return;
  const queue = cards
    .map(c => ({id: c.id, k: (S.cards[c.id]?.box || 0) + Math.random() * 1.4}))
    .sort((a, b) => a.k - b.k)
    .map(x => x.id);
  ses = {queue, i: 0, right: 0, wrong: 0, missed: [], answered: false, picked: null,
         order: null, part, domain, t0: Date.now()};
  view = 'study';
  if(tick) clearInterval(tick);
  tick = setInterval(() => {
    const el = document.getElementById('clock');
    if(!el || !ses) return;
    el.textContent = mmss(Date.now() - ses.t0);
    const limit = PART_MIN[DECK.find(c => c.id === ses.queue[ses.i])?.part] || 999;
    el.classList.toggle('over', (Date.now() - ses.t0) / 60000 > limit);
  }, 1000);
  startCard();
  render();
}

function nChoicesSafe(c){ return c.choices && c.choices.length > 0; }

function answer(txt){
  if(!ses || ses.answered) return;
  const c = DECK.find(x => x.id === ses.queue[ses.i]);
  if(!c) return;
  const s = cs(c.id);
  s.seen++; s.last = Date.now();
  ses.answered = true;
  ses.picked = txt;
  const norm = v => String(v).toLowerCase().replace(/\s+/g, ' ').trim();
  const ok = nChoicesSafe(c) ? txt === c.answer : norm(txt) === norm(c.answer);
  if(ok){ s.right++; s.box = Math.min(5, s.box + 1); ses.right++; }
  else { s.wrong++; s.box = 0; ses.wrong++; ses.missed.push(c.id); ses.queue.splice(ses.i + 2, 0, c.id); ses.requeued = true; }
  save(); render();
}

function next(){
  if(!ses) return;
  ses.i++;
  if(ses.i >= ses.queue.length){
    if(tick) clearInterval(tick);
    view = 'summary';
    render();
    return;
  }
  startCard();
  render();
}

function startCard(){
  ses.requeued = false;
  const id = ses.queue[ses.i];
  const c = DECK.find(x => x.id === id);
  ses.answered = false; ses.picked = null;
  ses.order = c.choices && c.choices.length ? shuffle(c.choices.slice()) : [];
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

          : `<span class="cell l">${esc(ch)}</span>`).join('')).join('')}</div>`
    : '';

  const choices = order.map((txt, i) =>
    `<button class="choice ${picked === txt ? 'sel' : ''}" data-pick="${esc(txt)}">
      <span class="k">${'ABCD'[i]}</span><span class="t">${esc(txt)}</span>
    </button>`).join('');

  const palette = mock.showPal
    ? `<div class="palette">${mock.ids.map((x, i) => {
        const cls = ['pbtn', mock.answers[x] ? 'done' : '', mock.flags[x] ? 'flag' : '', i === mock.i ? 'cur' : ''].join(' ');
        return `<button class="${cls}" data-goto="${i}" aria-label="Item ${i + 1}">${i + 1}</button>`;
      }).join('')}</div>`
    : '';

  const confirmBox = mock.confirm
    ? `<div class="modal"><div class="box">
        <h3>${mock.confirm === 'exit' ? 'Discard this run?' : 'Submit now?'}</h3>
        <p>${mock.confirm === 'exit'
          ? 'The clock is running. Leaving throws away this attempt.'
          : (mock.ids.length - answered) + ' of ' + mock.ids.length + ' items are unanswered. The score will count them as blank.'}</p>
        <div class="row">
          <button class="btn ghost" data-act="m-cancel">Keep going</button>
          <button class="btn primary" data-act="m-confirm">${mock.confirm === 'exit' ? 'Discard' : 'Submit'}</button>
        </div>
      </div></div>`
    : '';

  return `<div class="mockbar"><div class="in">
      <button class="x" data-act="m-exit" aria-label="Exit timed run">×</button>
      <span class="mclock" id="mclock">${mmssUp(Math.max(0, mock.deadline - Date.now()))}</span>
      <span class="mcount">${mock.i + 1}/${mock.ids.length}</span>
      <button class="mbtn" data-act="m-pal">${mock.showPal ? 'Hide' : 'Items'}</button>
      <button class="mbtn primary" data-act="m-submit">Submit</button>
    </div></div>
    <div class="wrap">
      ${palette}
      <div class="qcard">
        <div class="meta"><span>Part ${c.part}</span><span class="dot"></span><span>${esc(c.domain)}</span></div>
        <div class="subtle"><span>${esc(c.sub || '')}</span></div>
        <h2 class="q">${esc(c.q)}</h2>
        ${grid}
        <div class="choices">${choices}</div>
      </div>
      <div class="nav3">
        <button class="btn" data-act="m-prev" ${mock.i === 0 ? 'disabled' : ''}>Prev</button>
        <button class="btn" data-act="m-flag">${flagged ? 'Unflag' : 'Flag'}</button>
        <button class="btn primary" data-act="${last ? 'pal' : 'next'}">${last ? 'Review' : 'Next'}</button>
      </div>
      <div class="kbd-hint"><kbd>1-4</kbd> answer · <kbd>←</kbd><kbd>→</kbd> move · <kbd>Esc</kbd> exit</div>
    </div>
    ${confirmBox}`;
}

function mockResultHTML(){
  const r = mock && mock.result;
  if(!r) return mockSetupHTML();
  const total = r.items.length;
  const pct = total ? Math.round(100 * r.right / total) : 0;
  const missed = r.items.filter(x => !x.ok);
  const doms = Object.entries(r.per);
  return `<div class="wrap top">
    <p class="sub">Timed run complete · ${r.ms ? mmss(r.ms) : '0:00'} used</p>
    <div class="big">${pct}%</div>
    <p class="sub">${r.right} of ${total} correct · ${r.wrong} wrong · ${r.blank} blank</p>
    <div class="sumgrid">
      <div class="stat"><div class="n">${r.right}</div><div class="l">Right</div></div>
      <div class="stat"><div class="n">${r.wrong}</div><div class="l">Wrong</div></div>
      <div class="stat"><div class="n">${r.blank}</div><div class="l">Blank</div></div>
    </div>
    <h2 class="sec">By domain</h2>
    ${doms.map(([d, v]) => `<div class="domrow"><span>${esc(d)}</span><span>${v.r}/${v.t}</span></div>`).join('')}
    ${missed.length ? `<h2 class="sec">Missed items</h2>
      ${missed.map(x => `<div class="rv">
        <div class="qq">${esc(x.c.q)}</div>
        <div class="aa">${x.picked ? `You picked <span class="you">${esc(x.picked)}</span>.` : 'Left blank.'} Answer: <b>${esc(x.c.answer)}</b>.</div>
        <div class="aa">${esc(x.c.why || '')}</div>
      </div>`).join('')}` : ''}
    <div class="actions" style="margin-top:22px">
      <button class="btn ghost" data-act="m-home">Home</button>
      <button class="btn primary" data-act="m-retake">Retake</button>
    </div>
  </div>`;
}

function startMock(){
  const parts = mockPart === 'all' ? ['I', 'II', 'III'] : [mockPart];
  const ids = [];
  for(const p of parts){
    const pool = DECK.filter(c => c.part === p).map(c => c.id);
    ids.push(...shuffle(pool.slice()).slice(0, Math.min(MOCK_PER_PART, pool.length)));
  }
  if(!ids.length) return;
  const minutes = parts.reduce((sum, p) => sum + PART_MIN[p], 0);
  mock = {
    ids, answers: {}, flags: {}, orders: {}, i: 0,
    startedAt: Date.now(), deadline: Date.now() + minutes * 60000,
    scope: mockPart, showPal: false, confirm: null, result: null,
  };
  for(const id of ids){
    const c = DECK.find(x => x.id === id);
    mock.orders[id] = shuffle((c.choices || []).slice());
  }
  if(ses){ ses = null; }
  if(tick) clearInterval(tick);
  view = 'mock';
  startMockClock();
  render();
}

function startMockClock(){
  if(mtick) clearInterval(mtick);
  mtick = setInterval(() => {
    if(!mock){ clearInterval(mtick); return; }
    const left = Math.max(0, mock.deadline - Date.now());
    const el = document.getElementById('mclock');
    if(el) el.textContent = mmssUp(left);
    if(el) el.classList.toggle('low', left < 60000);
    if(left <= 0){ clearInterval(mtick); submitMock(true); }
  }, 500);
}

function submitMock(auto){
  if(!mock) return;
  if(!auto){
    const blanks = mock.ids.filter(id => !mock.answers[id]).length;
    mock.confirm = blanks ? 'submit' : null;
    if(!blanks){ finishMock(); return; }
    render();
    return;
  }
  finishMock();
}

function finishMock(){
  if(mtick) clearInterval(mtick);
  const items = mock.ids.map(id => {
    const c = DECK.find(x => x.id === id);
    const picked = mock.answers[id] || null;
    return {id, c, picked, ok: !!picked && picked === c.answer};
  });
  const right = items.filter(x => x.ok).length;
  const blank = items.filter(x => !x.picked).length;
  const wrong = items.length - right - blank;
  const per = {};
  for(const it of items){
    const d = it.c.domain;
    per[d] = per[d] || {r: 0, t: 0};
    per[d].t++;
    if(it.ok) per[d].r++;
  }
  for(const it of items){
    if(!it.picked) continue;
    const st = cs(it.id);
    st.seen++; st.last = Date.now();
    if(it.ok){ st.right++; st.box = Math.min(5, st.box + 1); }
    else { st.wrong++; st.box = 0; }
  }
  save();
  mock.result = {items, right, wrong, blank, per, ms: Date.now() - mock.startedAt};
  mock.confirm = null;
  view = 'mock-result';
  render();
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-part-pick]').forEach(b =>
    b.onclick = () => { pickPart = b.dataset.partPick; render(); });

  const start = document.getElementById('start');
  if(start) start.onclick = () => startSession(pickPart, 'all');

  document.querySelectorAll('[data-group]').forEach(b =>
    b.onclick = () => {
      const g = b.dataset.group;
      const ids = DECK.filter(c => groupOf(c) === g && (pickPart === 'all' || c.part === pickPart)).map(c => c.id);
      startSession('all', 'all', ids);
    });

  const reset = document.getElementById('reset');
  if(reset) reset.onclick = () => {
    if(confirm('Reset all progress on this device?')){ S = {cards:{}, missed:[]}; save(); render(); }
  };

  document.querySelectorAll('[data-choice]').forEach(b =>
    b.onclick = () => answer(b.dataset.choice));

  const exit = document.querySelector('[data-act="exit"]');
  if(exit) exit.onclick = () => { if(tick) clearInterval(tick); ses = null; view = 'home'; render(); };

  const again = document.querySelector('[data-act="again"]');
  if(again) again.onclick = () => {
    if(ses){ if(!ses.requeued) ses.queue.splice(ses.i + 2, 0, ses.queue[ses.i]); next(); }
  };

  const sub = document.querySelector('[data-act="submittxt"]');
  if(sub) sub.onclick = () => {
    const el = document.getElementById('typed');
    if(el) answer(el.value.trim());
  };
  const typed = document.getElementById('typed');
  if(typed) typed.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); answer(typed.value.trim()); } };

  const nx = document.querySelector('[data-act="next"]');
  if(nx) nx.onclick = next;

  const home = document.querySelector('[data-act="home"]');
  if(home) home.onclick = () => { ses = null; if(mtick) clearInterval(mtick); mock = null; view = 'home'; render(); };

  const home2 = document.querySelector('[data-act="home2"]');
  if(home2) home2.onclick = () => { ses = null; view = 'home'; render(); };

  const drill = document.querySelector('[data-act="drill"]');
  if(drill) drill.onclick = () => {
    const ids = [...new Set(ses.missed)];
    ses = null;
    startSession('all', 'all', ids);
  };

  /* timed mock */
  document.querySelectorAll('[data-mp]').forEach(b =>
    b.onclick = () => { mockPart = b.dataset.mp; render(); });
  const mstart = document.getElementById('mockStart');
  if(mstart) mstart.onclick = startMock;
  const mback = document.getElementById('mockBack');
  if(mback) mback.onclick = () => { view = 'home'; render(); };
  const mopen = document.getElementById('mock');
  if(mopen) mopen.onclick = () => { view = 'mock-setup'; render(); };

  document.querySelectorAll('[data-pick]').forEach(b =>
    b.onclick = () => {
      if(!mock) return;
      mock.answers[mock.ids[mock.i]] = b.dataset.pick;
      render();
    });
  document.querySelectorAll('[data-goto]').forEach(b =>
    b.onclick = () => { if(mock){ mock.i = +b.dataset.goto; render(); } });

  const act = (name, fn) => {
    const el = document.querySelector('[data-act="' + name + '"]');
    if(el) el.onclick = fn;
  };
  act('m-prev', () => { if(mock && mock.i > 0){ mock.i--; render(); } });
  act('m-next', () => { if(mock && mock.i < mock.ids.length - 1){ mock.i++; render(); } });
  act('m-flag', () => {
    if(!mock) return;
    const id = mock.ids[mock.i];
    if(mock.flags[id]) delete mock.flags[id]; else mock.flags[id] = true;
    render();
  });
  act('m-pal', () => { if(mock){ mock.showPal = !mock.showPal; render(); } });
  act('m-submit', () => submitMock(false));
  act('m-cancel', () => { if(mock){ mock.confirm = null; render(); } });
  act('m-exit', () => { if(mock){ mock.confirm = 'exit'; render(); } });
  act('m-confirm', () => {
    if(!mock) return;
    if(mock.confirm === 'exit'){
      if(mtick) clearInterval(mtick);
      mock = null; view = 'home'; render();
    } else {
      finishMock();
    }
  });
  act('m-retake', () => { if(mock) mockPart = mock.scope; startMock(); });
  act('m-home', () => {
    if(mtick) clearInterval(mtick);
    mock = null; view = 'home'; render();
  });
}

document.addEventListener('keydown', e => {
  if(view === 'mock' && mock){
    if(mock.confirm){
      if(e.key === 'Enter'){ e.preventDefault(); document.querySelector('[data-act="m-confirm"]')?.click(); }
      return;
    }
    if(e.key === 'Escape'){ mock.confirm = 'exit'; render(); return; }
    if(/^[1-4]$/.test(e.key)){
      const txt = (mock.orders[mock.ids[mock.i]] || [])[+e.key - 1];
      if(txt !== undefined){ mock.answers[mock.ids[mock.i]] = txt; render(); }
      return;
    }
    if(e.key === 'ArrowRight' || e.key === 'Enter'){
      if(mock.i < mock.ids.length - 1){ mock.i++; render(); }
      e.preventDefault();
      return;
    }
    if(e.key === 'ArrowLeft'){ if(mock.i > 0){ mock.i--; render(); } return; }
    return;
  }
  if(view !== 'study' || !ses) {
    if(e.key === 'Escape' && view === 'summary'){ ses = null; view = 'home'; render(); }
    return;
  }
  if(e.key === 'Escape'){ if(tick) clearInterval(tick); ses = null; view = 'home'; render(); return; }
  if(e.key === 'Enter' || e.key === ' '){
    if(ses.answered) next();
    e.preventDefault();
    return;
  }
  if(/^[1-4]$/.test(e.key) && !ses.answered){
    const txt = (ses.order || [])[+e.key - 1];
    if(txt !== undefined) answer(txt);
  }
});

/* boot */
if('serviceWorker' in navigator && window.isSecureContext){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

if(!DECK.length){
  document.getElementById('app').innerHTML = '<div class="wrap top"><h1>No cards</h1><p class="sub">Run <code>node build.mjs</code> to build the deck.</p></div>';
} else {
  render();
}
</script>
</body>
</html>
