<!doctype html>
<html lang="en">
<head>

<title>DOST-SEI Reviewer</title>

<meta property="og:description" content="470 offline flashcards and a formula cheatsheet for the DOST-SEI Scholarship Examination.">

<style>
:root{
  --bg:#f6f4ef; --surface:#fff; --ink:#17191c; --muted:#6a6f76; --line:#e3ded4;
  --accent:#146b56; --accent-ink:#fff; --good:#1a7f4b; --bad:#b4322b;
  --radius:14px; --shadow:0 1px 2px rgba(20,22,26,.05),0 10px 28px -16px rgba(20,22,26,.35);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11131a;--surface:#1a1d24;--ink:#e9e6df;--muted:#99a0aa;--line:#2a2f39;
  --accent:#4ec9a4;--accent-ink:#0b241d;--good:#3fbf7f;--bad:#ef6b60;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;font-weight:650}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.sub b{color:var(--ink)}
.pill{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:12.5px;font-weight:650;letter-spacing:.01em;vertical-align:1px}
.top{padding-top:calc(26px + env(safe-area-inset-top))}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;overflow:auto}
.seg button{flex:1 0 auto;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stat-row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
.stat-row:hover{border-color:var(--accent)}
.stat-row .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat-row .nm{font-weight:600}
.stat-row .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat-row .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:4px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
footer{margin-top:30px;color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
footer button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;padding:0 16px;width:100%;transition:transform .06s,border-color .12s}
.btn:active{transform:scale(.995)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--muted)}

/* study */
.hud{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 9px}
.hud .in{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;padding:0 18px}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:19px;line-height:1}
.x:hover{background:var(--surface);color:var(--ink)}
.pbar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock.over{color:var(--bad)}
.qcard{margin-top:20px}
.meta{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);display:inline-block}
.diff{letter-spacing:1px;color:var(--muted)}
.subtle{font-size:12px;color:var(--muted);margin:4px 0 0;display:flex;gap:8px;align-items:center}
.subtle .diff{margin-left:2px}
.q{font-size:21px;line-height:1.4;letter-spacing:-.01em;margin:12px 0 18px;font-weight:650}
.choices{margin-top:2px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;min-height:52px;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:1px}
.choice .t{flex:1;padding-top:1px}
.choice.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.choice.correct .k{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.choice.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;padding:13px 15px}
.fb.bad{border-left-color:var(--bad)}
.fb .h{font-size:13px;font-weight:700;margin-bottom:4px}
.fb .h.ok{color:var(--good)}
.fb .h.no{color:var(--bad)}
.fb p{margin:0;font-size:14.5px;line-height:1.55}
.fb .trap{margin-top:8px;font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}
.kbd-hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:14px}
kbd{font:inherit;font-size:11px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.typed{display:flex;gap:10px;margin-top:4px}
.typed input{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.typed input:focus{outline:2px solid var(--accent);outline-offset:1px}
.typed .btn{width:auto;padding:0 18px}

/* grid figure */
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;max-width:min(190px,44vw);margin:2px 0 18px;padding:4px;border-radius:8px;background:color-mix(in srgb,var(--line) 40%,transparent)}
.grid .cell{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;background:color-mix(in srgb,var(--surface) 70%,transparent);font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.grid .cell.f{background:var(--ink)}
.grid .cell.l{background:transparent}

/* timed mock */
.mockbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 0}
.mockbar .in{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:0 18px}
.mclock{font-variant-numeric:tabular-nums;font-weight:750;font-size:16px;letter-spacing:-.01em;min-width:62px}
.mclock.low{color:var(--bad)}
.mcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:650;min-height:38px}
.mbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0 4px;max-height:152px;overflow:auto}
.pbtn{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface);padding:0}
.pbtn.done{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:transparent;color:var(--accent);font-weight:700}
.pbtn.flag{box-shadow:inset 0 0 0 2px #c98a12}
.pbtn.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(8,10,14,.55);display:grid;place-items:center;padding:22px;z-index:30}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 18px;font-size:14px;color:var(--muted);line-height:1.5}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--muted);margin-top:14px}
.rv{border-top:1px solid var(--line);padding:13px 0}
.rv .qq{font-weight:600;font-size:14.5px;line-height:1.45}
.rv .aa{font-size:13px;margin-top:7px;color:var(--muted)}
.rv .aa b{color:var(--good);font-weight:650}
.rv .aa .you{color:var(--bad)}
.domrow{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.domrow span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}

/* summary */
.big{font-size:44px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 0}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.missed{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px;margin:8px 0}
@media (max-width:420px){
  h1{font-size:24px}
  .q{font-size:19px}
  .stat .n{font-size:19px}
}
</style>
</head>

<script>
const DECK = [{"id":"abs2-001","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 6, 11, 16, 21, 26, ___.","choices":["30","31","32","36"],"answer":"31","why":"Each term is 5 more than the one before: 26 + 5 = 31. The next term would be 36, so the gap stays 5.","trap":"Adding 6 to 26 to answer 32, or doubling the gap to answer 36.","diff":1},{"id":"abs2-002","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 3, 6, 12, 24, 48, ___.","choices":["72","84","96","108"],"answer":"96","why":"Each term doubles: 48 x 2 = 96. Doubling again gives 192, so the rule holds.","trap":"Using gaps 3, 6, 12, 24, 36 and answering 84.","diff":1},{"id":"abs2-003","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 2, 10, 5, 20, 8, 30, 11, 40, ___.","choices":["13","14","44","50"],"answer":"14","why":"Two sequences interleave. Odd places go 2, 5, 8, 11, so add 3: 14. Even places go 10, 20, 30, 40.","trap":"Adding 10 to 40 and answering 50, or adding 2 to 11 and answering 13.","diff":2},{"id":"abs2-004","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 3, 4, 8, 15, 25, ___.","choices":["35","38","40","42"],"answer":"38","why":"Gaps are 1, 4, 7, 10, which rise by 3 each time. The next gap is 13, so 25 + 13 = 38.","trap":"Repeating the gap 10 and answering 35.","diff":2},{"id":"abs2-005","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 1, 4, 9, 16, 25, ___.","choices":["32","34","36","40"],"answer":"36","why":"These are squares: 1, 4, 9, 16, 25, 36. The gaps 3, 5, 7, 9, 11 also give 25 + 11 = 36.","trap":"Keeping the gap at 9 and answering 34.","diff":1},{"id":"abs2-006","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 1, 8, 27, 64, 125, ___.","choices":["196","216","250","343"],"answer":"216","why":"These are cubes: 1, 8, 27, 64, 125, 216. The next cube is 343, so 6^3 = 216 fits.","trap":"Doubling 125 to answer 250, or jumping to 7^3 = 343.","diff":2},{"id":"abs2-007","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 3, 7, 15, 31, 63, ___.","choices":["95","127","128","131"],"answer":"127","why":"Each term is double the one before, plus 1: 2 x 63 + 1 = 127. The next term is 2 x 127 + 1 = 255.","trap":"Doubling 63 to answer 128, or repeating gap 32 to answer 95.","diff":2},{"id":"abs2-008","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 2, 3, 5, 8, 13, 21, ___.","choices":["26","29","34","36"],"answer":"34","why":"Each term is the sum of the two before it: 13 + 21 = 34. The next term is 21 + 34 = 55.","trap":"Repeating the last gap 8 and answering 29.","diff":2},{"id":"abs2-009","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 3, 5, 7, 11, 13, 17, ___.","choices":["18","19","21","23"],"answer":"19","why":"These are the primes in order: 3, 5, 7, 11, 13, 17, 19. The next prime is 23.","trap":"Treating 21 as prime and answering 21.","diff":2},{"id":"abs2-010","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 2, 6, 24, 120, 720, ___.","choices":["4320","5040","6720","7200"],"answer":"5040","why":"Multiply by 3, then 4, then 5, then 6: 720 x 7 = 5040. The next term is 5040 x 8 = 40320.","trap":"Multiplying 720 by 6 again and answering 4320.","diff":3},{"id":"abs2-011","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 14, 19, 29, 40, 44, 52, 59, ___.","choices":["66","68","73","77"],"answer":"73","why":"Add the digit sum of each term: 14 + 5 = 19, 19 + 10 = 29, and so on. 59 + 14 = 73. The next term is 83.","trap":"Adding the last gap 7 again and answering 66.","diff":3},{"id":"abs2-012","part":"I","domain":"Creative Reasoning","sub":"Number Series","q":"Find the next term: 51, 50, 47, 41, 31, ___.","choices":["15","16","17","21"],"answer":"16","why":"Subtract 1, 3, 6, 10, 15 in turn. The steps are triangular, so 31 - 15 = 16. The next term is 16 - 21 = -5.","trap":"Repeating the last step of 10 and answering 21.","diff":3},{"id":"abs2-013","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"Find the next letter: C, F, I, L, O, ___.","choices":["P","Q","R","S"],"answer":"R","why":"Each letter moves 3 places forward: C, F, I, L, O, R. The next letter is U.","trap":"Counting C as 1 and shifting the series, answering Q.","diff":1},{"id":"abs2-014","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"Find the next letter: A, C, F, J, O, ___.","choices":["T","U","V","W"],"answer":"U","why":"The skips grow by one: 2, 3, 4, 5, 6. O plus 6 places is U. The next skip of 7 gives B.","trap":"Keeping the skip at 5 and answering T.","diff":2},{"id":"abs2-015","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"Find the next letter: A, Z, C, X, E, V, ___.","choices":["F","G","H","I"],"answer":"G","why":"Odd places move forward 2: A, C, E, G. Even places move back 2: Z, X, V. The blank is odd, so G.","trap":"Adding 3 to E to answer H, as if the forward skips grew.","diff":2},{"id":"abs2-016","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"What comes next? O, T, T, F, F, S, S, ___.","choices":["E","N","S","T"],"answer":"E","why":"These are the first letters of one, two, three, four, five, six, seven. Eight starts with E. Nine starts with N.","trap":"Repeating S because the last two letters are S.","diff":2},{"id":"abs2-017","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"Find the next letter: Z, X, V, T, R, ___.","choices":["N","O","P","Q"],"answer":"P","why":"Each letter moves 2 places back in the alphabet: Z, X, V, T, R, P. The next letter is N.","trap":"Moving back one place and answering Q.","diff":1},{"id":"abs2-018","part":"I","domain":"Creative Reasoning","sub":"Letter Series","q":"Find the next letter: A, B, E, D, I, F, O, H, ___.","choices":["J","S","T","U"],"answer":"U","why":"Odd places are the vowels A, E, I, O, U. Even places are consonants B, D, F, H. The blank is odd, so U.","trap":"Continuing the consonants H, J and answering J.","diff":2},{"id":"abs2-019","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"If CAT is coded as FDW, how is DOG coded?","choices":["FRJ","GRJ","GRK","GSJ"],"answer":"GRJ","why":"Each letter shifts 3 places forward: C to F, A to D, T to W. So D, O, G become G, R, J.","trap":"Shifting only the first letter and answering FRJ, or slipping a place to answer GRK.","diff":1},{"id":"abs2-020","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"If NOTE is coded as GVQP, how is LAMP coded?","choices":["NCOR","PMAL","ROCN","RODN"],"answer":"ROCN","why":"Reverse the word, then shift each letter 2 forward. LAMP reversed is PMAL, which becomes R, O, C, N.","trap":"Shifting without reversing, giving NCOR.","diff":2},{"id":"abs2-021","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"Letters map to positions, so A=1, B=2, up to Z=26. If CAB is 3,1,2, what is FAD?","choices":["5,1,4","6,1,3","6,1,4","6,4,1"],"answer":"6,1,4","why":"F is 6, A is 1, and D is 4, so FAD is 6,1,4 in order. The position of A is 1, not 0.","trap":"Using A=0 and answering 5,1,4.","diff":1},{"id":"abs2-022","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"Each letter shifts forward by its place in the word: first by 1, second by 2, third by 3. If CAT becomes DCW, what is DOG?","choices":["EPJ","EQJ","EQK","FQJ"],"answer":"EQJ","why":"D plus 1 is E, O plus 2 is Q, G plus 3 is J. So DOG becomes EQJ.","trap":"Adding 4 to G and answering EQK, as if the shift kept growing.","diff":2},{"id":"abs2-023","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"Letters shift +3, then -2, then +3, then -2, and so on. If CAT becomes FYW, what is BOLD?","choices":["ELOB","EMNB","EMOB","FMOB"],"answer":"EMOB","why":"B plus 3 is E, O minus 2 is M, L plus 3 is O, D minus 2 is B. So BOLD becomes EMOB.","trap":"Subtracting 3 instead of 2 from O and answering ELOB.","diff":3},{"id":"abs2-024","part":"I","domain":"Creative Reasoning","sub":"Coding and Decoding","q":"In a code each letter moves 3 places back. If TRIM becomes QOFJ, what is STOP?","choices":["PQKM","PQLM","PQLN","PPLM"],"answer":"PQLM","why":"S minus 3 is P, T minus 3 is Q, O minus 3 is L, P minus 3 is M. So STOP becomes PQLM.","trap":"Subtracting 2 from the last letter and answering PQLN.","diff":2},{"id":"abs2-025","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these are perfect squares: 9, 25, 36, 42, 49. Which is not?","choices":["9","25","36","42"],"answer":"42","why":"9, 25, 36, and 49 are the squares of 3, 5, 6, and 7. 42 is not a square, since 6^2 = 36 and 7^2 = 49.","trap":"Calling 42 a square because it sits between 36 and 49.","diff":1},{"id":"abs2-026","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these are prime numbers: 11, 13, 15, 17, 19. Which is not?","choices":["11","13","15","17"],"answer":"15","why":"11, 13, 17, and 19 have no divisors except 1 and themselves. 15 equals 3 x 5, so it is composite.","trap":"Treating 15 as prime because it is odd.","diff":1},{"id":"abs2-027","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these are multiples of 7: 21, 28, 35, 42, 48. Which is not?","choices":["21","35","42","48"],"answer":"48","why":"21, 28, 35, and 42 are 3x7, 4x7, 5x7, and 6x7. 48 leaves a remainder of 6 when divided by 7.","trap":"Assuming 48 is a multiple because 42 and 49 are close.","diff":2},{"id":"abs2-028","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these are perfect cubes: 27, 64, 81, 125, 216. Which is not?","choices":["27","64","81","125"],"answer":"81","why":"27, 64, 125, and 216 are 3^3, 4^3, 5^3, and 6^3. 81 is 9^2 or 3^4, not a cube.","trap":"Calling 81 a cube because it is a power of 3.","diff":2},{"id":"abs2-029","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these divide 120 exactly: 8, 12, 15, 16, 24. Which does not?","choices":["8","15","16","24"],"answer":"16","why":"120 divided by 8, 12, 15, and 24 gives whole numbers. 120 divided by 16 is 7.5, so 16 does not divide 120 exactly.","trap":"Assuming every even number below 24 divides 120.","diff":3},{"id":"abs2-030","part":"I","domain":"Creative Reasoning","sub":"Number Odd One Out","q":"Four of these are triangular numbers: 10, 15, 21, 28, 35. Which is not?","choices":["10","15","28","35"],"answer":"35","why":"Triangular numbers add 1, 2, 3, and so on: 1, 3, 6, 10, 15, 21, 28, 36. So 35 is not triangular.","trap":"Extending gaps 5, 6, 7 with another 7 and accepting 35 as triangular.","diff":3},{"id":"mech-001","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"Gear A has 10 teeth and drives gear B with 40 teeth. If A turns 4 revolutions, how many does B turn?","choices":["1","4","10","160"],"answer":"1","why":"Teeth engaged must match: 10 x 4 = 40 x n, so n = 1 revolution.","trap":"Assuming both gears turn the same number of revolutions.","diff":1},{"id":"mech-002","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"Gear A meshes directly with gear B. If gear A turns clockwise, which way does gear B turn?","choices":["Clockwise","Counterclockwise","It does not turn","It turns clockwise then counterclockwise"],"answer":"Counterclockwise","why":"Two meshed gears turn in opposite directions because their teeth push against each other at the contact point.","trap":"Reading the direction as the same for both gears.","diff":1},{"id":"mech-003","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"Gear A (20 teeth) drives gear B (40 teeth). Gear C (10 teeth) shares the shaft of B and drives gear D (30 teeth). If A turns 6 times, how many times does D turn?","choices":["0.5","1","2","3"],"answer":"1","why":"B turns 20 x 6 / 40 = 3 times. C turns 3 times. D turns 10 x 3 / 30 = 1 time.","trap":"Forgetting that gears on one shaft turn at the same speed.","diff":3},{"id":"mech-004","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"A 20-tooth gear drives a 10-tooth idler, which drives a 40-tooth gear. If the 20-tooth gear turns 4 times, how many times does the 40-tooth gear turn?","choices":["1","2","4","8"],"answer":"2","why":"The idler does not change the ratio: 20 x 4 = 40 x n, so n = 2 turns.","trap":"Using the idler's 10 teeth in the ratio and getting 8 turns.","diff":2},{"id":"mech-005","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"A small gear drives a large gear. Which statement is correct?","choices":["The large gear turns faster and with less torque.","The large gear turns slower and with more torque.","Both gears turn at the same speed.","The large gear turns slower and with less torque."],"answer":"The large gear turns slower and with more torque.","why":"Speed falls in the same ratio that torque rises. A larger driven gear turns slower but delivers more turning force.","trap":"Assuming a slower gear must also be weaker.","diff":2},{"id":"mech-006","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"Gears A, B and C are in a line, with A meshed to B and B meshed to C. If A turns clockwise, which way does C turn?","choices":["Clockwise","Counterclockwise","It stays still","It alternates"],"answer":"Clockwise","why":"Each mesh reverses direction. A to B is one reversal and B to C is a second, so C turns clockwise like A.","trap":"Counting only one reversal and answering counterclockwise.","diff":2},{"id":"mech-007","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"A bicycle chainring has 40 teeth and the rear sprocket has 20 teeth. How many turns does the rear wheel make for each turn of the pedals?","choices":["0.5","1","2","20"],"answer":"2","why":"Teeth must match: 40 x 1 = 20 x n, so n = 2 turns.","trap":"Dividing the smaller number by the larger and getting 0.5.","diff":2},{"id":"mech-008","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"What is the main effect of adding an idler gear between a driving gear and a driven gear?","choices":["It increases the speed ratio.","It reverses the output direction compared with direct meshing, without changing the ratio.","It doubles the torque.","It stops the driven gear from turning."],"answer":"It reverses the output direction compared with direct meshing, without changing the ratio.","why":"An idler adds one more mesh, so the output turns the same way as the input. Its tooth count cancels out of the ratio.","trap":"Thinking the idler's size changes the overall speed ratio.","diff":3},{"id":"mech-009","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"Two gears are fixed on the same shaft. How do their rotation speeds compare?","choices":["The larger gear turns faster.","The smaller gear turns faster.","They turn at the same speed.","It depends on the number of teeth."],"answer":"They turn at the same speed.","why":"One shaft makes one turn for both gears. Tooth count changes torque, not the shared shaft speed.","trap":"Applying the teeth ratio to gears on one shaft.","diff":1},{"id":"mech-010","part":"I","domain":"Creative Reasoning","sub":"Gears","q":"A 10-tooth driver gear turns a 50-tooth driven gear. What is the gear ratio of driver to driven?","choices":["1:5","5:1","1:50","50:1"],"answer":"1:5","why":"Ratio = driver teeth : driven teeth = 10 : 50 = 1 : 5.","trap":"Writing the ratio as driven to driver, which gives 5:1.","diff":2},{"id":"mech-011","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"A single fixed pulley is used to lift a load. What is its mechanical advantage?","choices":["0.5","1","2","4"],"answer":"1","why":"A fixed pulley changes the direction of the force but not its size. Effort equals load, so MA = 1.","trap":"Assuming the pulley doubles the force because the rope doubles back.","diff":1},{"id":"mech-012","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"A movable pulley supports a 100 N load with two rope segments. Neglecting friction, what effort is needed?","choices":["25 N","50 N","100 N","200 N"],"answer":"50 N","why":"Two rope segments share the load: effort = 100 / 2 = 50 N.","trap":"Using one rope segment and answering 100 N.","diff":1},{"id":"mech-013","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"A block and tackle has four rope segments supporting the movable block. What effort lifts a 400 N load? Neglect friction.","choices":["50 N","100 N","200 N","400 N"],"answer":"100 N","why":"The mechanical advantage equals the number of supporting segments: 400 / 4 = 100 N.","trap":"Counting the rope you pull as an extra segment and dividing by 5.","diff":2},{"id":"mech-014","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"A pulley system has a mechanical advantage of 3. To raise a load by 2 m, how much rope must be pulled?","choices":["0.67 m","2 m","6 m","12 m"],"answer":"6 m","why":"Work is conserved: effort distance = MA x load distance = 3 x 2 m = 6 m.","trap":"Dividing by 3 and answering 0.67 m.","diff":2},{"id":"mech-015","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"Pulley A has a diameter of 10 cm and drives pulley B, diameter 30 cm, by a belt. If A turns at 300 rpm, what is the speed of B?","choices":["100 rpm","150 rpm","300 rpm","900 rpm"],"answer":"100 rpm","why":"Belt speed is constant: 10 x 300 = 30 x n, so n = 100 rpm.","trap":"Multiplying by 3 and answering 900 rpm.","diff":2},{"id":"mech-016","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"Two pulleys are joined by a crossed belt. How do they turn?","choices":["In the same direction","In opposite directions","At different speeds only","They cannot turn"],"answer":"In opposite directions","why":"A crossed belt twists between the pulleys, so the driven pulley turns opposite to the driver.","trap":"Confusing a crossed belt with an open belt, which keeps the same direction.","diff":2},{"id":"mech-017","part":"I","domain":"Creative Reasoning","sub":"Pulleys","q":"A 60 kg load hangs at rest from a rope over a fixed pulley. Use g = 10 m/s^2. What is the tension in the rope?","choices":["6 N","60 N","600 N","1200 N"],"answer":"600 N","why":"At rest the tension balances the weight: T = mg = 60 x 10 = 600 N.","trap":"Doubling the weight for both rope sides and answering 1200 N.","diff":2},{"id":"mech-018","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A seesaw has the fulcrum between the two riders. Which class of lever is it?","choices":["First class","Second class","Third class","It is not a lever"],"answer":"First class","why":"In a first-class lever the fulcrum lies between the effort and the load, as on a seesaw.","trap":"Placing the load between fulcrum and effort, which describes second class.","diff":1},{"id":"mech-019","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A wheelbarrow carries its load between the wheel axle and the handles. Which class of lever is it?","choices":["First class","Second class","Third class","A pulley system"],"answer":"Second class","why":"The axle is the fulcrum, the load sits in the middle, and the effort is at the handles. Load between fulcrum and effort means second class.","trap":"Calling it first class because the handles feel like a lever bar.","diff":1},{"id":"mech-020","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"Tweezers are squeezed in the middle and grip at the tips. Which class of lever are they?","choices":["First class","Second class","Third class","No class"],"answer":"Third class","why":"The effort acts between the fulcrum and the load. That arrangement is third class and gives MA below 1.","trap":"Assuming a gripping tool must multiply force.","diff":1},{"id":"mech-021","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A load of 200 N sits 0.5 m from the fulcrum of a lever. How much effort at 2 m from the fulcrum balances it?","choices":["25 N","50 N","100 N","400 N"],"answer":"50 N","why":"Moments balance: 200 x 0.5 = F x 2, so F = 100 / 2 = 50 N.","trap":"Multiplying instead of dividing and answering 400 N.","diff":2},{"id":"mech-022","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A 30 kg child sits 2 m from the fulcrum of a seesaw. How far from the fulcrum must a 60 kg child sit to balance?","choices":["0.5 m","1 m","2 m","4 m"],"answer":"1 m","why":"30 x 2 = 60 x d, so d = 60 / 60 = 1 m.","trap":"Moving the heavier child twice as far out.","diff":2},{"id":"mech-023","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A 2 m stick balances a 30 N load at one end against a 10 N effort at the other end. How far is the fulcrum from the load?","choices":["0.5 m","0.67 m","1 m","1.5 m"],"answer":"0.5 m","why":"Let x be the load arm. 30x = 10(2 - x), so 40x = 20 and x = 0.5 m.","trap":"Splitting the stick in half and answering 1 m.","diff":3},{"id":"mech-024","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A force of 20 N acts at 3 m from a pivot. What is the moment about the pivot?","choices":["6.7 N m","23 N m","60 N m","600 N m"],"answer":"60 N m","why":"Moment = force x perpendicular distance = 20 x 3 = 60 N m.","trap":"Dividing force by distance and answering 6.7 N m.","diff":1},{"id":"mech-025","part":"I","domain":"Creative Reasoning","sub":"Levers","q":"A 1.5 m crowbar is used as a first-class lever. The fulcrum is 0.3 m from the load. What effort at the far end lifts a 400 N load?","choices":["80 N","100 N","200 N","1333 N"],"answer":"100 N","why":"Load arm is 0.3 m and effort arm is 1.2 m. 400 x 0.3 = F x 1.2, so F = 100 N.","trap":"Using the full 1.5 m as the effort arm and getting 80 N.","diff":3},{"id":"mech-026","part":"I","domain":"Creative Reasoning","sub":"Simple Machines","q":"A ramp is 2 m long and 0.5 m high. What effort pushes a 400 N load up the ramp? Neglect friction.","choices":["100 N","200 N","400 N","1600 N"],"answer":"100 N","why":"Ideal MA = length / height = 2 / 0.5 = 4. Effort = 400 / 4 = 100 N.","trap":"Using the ratio upside down and multiplying by 4.","diff":2},{"id":"mech-027","part":"I","domain":"Creative Reasoning","sub":"Simple Machines","q":"An inclined plane lets you raise a load with less force. What must you give up?","choices":["You must push the load over a longer distance.","You must use a heavier load.","The load gains more potential energy.","You must push at a steeper angle."],"answer":"You must push the load over a longer distance.","why":"Work in equals work out when friction is ignored. Less force means more distance along the slope.","trap":"Believing a machine can reduce both force and distance.","diff":1},{"id":"mech-028","part":"I","domain":"Creative Reasoning","sub":"Simple Machines","q":"A screw has a pitch of 2 mm. How far does it advance in 5 full turns?","choices":["0.4 mm","2 mm","10 mm","25 mm"],"answer":"10 mm","why":"One turn advances one pitch: 5 x 2 mm = 10 mm.","trap":"Dividing by the number of turns and answering 0.4 mm.","diff":2},{"id":"mech-029","part":"I","domain":"Creative Reasoning","sub":"Simple Machines","q":"An axe blade is 20 cm long and 4 cm thick at the back. What is its ideal mechanical advantage as a wedge?","choices":["0.2","4","5","80"],"answer":"5","why":"For a wedge, MA = length / thickness = 20 / 4 = 5.","trap":"Multiplying length by thickness and answering 80.","diff":2},{"id":"mech-030","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"Two identical bulbs are connected in series with a battery. One bulb is removed. What happens to the other bulb?","choices":["It stays lit at full brightness.","It goes out.","It becomes brighter.","It flashes once then stays lit."],"answer":"It goes out.","why":"A series circuit has only one path. Removing a bulb breaks that path, so no current flows.","trap":"Treating the series circuit as if each bulb had its own path.","diff":1},{"id":"mech-031","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"Two identical bulbs are connected in parallel with a battery. One bulb is removed. What happens to the other bulb?","choices":["It stays lit at about the same brightness.","It goes out.","It becomes dimmer.","It becomes much brighter."],"answer":"It stays lit at about the same brightness.","why":"Each parallel branch has its own path to the battery, so the remaining branch still gets the full voltage.","trap":"Applying the series rule and saying both bulbs go out.","diff":1},{"id":"mech-032","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"A 12 V battery is connected to resistors of 4 ohms and 2 ohms in series. What current flows?","choices":["0.5 A","2 A","3 A","6 A"],"answer":"2 A","why":"Series resistance adds: R = 4 + 2 = 6 ohms. Then I = V / R = 12 / 6 = 2 A.","trap":"Using only one resistor and answering 3 A or 6 A.","diff":2},{"id":"mech-033","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"A 6 ohm resistor and a 3 ohm resistor are connected in parallel. What is the total resistance?","choices":["1.5 ohms","2 ohms","4.5 ohms","9 ohms"],"answer":"2 ohms","why":"1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6, so R = 2 ohms.","trap":"Adding the resistances as if they were in series.","diff":3},{"id":"mech-034","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"Two identical bulbs are in series. How does each bulb compare with a single bulb on the same battery?","choices":["Each is brighter.","Each is dimmer.","Each is at the same brightness.","Each is off."],"answer":"Each is dimmer.","why":"Two bulbs in series double the resistance and halve the current. Each then gets a quarter of the single-bulb power, so both are dimmer.","trap":"Assuming each bulb still receives the full battery voltage.","diff":2},{"id":"mech-035","part":"I","domain":"Creative Reasoning","sub":"Circuits","q":"A circuit has two parallel branches. A switch sits in branch 1 only. What happens to branch 2 when the switch opens?","choices":["Branch 2 stays lit.","Branch 2 goes out.","Branch 2 gets brighter.","Branch 2 reverses current."],"answer":"Branch 2 stays lit.","why":"The switch breaks only branch 1. Branch 2 keeps its own path to the battery.","trap":"Treating the whole parallel circuit as one series loop.","diff":2},{"id":"spa-001","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"Two stacks of unit cubes stand on a table. One stack is 3 cubes high and the other is 2 cubes high. How many cubes are there in total?","choices":["4","5","6","7"],"answer":"5","why":"Each column stands on its own. Total = 3 + 2 = 5 cubes.","trap":"Multiplying the heights instead of adding them.","diff":1},{"id":"spa-002","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"Four stacks of unit cubes on a table have heights 2, 2, 3 and 1. How many cubes are used?","choices":["6","7","8","9"],"answer":"8","why":"Add the column heights: 2 + 2 + 3 + 1 = 8 cubes.","trap":"Counting only the visible top cubes and answering 4.","diff":1},{"id":"spa-003","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A model has a 2 by 2 base of unit cubes. The stack heights are 2 at front-left, 1 at front-right, 3 at back-left and 2 at back-right. How many cubes are used?","choices":["8","9","10","12"],"answer":"8","why":"Add all four column heights: 2 + 1 + 3 + 2 = 8 cubes.","trap":"Reading only the front row and answering 3.","diff":2},{"id":"spa-004","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A solid rectangular block is 4 cubes long, 3 cubes wide and 2 cubes high. How many unit cubes does it contain?","choices":["9","12","24","36"],"answer":"24","why":"Volume in unit cubes = length x width x height = 4 x 3 x 2 = 24.","trap":"Adding the dimensions instead of multiplying them.","diff":1},{"id":"spa-005","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A 3 by 3 by 2 block of unit cubes loses one corner column that is 2 cubes high. How many cubes remain?","choices":["12","14","16","18"],"answer":"16","why":"The block has 3 x 3 x 2 = 18 cubes. Removing the 2-cube column leaves 16.","trap":"Forgetting that the removed column holds 2 cubes, not 1.","diff":2},{"id":"spa-006","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A staircase is built from unit cubes. The four steps are 1, 2, 3 and 4 cubes high, and each step is one cube wide and one cube deep. How many cubes are used?","choices":["4","8","10","24"],"answer":"10","why":"Each step is a column: 1 + 2 + 3 + 4 = 10 cubes.","trap":"Counting only the top cube of each step and answering 4.","diff":2},{"id":"spa-007","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A 2 by 2 by 2 cube of unit cubes has one corner cube removed. How many cubes remain?","choices":["4","6","7","8"],"answer":"7","why":"The cube starts with 2 x 2 x 2 = 8 unit cubes. Removing one corner leaves 7.","trap":"Assuming the corner cube hides other cubes, which it does not.","diff":2},{"id":"spa-008","part":"I","domain":"Creative Reasoning","sub":"Block Counting","q":"A tower has a 3 by 3 base layer, then a 2 by 2 layer centred on top, then 1 cube on top. How many cubes are used?","choices":["10","12","14","18"],"answer":"14","why":"Add the layers: 9 + 4 + 1 = 14 cubes.","trap":"Counting only the outside cubes of each layer.","diff":3},{"id":"spa-009","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape. Which option is its 90 degree clockwise rotation?","choices":["Two squares side by side ending at the top-right corner, plus one square directly below the right square.","Two squares side by side starting at the top-left corner, plus one square directly below the left square.","Two squares side by side at the right end of the bottom row, plus one square directly above the right square.","Two squares stacked at the bottom of the left edge, plus one square to the right of the bottom square."],"answer":"Two squares side by side ending at the top-right corner, plus one square directly below the right square.","why":"A 90 degree clockwise turn sends the top row to the right column. The corner at top-left moves to top-right.","trap":"Keeping the corner at top-left, which is the original figure.","diff":2,"grid":["##.","#..","..."]},{"id":"spa-010","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape with a vertical bar and one extra square. Which option is its mirror image across a vertical line?","choices":["A vertical bar of three squares on the right edge, plus one square to the left of the middle square.","A vertical bar of three squares on the left edge, plus one square to the right of the middle square.","A horizontal bar of three squares along the top edge, plus one square below the middle square.","A horizontal bar of three squares along the bottom edge, plus one square above the middle square."],"answer":"A vertical bar of three squares on the right edge, plus one square to the left of the middle square.","why":"A vertical mirror flips left and right. The bar moves to the right edge and the single square stays on the middle row.","trap":"Leaving the bar on the left edge, which is the original figure.","diff":2,"grid":["#..","##.","#.."]},{"id":"spa-011","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape. Which option is its 180 degree rotation?","choices":["A vertical bar of three squares on the right edge, plus one square to the left of the top square.","A vertical bar of three squares on the left edge, plus one square to the right of the bottom square.","A vertical bar of three squares on the right edge, plus one square to the left of the bottom square.","A vertical bar of three squares on the left edge, plus one square to the right of the top square."],"answer":"A vertical bar of three squares on the right edge, plus one square to the left of the top square.","why":"A half turn moves the bar from the left edge to the right edge and moves the foot from the bottom to the top.","trap":"Mirroring left and right only, which leaves the foot at the bottom.","diff":3,"grid":["#..","#..","##."]},{"id":"spa-012","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape. Which option is its mirror image across a horizontal line?","choices":["Two squares side by side at the left end of the bottom row, plus one square above the right square.","Two squares side by side at the left end of the top row, plus one square below the right square.","Two squares side by side at the right end of the bottom row, plus one square above the left square.","Two squares side by side at the right end of the top row, plus one square below the left square."],"answer":"Two squares side by side at the left end of the bottom row, plus one square above the right square.","why":"A horizontal mirror flips top and bottom. The pair keeps its left position and drops to the bottom row.","trap":"Leaving the pair in the top row, which is the original figure.","diff":1,"grid":["##.",".#.","..."]},{"id":"spa-013","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"How many lines of symmetry does a square have?","choices":["1","2","4","8"],"answer":"4","why":"Two lines join midpoints of opposite sides, and two are the diagonals. All four are symmetry lines.","trap":"Counting only the two midpoint lines and answering 2.","diff":1},{"id":"spa-014","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"A clock hand points to 12. It turns 90 degrees clockwise. Where does it point?","choices":["3","6","9","12"],"answer":"3","why":"A quarter turn clockwise from 12 moves the hand three hour marks, which is 3.","trap":"Turning counterclockwise and answering 9.","diff":1},{"id":"spa-015","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"Which capital letter looks the same after a mirror reflection across a vertical line?","choices":["A","B","E","F"],"answer":"A","why":"A has a vertical line of symmetry, so its left and right halves swap without change.","trap":"Choosing a letter that has only a horizontal symmetry line.","diff":1},{"id":"spa-016","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape. Which option is its mirror image across a vertical line?","choices":["Top row: left and right squares. Middle row: three squares. Bottom row: right square only.","Top row: left and right squares. Middle row: three squares. Bottom row: left square only.","Top row: right square only. Middle row: three squares. Bottom row: left and right squares.","Top row: left square only. Middle row: three squares. Bottom row: left and right squares."],"answer":"Top row: left and right squares. Middle row: three squares. Bottom row: right square only.","why":"The vertical mirror keeps every row in place and flips the columns. Only the single bottom square changes side.","trap":"Moving the full middle row, which a vertical mirror never does.","diff":3,"grid":["#.#","###","#.."]},{"id":"spa-017","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"A figure is rotated 90 degrees clockwise twice. Which single transformation gives the same result?","choices":["A 90 degree clockwise rotation","A 180 degree rotation","A 270 degree clockwise rotation","A reflection across a vertical line"],"answer":"A 180 degree rotation","why":"Two quarter turns add to a half turn: 90 + 90 = 180 degrees.","trap":"Doubling the first turn into a full 360 degree rotation.","diff":2},{"id":"spa-018","part":"I","domain":"Creative Reasoning","sub":"Rotation and Reflection","q":"The grid shows a shape. Which option is its 90 degree counterclockwise rotation?","choices":["Squares at top-left, top-middle, middle-right and bottom-right.","Squares at top-right, middle-right, bottom-left and bottom-middle.","Squares at top-left, middle-left, bottom-middle and bottom-right.","Squares at top-middle, top-right, middle-left and bottom-left."],"answer":"Squares at top-left, top-middle, middle-right and bottom-right.","why":"A counterclockwise quarter turn lifts the right column onto the top row and swings the bottom row up into the right column.","trap":"Turning clockwise and answering the option with two squares on the left edge.","diff":3,"grid":["..#","..#","##."]},{"id":"spa-019","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A square sheet is folded once in half. One hole is punched through both layers. How many holes show when the sheet is unfolded?","choices":["1","2","3","4"],"answer":"2","why":"Each punch passes through two layers, so unfolding gives two matching holes.","trap":"Counting the punch once and answering 1.","diff":1},{"id":"spa-020","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A square sheet is folded in half three times, giving eight layers. One hole is punched through the packet. How many holes appear when it is fully unfolded?","choices":["2","4","6","8"],"answer":"8","why":"Every layer receives one hole. Eight layers give eight holes.","trap":"Adding the folds instead of multiplying the layers.","diff":2},{"id":"spa-021","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A sheet is folded in half twice, giving four layers. Three holes are punched through the packet. How many holes appear when it is unfolded?","choices":["6","8","12","16"],"answer":"12","why":"Each punch makes one hole in each of the four layers: 3 x 4 = 12 holes.","trap":"Adding 3 and 4 instead of multiplying them.","diff":2},{"id":"spa-022","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A square sheet is folded once along a vertical line. A hole is punched 2 cm from the folded edge. How far apart are the two holes when the sheet is unfolded?","choices":["1 cm","2 cm","4 cm","8 cm"],"answer":"4 cm","why":"Each hole lies 2 cm from the crease, on opposite sides. The gap is 2 + 2 = 4 cm.","trap":"Answering 2 cm by counting the distance to the fold only once.","diff":2},{"id":"spa-023","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A sheet is folded in half once. A hole is punched through both layers. Which statement about the unfolded holes is correct?","choices":["They are the same distance from the fold line, on opposite sides.","They lie on the fold line.","One hole is twice as large as the other.","Only one hole appears."],"answer":"They are the same distance from the fold line, on opposite sides.","why":"The fold acts as a mirror. Each hole maps to a twin placed the same distance on the other side.","trap":"Placing both holes on the same side of the fold.","diff":2},{"id":"spa-024","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A square sheet is folded along one diagonal. One hole is punched through both layers. How many holes appear when it is unfolded?","choices":["1","2","3","4"],"answer":"2","why":"A diagonal fold also makes two layers. One punch gives two holes, mirrored across the diagonal.","trap":"Assuming a diagonal fold makes four layers.","diff":2},{"id":"spa-025","part":"I","domain":"Creative Reasoning","sub":"Paper Folding","q":"A square sheet is folded along one diagonal, then folded again along the other diagonal. How many layers does the final packet have?","choices":["2","3","4","8"],"answer":"4","why":"The first diagonal fold doubles the sheet to 2 layers. The second fold halves the triangle and gives 4 layers.","trap":"Adding the two folds and answering 2 layers.","diff":3},{"id":"spa-026","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"The grid shows the net of a cube. Which labelled face is opposite face A?","choices":["B","C","D","F"],"answer":"F","why":"The strip BCDE wraps into a ring. A and F fold onto the top and bottom faces, so they are opposite.","trap":"Choosing D because it sits next to A in the drawing.","diff":2,"grid":["..A.","BCDE","..F."]},{"id":"spa-027","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"A cube is painted on all six faces, then cut into 27 equal small cubes. How many small cubes have exactly two painted faces?","choices":["6","8","12","18"],"answer":"12","why":"Two-face cubes sit on the 12 edges, one per edge, because each edge is 3 cubes long and the corners are excluded.","trap":"Counting the 8 corner cubes, which have three painted faces.","diff":3},{"id":"spa-028","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"The grid shows the net of a cube. Which labelled face is opposite face C?","choices":["A","D","E","F"],"answer":"F","why":"Folding puts C at the front and F at the back. A pairs with D, and B pairs with E.","trap":"Choosing E because it is farthest along the net from C.","diff":3,"grid":["AB..",".CD.","..EF"]},{"id":"spa-029","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"Faces P, Q and R of a cube meet at one corner. Which statement must be true?","choices":["No two of P, Q and R are opposite each other.","P and Q are opposite each other.","R is opposite P.","All three faces are parallel."],"answer":"No two of P, Q and R are opposite each other.","why":"Faces that share a corner also share edges, so they are neighbours. Opposite faces never touch.","trap":"Assuming any two named faces must be opposite.","diff":2},{"id":"spa-030","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"Which property must a valid net of a cube have?","choices":["Six squares joined edge to edge that fold without overlap.","Six squares of equal size joined only at their corners.","Exactly four squares in a row.","Eight squares that fold into four faces."],"answer":"Six squares joined edge to edge that fold without overlap.","why":"A cube has six faces. The net must join them along real edges so the folded shape closes with no gap or overlap.","trap":"Accepting a net joined only at corners, which cannot fold into a solid.","diff":1},{"id":"spa-031","part":"I","domain":"Creative Reasoning","sub":"Nets","q":"A cube net has four squares in a straight row. Within that row, which squares end up opposite?","choices":["The first and third, and the second and fourth.","The first and second, and the third and fourth.","The first and fourth, and the second and third.","All four end up on the same face."],"answer":"The first and third, and the second and fourth.","why":"Rolling four squares into a ring puts each square two positions away on the opposite side of the cube.","trap":"Pairing neighbours that share an edge in the net.","diff":3},{"id":"spa-032","part":"I","domain":"Creative Reasoning","sub":"Series","q":"What number comes next: 2, 6, 12, 20, 30, ?","choices":["36","40","42","44"],"answer":"42","why":"The differences grow by 2: 4, 6, 8, 10. The next difference is 12, so 30 + 12 = 42.","trap":"Adding 10 again and answering 40.","diff":2},{"id":"spa-033","part":"I","domain":"Creative Reasoning","sub":"Series","q":"What number comes next: 81, 27, 9, 3, ?","choices":["0","1","2","3"],"answer":"1","why":"Each term is divided by 3: 3 / 3 = 1.","trap":"Subtracting 3 again and answering 0.","diff":1},{"id":"spa-034","part":"I","domain":"Creative Reasoning","sub":"Series","q":"What number comes next: 1, 4, 9, 16, ?","choices":["20","24","25","32"],"answer":"25","why":"The terms are square numbers: 1^2, 2^2, 3^2, 4^2. The next is 5^2 = 25.","trap":"Adding the last difference and answering 24.","diff":1},{"id":"spa-035","part":"I","domain":"Creative Reasoning","sub":"Series","q":"A marker points up at step 1. It turns 90 degrees clockwise at each step. In which direction does it point at step 5?","choices":["Up","Right","Down","Left"],"answer":"Up","why":"The directions cycle up, right, down, left. Step 5 repeats step 1, so the marker points up.","trap":"Counting five fresh turns from up and answering right.","diff":2},{"id":"verb-001","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"PEN is to WRITE as KNIFE is to ___.","choices":["sharp","cut","metal","kitchen"],"answer":"cut","why":"A pen is the tool used for writing; a knife is the tool used for cutting. The relation is tool to function.","trap":"Choosing sharp or metal, which describe the knife as an object, not what it does.","diff":1},{"id":"verb-002","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"PETAL is to FLOWER as BRANCH is to ___.","choices":["leaf","tree","wood","bark"],"answer":"tree","why":"A petal is a part of a flower; a branch is a part of a tree. The relation is part to whole.","trap":"Choosing leaf, which is also a plant part at the same level, not the whole.","diff":2},{"id":"verb-003","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"SPARK is to FIRE as GERM is to ___.","choices":["disease","sick","clean","hospital"],"answer":"disease","why":"A spark starts a fire; a germ starts a disease. The relation is cause to effect.","trap":"Choosing sick, which is an adjective for a state, not the effect noun.","diff":2},{"id":"verb-004","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"WARM is to HOT as COOL is to ___.","choices":["cold","chilly","mild","ice"],"answer":"cold","why":"Warm and hot are light and strong degrees on one scale. Cool and cold mirror that same jump in degree.","trap":"Choosing chilly, which is only slightly stronger than cool and breaks the matched gap.","diff":1},{"id":"verb-005","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"ROSE is to FLOWER as TIGER is to ___.","choices":["animal","claw","stripes","jungle"],"answer":"animal","why":"A rose is a kind of flower; a tiger is a kind of animal. The relation is member to category.","trap":"Choosing stripes or claw, which are parts of a tiger, not the class it belongs to.","diff":2},{"id":"verb-006","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"DOCTOR is to PATIENT as TEACHER is to ___.","choices":["student","school","lesson","chalk"],"answer":"student","why":"A doctor serves a patient; a teacher serves a student. The relation is professional to the person served.","trap":"Choosing school or lesson, which are the workplace and the material, not the person served.","diff":1},{"id":"verb-007","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"SCALPEL is to SURGEON as HAMMER is to ___.","choices":["carpenter","nail","wood","toolbox"],"answer":"carpenter","why":"A scalpel is the tool a surgeon wields; a hammer is the tool a carpenter wields. Tool to user.","trap":"Choosing nail, which is what the hammer strikes, not who wields it.","diff":2},{"id":"verb-008","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"CHAPTER is to BOOK as SCENE is to ___.","choices":["play","actor","stage","audience"],"answer":"play","why":"A chapter is a division of a book; a scene is a division of a play. Part to whole.","trap":"Choosing stage, which is where a play is performed, not the work that is divided.","diff":2},{"id":"verb-009","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"DRIZZLE is to DOWNPOUR as WHISPER is to ___.","choices":["shout","speak","silence","murmur"],"answer":"shout","why":"Drizzle and downpour are light and heavy rain; whisper and shout are soft and loud speech. Degree of the same act.","trap":"Choosing speak, the general verb, which drops the intensity relation.","diff":3},{"id":"verb-010","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"EXERCISE is to STRENGTH as STUDY is to ___.","choices":["knowledge","teacher","book","exam"],"answer":"knowledge","why":"Exercise builds strength; study builds knowledge. The relation is activity to the result it produces.","trap":"Choosing book or teacher, which are inputs to study, not the result.","diff":2},{"id":"verb-011","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"THERMOMETER is to TEMPERATURE as SCALE is to ___.","choices":["weight","height","time","volume"],"answer":"weight","why":"A thermometer measures temperature; a scale measures weight. Instrument to the quantity it measures.","trap":"Choosing time, because scale also means a timetable, which is not a measuring instrument here.","diff":1},{"id":"verb-012","part":"I","domain":"Creative Reasoning","sub":"Analogies","q":"CAUTIOUS is to PARANOID as CONFIDENT is to ___.","choices":["arrogant","shy","calm","certain"],"answer":"arrogant","why":"Cautious is reasonable care; paranoid is that same trait in excess. Confident is reasonable self-assurance; arrogant is that trait in excess.","trap":"Choosing certain, which repeats the meaning of confident instead of showing its excess.","diff":3},{"id":"verb-013","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which word does not belong? triangle, square, circle, pentagon","choices":["triangle","square","circle","pentagon"],"answer":"circle","why":"A triangle, a square, and a pentagon are polygons with straight sides and corners. A circle has no straight sides and no corners.","trap":"Choosing pentagon because it has the most sides, but pentagon still has straight sides and corners, so it fits the rule.","diff":1},{"id":"verb-014","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which does not belong? jeepney, bus, tricycle, ferry","choices":["jeepney","bus","tricycle","ferry"],"answer":"ferry","why":"A jeepney, a bus, and a tricycle travel on roads. A ferry travels on water.","trap":"Choosing tricycle because it is the smallest vehicle, but it still runs on the road, so it fits the rule.","diff":2},{"id":"verb-015","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which word does not belong? happy, joyful, elated, furious","choices":["happy","joyful","elated","furious"],"answer":"furious","why":"Happy, joyful, and elated name pleasant emotions. Furious names anger.","trap":"Choosing elated because it looks strongest, but elated still names a pleasant emotion, so it fits the rule.","diff":1},{"id":"verb-016","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which number does not belong? 2, 4, 7, 8","choices":["2","4","7","8"],"answer":"7","why":"2, 4, and 8 are even. 7 is the only odd number, so only that rule isolates one item.","trap":"Choosing 2 because it is prime, but 7 is also prime, so that rule leaves two items.","diff":2},{"id":"verb-017","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which does not belong? copper, iron, gold, wood","choices":["copper","iron","gold","wood"],"answer":"wood","why":"Copper, iron, and gold are metals. Wood is not a metal.","trap":"Choosing gold because it is the most valuable, but gold is still a metal, so it fits the rule.","diff":2},{"id":"verb-018","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which does not belong? walked, jumped, sang, danced","choices":["walked","jumped","sang","danced"],"answer":"sang","why":"Walked, jumped, and danced form the past tense by adding -ed. Sang is an irregular past form.","trap":"Choosing danced because it has two syllables, but danced still forms its past with -ed, so it fits the rule.","diff":2},{"id":"verb-019","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which word does not belong? palpable, tangible, concrete, abstract","choices":["palpable","tangible","concrete","abstract"],"answer":"abstract","why":"Palpable, tangible, and concrete describe what can be perceived or touched. Abstract describes what cannot.","trap":"Choosing concrete because its everyday sense is building material, not the adjective in this set.","diff":2},{"id":"verb-020","part":"I","domain":"Creative Reasoning","sub":"Odd One Out","q":"Which does not belong? narra, molave, acacia, bamboo","choices":["narra","molave","acacia","bamboo"],"answer":"bamboo","why":"Narra, molave, and acacia are hardwood trees. Bamboo is a grass with a hollow, jointed stem.","trap":"Choosing acacia because it is not native, when the rule is botanical type, not origin.","diff":3},{"id":"verb-021","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"All roses are flowers. All flowers are plants. Which conclusion must be true?","choices":["All roses are plants.","All plants are roses.","Some plants are not flowers.","All flowers are roses."],"answer":"All roses are plants.","why":"The chain runs roses to flowers to plants, so every rose is a plant. The wrong options reverse a premise or add a claim.","trap":"Choosing all plants are roses, which converts the first premise illegally.","diff":1},{"id":"verb-022","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"No reptiles are warm-blooded. A gecko is a reptile. Which conclusion follows?","choices":["A gecko is not warm-blooded.","Some geckos are warm-blooded.","Warm-blooded animals are reptiles.","A gecko is cold-blooded only in winter."],"answer":"A gecko is not warm-blooded.","why":"The whole class reptiles lies outside warm-blooded animals, so any member lies outside too. The gecko is a member.","trap":"Choosing the winter option, which adds a condition the premises never state.","diff":1},{"id":"verb-023","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"If it rains, the ground gets wet. The ground is not wet. What follows?","choices":["It did not rain.","It rained briefly.","The ground will dry soon.","Wet ground means rain."],"answer":"It did not rain.","why":"This is the contrapositive: if not wet, then no rain. Denying the consequent is valid reasoning.","trap":"Choosing wet ground means rain, which reverses the original conditional.","diff":2},{"id":"verb-024","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"Some students are athletes. All athletes train daily. Which must be true?","choices":["Some students train daily.","All students train daily.","Some athletes are not students.","All athletes are students."],"answer":"Some students train daily.","why":"The students who are athletes all train daily, so at least those students train. Nothing is said about every student or every athlete.","trap":"Choosing all athletes are students, which turns a particular premise into a universal one.","diff":2},{"id":"verb-025","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"Passing the test is required for the scholarship. Rico did not pass. What follows?","choices":["Rico did not get the scholarship.","Rico got the scholarship anyway.","Rico may still get the scholarship.","Passing guarantees the scholarship."],"answer":"Rico did not get the scholarship.","why":"A required condition is necessary: no scholarship without passing. Failing it blocks the scholarship. Passing alone does not guarantee it.","trap":"Choosing passing guarantees it, which treats a necessary condition as sufficient.","diff":3},{"id":"verb-026","part":"I","domain":"Creative Reasoning","sub":"Syllogisms and Logical Deduction","q":"All crows are black. This bird is black. Therefore this bird is a crow. What is the flaw?","choices":["It treats a necessary condition as sufficient.","It denies the antecedent.","It generalizes from too few cases.","It contradicts itself."],"answer":"It treats a necessary condition as sufficient.","why":"Blackness is necessary for crows but not enough to prove crowhood, since other birds are black too. The argument affirms the consequent.","trap":"Choosing denies the antecedent, which is a different error about the if-clause.","diff":3},{"id":"verb-027","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"Because the witness described every detail in exact order, her account was remarkably ___.","choices":["precise","vague","biased","brief"],"answer":"precise","why":"The clue every detail in exact order signals accuracy. Precise means exact and detailed.","trap":"Choosing brief because a detailed account sounds short, which the clue never says.","diff":1},{"id":"verb-028","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"The typhoon left the village ___, with no house left standing.","choices":["intact","devastated","lively","crowded"],"answer":"devastated","why":"No house left standing is the clue that follows the blank. Devastated means destroyed.","trap":"Choosing intact from habit, ignoring the phrase after the blank.","diff":1},{"id":"verb-029","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"Her apology sounded ___, so no one believed she was truly sorry.","choices":["sincere","insincere","lengthy","formal"],"answer":"insincere","why":"The result clause no one believed she was truly sorry signals a lack of sincerity.","trap":"Choosing sincere because apologies are expected to be sincere, ignoring the result clause.","diff":2},{"id":"verb-030","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"Although the lecture was ___, the audience stayed because the ideas were fresh.","choices":["brief","tedious","lively","clear"],"answer":"tedious","why":"Although marks contrast. They stayed only because the ideas were fresh, so the lecture itself was dull.","trap":"Choosing lively, which agrees with fresh and removes the contrast.","diff":2},{"id":"verb-031","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"The scientist refused to publish until the results were ___, checking each trial three times.","choices":["estimated","verified","assumed","predicted"],"answer":"verified","why":"Checking each trial three times is the clue. Verified means confirmed as true.","trap":"Choosing estimated because research involves estimates, which is the opposite of triple-checking.","diff":2},{"id":"verb-032","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"The river, once ___, is now so polluted that fish cannot survive.","choices":["pristine","polluted","shallow","dry"],"answer":"pristine","why":"Once followed by now so polluted sets a before-and-after contrast. Pristine means clean and untouched.","trap":"Choosing shallow because it sounds neutral, which does not contrast with polluted.","diff":2},{"id":"verb-033","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"The council's decision was ___: it satisfied neither the residents nor the developers.","choices":["unanimous","unsatisfactory","final","popular"],"answer":"unsatisfactory","why":"The colon explains the blank. Satisfying neither side means the decision failed both groups.","trap":"Choosing final because decisions are often final, which the explanation does not support.","diff":3},{"id":"verb-034","part":"I","domain":"Creative Reasoning","sub":"Sentence Completion","q":"Despite the committee's ___ reputation, its latest findings were met with open skepticism.","choices":["sterling","dubious","modest","growing"],"answer":"sterling","why":"Despite signals contrast. Skepticism came anyway, so the reputation had to be excellent. Sterling means of the highest quality.","trap":"Choosing dubious, which agrees with skepticism and cancels the contrast.","diff":3},{"id":"verb-035","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"The judge found the testimony credible. Credible means ___.","choices":["believable","lengthy","hearsay","written"],"answer":"believable","why":"Credible comes from the Latin credere, to believe. A credible testimony can be believed.","trap":"Choosing hearsay because both are courtroom words, but hearsay names a kind of evidence.","diff":1},{"id":"verb-036","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"The plan was feasible given the budget. Feasible means ___.","choices":["possible to carry out","expensive","already approved","unpopular"],"answer":"possible to carry out","why":"Feasible means capable of being done. The phrase given the budget shows the plan can be carried out within it.","trap":"Choosing already approved because feasible sounds official, but approval is a separate step.","diff":1},{"id":"verb-037","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"The manager's abrupt reply surprised the staff. Abrupt means ___.","choices":["sudden and curt","carefully planned","very long","cheerful"],"answer":"sudden and curt","why":"Abrupt describes something that starts or ends without warning and often lacks courtesy. The staff's surprise supports that sense.","trap":"Choosing carefully planned, which contradicts the surprise the reply caused.","diff":2},{"id":"verb-038","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"Her remarks were ambiguous. Ambiguous means ___.","choices":["open to more than one meaning","clearly false","too short","highly technical"],"answer":"open to more than one meaning","why":"Ambiguous means admitting more than one interpretation. The prefix ambi- means both.","trap":"Choosing clearly false because ambiguity feels like a flaw, but it is unclearness, not falsity.","diff":2},{"id":"verb-039","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"Later studies corroborate the first findings. Corroborate means ___.","choices":["support with further evidence","replace completely","contradict","summarize"],"answer":"support with further evidence","why":"To corroborate is to strengthen a claim by adding independent evidence. Later studies doing this confirm the first findings.","trap":"Choosing replace completely because newer studies often supersede old ones, which is not corroboration.","diff":3},{"id":"verb-040","part":"I","domain":"Creative Reasoning","sub":"Vocabulary in Context","q":"The senator's speech was a diatribe against the bill. Diatribe means ___.","choices":["bitter, abusive attack","careful summary","neutral report","polite request"],"answer":"bitter, abusive attack","why":"A diatribe is a forceful and bitter verbal attack. The words against the bill signal opposition, not summary.","trap":"Choosing careful summary because speeches often summarize, but diatribe names hostility.","diff":3},{"id":"verb-041","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"Each of the contestants ___ a number before the round begins.","choices":["has","have","are having","were having"],"answer":"has","why":"Each is a singular indefinite pronoun, so it takes a singular verb. The plural noun after of does not control the verb.","trap":"Choosing have because contestants, the nearest noun, is plural.","diff":1},{"id":"verb-042","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"Neither the teacher nor the students ___ ready when the bell rang.","choices":["was","were","is","has been"],"answer":"were","why":"With neither nor, the verb agrees with the nearer subject. Students is plural, so the verb is were.","trap":"Choosing was because neither looks singular at the start of the sentence.","diff":2},{"id":"verb-043","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"The committee acted as a single body and released ___ decision.","choices":["its","their","it's","there"],"answer":"its","why":"Committee is a collective noun acting as one unit, so it takes the singular possessive its.","trap":"Choosing their because a committee is made of many people.","diff":2},{"id":"verb-044","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"Between you and ___, the plan needs another review.","choices":["me","I","myself","mine"],"answer":"me","why":"Between is a preposition, so it takes the object form. Me is the object pronoun and I is the subject form.","trap":"Choosing I because it sounds more formal after and.","diff":2},{"id":"verb-045","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"By the time the bell rang, the students ___ the experiment.","choices":["had finished","have finished","finish","will finish"],"answer":"had finished","why":"The finishing happened before another past event, so the past perfect had finished is required.","trap":"Choosing have finished, which ties the action to the present instead of an earlier past.","diff":2},{"id":"verb-046","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"Choose the sentence with consistent tense.","choices":["She opened the folder and read the letter.","She opened the folder and reads the letter.","She opens the folder and read the letter.","She had opened the folder and reads the letter."],"answer":"She opened the folder and read the letter.","why":"Two actions joined by and in one past time frame must both be past. Opened and read are both past forms.","trap":"Choosing a version that pairs a past verb with a present verb mid-sentence.","diff":3},{"id":"verb-047","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"Which revision fixes the dangling modifier in: Walking home, the rain soaked me.","choices":["Walking home, I was soaked by the rain.","Walking home, the rain soaked my bag.","The rain soaked me, walking home.","Walking home, the rain began."],"answer":"Walking home, I was soaked by the rain.","why":"The opening phrase must describe the subject. In the original the rain seems to walk. In the answer I does the walking.","trap":"Choosing the version that changes the object, not the misplaced subject.","diff":2},{"id":"verb-048","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"The job requires typing reports, answering calls, and ___.","choices":["filing records","to file records","records filed","file records"],"answer":"filing records","why":"Items in a series must be parallel. Typing and answering are gerunds, so the third item must also be a gerund.","trap":"Choosing to file records because it sounds right after requires, but it breaks the series pattern.","diff":2},{"id":"verb-049","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"The applicant is honest, hardworking, and ___.","choices":["punctual","shows punctuality","with punctuality","always on time"],"answer":"punctual","why":"The series lists adjectives, so the third item must be one adjective. Punctual matches honest and hardworking.","trap":"Choosing always on time because the meaning fits, but it is a phrase, not an adjective.","diff":1},{"id":"verb-050","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"There ___ several reasons for the delay in the project.","choices":["are","is","was","has been"],"answer":"are","why":"In a there sentence the verb agrees with the noun that follows it. Reasons is plural, so the verb is are.","trap":"Choosing is because there appears to be the subject.","diff":2},{"id":"verb-051","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"The new policy is more effective than ___.","choices":["the old one","itself","any policy","it was"],"answer":"the old one","why":"A comparison must compare like with like. A policy must be compared with another policy, so the old one is correct.","trap":"Choosing any policy, which includes the new policy itself, so the comparison is illogical.","diff":3},{"id":"verb-052","part":"I","domain":"Language and Literature","sub":"Grammar and Usage","q":"The book ___ cover is torn belongs to the library.","choices":["whose","which","that","who"],"answer":"whose","why":"Whose shows possession. The cover belongs to the book, so whose is the correct relative pronoun.","trap":"Choosing which because the antecedent is a thing, but which cannot show possession.","diff":2},{"id":"verb-053","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"Which sentence uses the comma correctly?","choices":["Although it rained, the game resumed.","Although, it rained the game resumed.","Althou
