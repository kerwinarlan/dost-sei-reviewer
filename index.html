gh it rained the game, resumed.","Although it rained; the game resumed."],"answer":"Although it rained, the game resumed.","why":"An introductory dependent clause takes a comma before the main clause. The other options place the mark between the wrong words.","trap":"Choosing the semicolon version, which needs independent clauses on both sides.","diff":2},{"id":"verb-054","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"Which mark correctly joins two independent clauses that share no conjunction?","choices":["semicolon","comma","colon","hyphen"],"answer":"semicolon","why":"A semicolon links two independent clauses without a conjunction. A comma alone would create a run-on.","trap":"Choosing the colon, which introduces an explanation or a list rather than linking equal clauses.","diff":1},{"id":"verb-055","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"Choose the correct possessive form: the reports of the two students.","choices":["the students' reports","the student's reports","the students reports","the students's reports"],"answer":"the students' reports","why":"Two students is a plural noun ending in s, so the possessive adds only an apostrophe after that s.","trap":"Choosing the student's reports, which is singular and names only one student.","diff":2},{"id":"verb-056","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"Which sentence is punctuated correctly?","choices":["The results were clear; however, the method was flawed.","The results were clear, however, the method was flawed.","The results were clear however; the method was flawed.","The results were clear: however the method was flawed."],"answer":"The results were clear; however, the method was flawed.","why":"However is a conjunctive adverb. Two independent clauses joined this way need a semicolon before however and a comma after it.","trap":"Choosing the comma-only version, which is a comma splice.","diff":2},{"id":"verb-057","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"Choose the correctly capitalized sentence.","choices":["My aunt teaches Filipino at the University of the Philippines.","My Aunt teaches Filipino at the University of the Philippines.","My aunt teaches filipino at the University of the Philippines.","My aunt teaches Filipino at the university of the Philippines."],"answer":"My aunt teaches Filipino at the University of the Philippines.","why":"Filipino names a language and takes a capital. The full name University of the Philippines is also capitalized. Aunt stays lowercase after a possessive.","trap":"Choosing the version with Aunt capitalized, which is wrong because the word follows a possessive, not a title.","diff":2},{"id":"verb-058","part":"I","domain":"Language and Literature","sub":"Punctuation and Mechanics","q":"The kit contained three items ___ a ruler, a compass, and a protractor.","choices":[":",",",";","-"],"answer":":","why":"A colon introduces a list after a complete clause. The words the kit contained three items can stand alone.","trap":"Choosing the comma, which fuses the independent clause with the list.","diff":1},{"id":"verb-059","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"Her voice was like velvet. Which figure of speech is used?","choices":["simile","metaphor","personification","hyperbole"],"answer":"simile","why":"Like signals an explicit comparison between two unlike things, which is a simile.","trap":"Choosing metaphor, which compares without like or as.","diff":1},{"id":"verb-060","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"Time is a thief. Which figure of speech is used?","choices":["metaphor","simile","oxymoron","synecdoche"],"answer":"metaphor","why":"Time is called a thief directly, with no like or as. An implied comparison of this kind is a metaphor.","trap":"Choosing simile because a comparison is present, but simile needs an explicit like or as.","diff":1},{"id":"verb-061","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"The wind whispered through the trees. Which figure of speech is used?","choices":["personification","metaphor","hyperbole","allusion"],"answer":"personification","why":"Whispering is a human act given to the wind, which is personification.","trap":"Choosing metaphor because whisper is figurative, but the specific pattern gives a human act to a nonhuman thing.","diff":1},{"id":"verb-062","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"I have told you a million times. Which figure of speech is used?","choices":["hyperbole","irony","synecdoche","oxymoron"],"answer":"hyperbole","why":"A million times is deliberate exaggeration for emphasis, not a literal count.","trap":"Choosing irony because the sentence sounds accusing, but irony reverses meaning instead of exaggerating.","diff":1},{"id":"verb-063","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"A fire station burns to the ground. Which literary device best describes this?","choices":["situational irony","hyperbole","oxymoron","allusion"],"answer":"situational irony","why":"The outcome reverses expectation: the building meant to stop fires is destroyed by one. That gap is situational irony.","trap":"Choosing oxymoron because fire station sounds contradictory, but an oxymoron is a phrase pairing opposites.","diff":3},{"id":"verb-064","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"He met his Waterloo in the final round. Which literary device is used?","choices":["allusion","simile","personification","hyperbole"],"answer":"allusion","why":"Waterloo refers to the defeat of Napoleon, a well-known event. An indirect reference of this kind is an allusion.","trap":"Choosing hyperbole because the defeat sounds overstated, but no exaggeration is present.","diff":2},{"id":"verb-065","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"The room fell into a deafening silence. Which figure of speech is used?","choices":["oxymoron","simile","synecdoche","allusion"],"answer":"oxymoron","why":"Deafening and silence are contradictory terms joined in one phrase, which is an oxymoron.","trap":"Choosing hyperbole because deafening is extreme, but the device turns on contradiction, not exaggeration.","diff":2},{"id":"verb-066","part":"I","domain":"Language and Literature","sub":"Figures of Speech and Literary Devices","q":"All hands on deck. Which figure of speech is used?","choices":["synecdoche","personification","metaphor","irony"],"answer":"synecdoche","why":"Hands stands for the whole sailors. Naming a part to mean the whole is synecdoche.","trap":"Choosing metaphor because hands is not literal, but the figure is a part-for-whole substitution.","diff":3},{"id":"verb-067","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The Philippine eagle nests only in old-growth forest, and a pair raises one chick every two years. Logging removes the tall trees the bird needs. Conservation groups now pay forest guards to protect known nesting sites. The eagle's survival depends less on breeding programs than on keeping the forest standing. What is the main idea?","choices":["Protecting old-growth forest matters more to the eagle than breeding programs.","Breeding programs have already saved the Philippine eagle.","Logging companies pay the forest guards.","The eagle raises many chicks each year."],"answer":"Protecting old-growth forest matters more to the eagle than breeding programs.","why":"The passage ends by weighing breeding programs against keeping the forest standing and favors the forest.","trap":"Choosing the breeding option because breeding is mentioned, though the passage says survival depends less on it.","diff":2},{"id":"verb-068","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The Philippine eagle pairs for life and raises one chick every two years. A chick stays with its parents for about a year and a half. How often does a pair raise a chick?","choices":["Every two years","Every year","Twice a year","Every five years"],"answer":"Every two years","why":"The passage states one chick every two years directly.","trap":"Choosing every year because the chick stays a year and a half, which is a different fact.","diff":1},{"id":"verb-069","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The mangrove cutters were told to stop. Within a year the shallow water cleared and small fish returned. By the third year, fishers who had left the village were setting nets again. No one had restocked the fish. What can be inferred about the fish?","choices":["The mangrove forest had sheltered them.","They were brought in from another village.","They were restocked by the government.","They returned because the water warmed."],"answer":"The mangrove forest had sheltered them.","why":"The fish returned once cutting stopped, and no one restocked them, so the mangrove itself supported them.","trap":"Choosing the restocking option even though the last sentence denies it.","diff":2},{"id":"verb-070","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The Spanish arrived in 1565. Long before that, oral epics were chanted in many communities. Missionaries later wrote some down but edited out passages they judged immoral. Today scholars compare those records with versions still sung in upland villages. The comparison shows what the friars changed, and what they missed. What is the main idea?","choices":["Comparing old records with living songs reveals what missionaries altered.","Oral epics were never written down.","Missionaries preserved epics without any changes.","Upland villages no longer sing epics."],"answer":"Comparing old records with living songs reveals what missionaries altered.","why":"The passage centers on the comparison and on what it reveals about the friars' edits and omissions.","trap":"Choosing the preservation option, which contradicts edited out passages they judged immoral.","diff":3},{"id":"verb-071","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. During the Spanish period, possession of Rizal's novels could draw suspicion. Copies entered the islands in luggage and crates, and readers lent worn copies to trusted friends. Officials seized what they found, but the books kept circulating. What does the passage suggest about the seizures?","choices":["They did not stop the books from circulating.","They never actually happened.","They raised the price of the novels.","They ended after one year."],"answer":"They did not stop the books from circulating.","why":"Seizures happened, yet smuggling and private lending kept the novels moving, so the seizures failed to end circulation.","trap":"Choosing that they never happened, which the text denies by stating officials seized what they found.","diff":2},{"id":"verb-072","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The jeepney began with surplus military jeeps left in the islands after 1945. Owners lengthened the chassis and added benches to carry more riders. By the 1970s, local shops were building units from scratch, and the vehicle later became a national icon. Where did the first jeepneys come from?","choices":["Surplus military jeeps left after 1945","Local shops building units from scratch","Imported buses from the United States","Trucks converted by the government"],"answer":"Surplus military jeeps left after 1945","why":"The first sentence names surplus military jeeps left after 1945 as the origin.","trap":"Choosing local shops because the passage mentions them, but that happened later, by the 1970s.","diff":1},{"id":"verb-073","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. Rice terraces in the Cordillera were built by hand over centuries. Each wall holds soil against erosion on steep slopes. Water comes from communal forests above the fields, so those forests are part of the irrigation system. When the forests are cut, the terraces fail. What is the author's main purpose?","choices":["To explain why the terraces depend on the forest above them","To describe how rice is cooked in the Cordillera","To argue that the terraces should be abandoned","To list the tools used to build the terraces"],"answer":"To explain why the terraces depend on the forest above them","why":"The passage traces water from forest to terrace and closes with the consequence of cutting the forest.","trap":"Choosing the abandon option because the last sentence warns of failure, but no recommendation is made.","diff":2},{"id":"verb-074","part":"I","domain":"Language and Literature","sub":"Reading Comprehension","q":"Read the passage. The barangay captain promised shade for every street. Two years later the saplings stand in neat rows, each staked, watered, and wrapped in a plastic sleeve. It is a fine plan. The trees, however, are still in the nursery. What is the tone of the last two sentences?","choices":["Wry and skeptical","Openly angry","Warmly nostalgic","Strictly neutral"],"answer":"Wry and skeptical","why":"It is a fine plan praises the scheme, then however undercuts it: no trees were planted. The effect is dry skepticism.","trap":"Choosing strictly neutral because the facts are plain, but the however reversal carries judgment.","diff":3},{"id":"verb-075","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Who wrote Noli Me Tangere?","choices":["Jose Rizal","Francisco Balagtas","Nick Joaquin","Lope K. Santos"],"answer":"Jose Rizal","why":"Rizal published Noli Me Tangere in 1887, a novel that exposed abuses under Spanish rule.","trap":"Choosing Balagtas because both wrote in the Spanish period, but he wrote Florante at Laura.","diff":1},{"id":"verb-076","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Who wrote Florante at Laura?","choices":["Francisco Balagtas","Jose Rizal","Amado V. Hernandez","Jose Garcia Villa"],"answer":"Francisco Balagtas","why":"Balagtas wrote the awit Florante at Laura, published in 1838 and set in Albania.","trap":"Choosing Rizal because both authors wrote under Spanish rule.","diff":1},{"id":"verb-077","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Who wrote the short story Footnote to Youth?","choices":["Jose Garcia Villa","Nick Joaquin","N. V. M. Gonzalez","Stevan Javellana"],"answer":"Jose Garcia Villa","why":"Villa wrote Footnote to Youth, a story about a young man who marries early and later sees his son repeat the choice.","trap":"Choosing Joaquin because both are major English-language writers of the same period.","diff":2},{"id":"verb-078","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Who wrote May Day Eve?","choices":["Nick Joaquin","Jose Garcia Villa","Francisco Arcellana","Lualhati Bautista"],"answer":"Nick Joaquin","why":"May Day Eve is a Joaquin story about memory, a mirror, and a prophecy that shapes a marriage.","trap":"Choosing Arcellana because both wrote in English during the same postwar period.","diff":2},{"id":"verb-079","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Who wrote Dekada '70?","choices":["Lualhati Bautista","Nick Joaquin","Amado V. Hernandez","Bienvenido Lumbera"],"answer":"Lualhati Bautista","why":"Bautista wrote Dekada '70, a novel about one family's life under martial law.","trap":"Choosing Hernandez because he also wrote social fiction, but his novels are in Filipino and earlier.","diff":2},{"id":"verb-080","part":"I","domain":"Language and Literature","sub":"Philippine Literature","q":"Which is the earliest known book printed in the Philippines?","choices":["Doctrina Christiana","Noli Me Tangere","Florante at Laura","Urbana at Felisa"],"answer":"Doctrina Christiana","why":"The Doctrina Christiana was printed in Manila in 1593, which makes it the earliest known book printed in the country.","trap":"Choosing Urbana at Felisa because it is also an old didactic text, but it appeared in 1864.","diff":3},{"id":"bio-001","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"Which organelle is the main site of ATP synthesis in a eukaryotic cell?","choices":["Ribosome","Mitochondrion","Golgi apparatus","Lysosome"],"answer":"Mitochondrion","why":"The mitochondrion runs oxidative phosphorylation on its inner membrane. This produces most of the cell's ATP.","trap":"Choosing the ribosome because protein synthesis also uses ATP.","diff":1},{"id":"bio-002","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"Which structure controls which substances enter and leave a cell?","choices":["Cell wall","Plasma membrane","Cytoskeleton","Nucleolus"],"answer":"Plasma membrane","why":"The plasma membrane is selectively permeable. Its phospholipid bilayer and embedded proteins regulate the movement of substances.","trap":"Confusing the cell wall, which is freely permeable and gives shape, with the controlling membrane.","diff":1},{"id":"bio-003","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"A cell secretes large amounts of digestive enzyme. Which organelle pair is most directly enlarged?","choices":["Rough ER and Golgi apparatus","Smooth ER and peroxisome","Lysosome and vacuole","Centriole and nucleolus"],"answer":"Rough ER and Golgi apparatus","why":"Ribosomes on the rough ER build the protein. The Golgi then modifies, sorts, and packages it for release.","trap":"Choosing lysosomes because they hold digestive enzymes, but lysosomes digest inside the cell.","diff":2},{"id":"bio-004","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"What is the main function of the ribosome?","choices":["Synthesizing protein from mRNA","Replicating DNA before division","Producing ATP from glucose","Adding carbohydrate chains to protein"],"answer":"Synthesizing protein from mRNA","why":"The ribosome reads mRNA codons and links amino acids with peptide bonds. It builds the polypeptide chain.","trap":"Choosing carbohydrate modification because the Golgi also acts on proteins.","diff":1},{"id":"bio-005","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"Which structure occurs in a prokaryotic cell but not in a eukaryotic cell?","choices":["Nucleoid","Nucleolus","Mitochondrion","Golgi apparatus"],"answer":"Nucleoid","why":"Prokaryotes hold DNA in a nucleoid with no surrounding membrane. Eukaryotes enclose DNA inside a nucleus.","trap":"Confusing the nucleoid with the nucleolus, which sits inside the eukaryotic nucleus.","diff":1},{"id":"bio-006","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"Why does a cell's rate of diffusion limit its maximum size?","choices":["Volume rises faster than surface area","Surface area rises faster than volume","Diffusion stops in large cells","Large cells lose their plasma membrane"],"answer":"Volume rises faster than surface area","why":"Volume grows as the cube of length while area grows as the square. The area-to-volume ratio falls, so exchange cannot serve the whole volume.","trap":"Reversing the relationship and claiming area outgrows volume.","diff":2},{"id":"bio-007","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"Which organelle contains thylakoids stacked into grana?","choices":["Chloroplast","Mitochondrion","Peroxisome","Vacuole"],"answer":"Chloroplast","why":"Thylakoid membranes inside the chloroplast stack into grana. They hold the photosystems that capture light energy.","trap":"Choosing the mitochondrion because its inner membrane is also folded, into cristae.","diff":2},{"id":"bio-008","part":"II","domain":"Science","sub":"Cell Structure and Function","q":"A cell placed in a hypertonic solution shrivels. Which process explains the water loss?","choices":["Osmosis out of the cell","Active transport of water out","Phagocytosis of solutes","Facilitated diffusion of water inward"],"answer":"Osmosis out of the cell","why":"The outside solute concentration is higher, so water leaves through the membrane by osmosis down its own gradient.","trap":"Claiming active transport moves water, but water crosses by osmosis and is not pumped.","diff":3},{"id":"bio-009","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"Where in the chloroplast does the Calvin cycle take place?","choices":["Stroma","Thylakoid lumen","Outer membrane","Intermembrane space"],"answer":"Stroma","why":"The Calvin cycle enzymes sit in the stroma. ATP and NADPH from the thylakoid reactions drive carbon fixation there.","trap":"Placing the Calvin cycle in the thylakoid because light capture happens there.","diff":1},{"id":"bio-010","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"Which pair of molecules does the light reaction supply to the Calvin cycle?","choices":["ATP and NADPH","ADP and NADP^+","CO_2 and H_2O","Glucose and O_2"],"answer":"ATP and NADPH","why":"Light-driven electron transport makes ATP and NADPH. The Calvin cycle spends both to reduce CO_2 into sugar.","trap":"Naming ADP and NADP^+, which are the spent forms returned to the light reaction.","diff":2},{"id":"bio-011","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"In aerobic respiration, where is most ATP produced?","choices":["Inner mitochondrial membrane","Cytoplasm during glycolysis","Mitochondrial matrix during the Krebs cycle","Outer mitochondrial membrane"],"answer":"Inner mitochondrial membrane","why":"The electron transport chain and ATP synthase sit on the inner membrane. Oxidative phosphorylation yields most of the ATP.","trap":"Choosing the Krebs cycle because it makes ATP, but only in small amounts by substrate-level phosphorylation.","diff":2},{"id":"bio-012","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"Which product forms when human muscle runs low on oxygen?","choices":["Lactate","Ethanol and CO_2","Acetyl-CoA","Citrate"],"answer":"Lactate","why":"Without oxygen, NADH is reoxidized by reducing pyruvate to lactate. This lets glycolysis keep running.","trap":"Choosing ethanol because fermentation is often taught with yeast.","diff":3},{"id":"bio-013","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"What is the net ATP yield of glycolysis per glucose molecule?","choices":["2","4","32","0"],"answer":"2","why":"Glycolysis uses 2 ATP and makes 4 ATP. The net gain is 4 - 2 = 2 ATP per glucose.","trap":"Reporting 4 and forgetting the two ATP invested at the start.","diff":2},{"id":"bio-014","part":"II","domain":"Science","sub":"Photosynthesis and Cellular Respiration","q":"In photosynthesis, which molecule is oxidized and which is reduced?","choices":["H_2O is oxidized and CO_2 is reduced","CO_2 is oxidized and H_2O is reduced","O_2 is oxidized and glucose is reduced","Glucose is oxidized and O_2 is reduced"],"answer":"H_2O is oxidized and CO_2 is reduced","why":"Water loses electrons and releases O_2, so it is oxidized. CO_2 gains electrons and becomes glucose, so it is reduced.","trap":"Reversing the pair by applying the respiration direction to photosynthesis.","diff":3},{"id":"bio-015","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"In DNA, adenine pairs with which base?","choices":["Thymine","Guanine","Cytosine","Uracil"],"answer":"Thymine","why":"Adenine forms two hydrogen bonds with thymine in DNA. Guanine pairs with cytosine.","trap":"Choosing uracil, which pairs with adenine only in RNA.","diff":1},{"id":"bio-016","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"Which process makes mRNA from a DNA template?","choices":["Transcription","Translation","Replication","Mutation"],"answer":"Transcription","why":"RNA polymerase copies a DNA gene into mRNA. Translation then reads the mRNA to build protein.","trap":"Swapping transcription with translation, which reads mRNA to make protein.","diff":1},{"id":"bio-017","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"How many nucleotides make up one codon?","choices":["3","1","2","4"],"answer":"3","why":"A codon is three nucleotides. It specifies one amino acid or a stop signal.","trap":"Choosing 4 because DNA has four bases, not because a codon has four bases.","diff":2},{"id":"bio-018","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"In the cross Aa x Aa, what fraction of offspring is expected to show the recessive phenotype?","choices":["1/4","1/2","3/4","0"],"answer":"1/4","why":"The cross gives 1 AA : 2 Aa : 1 aa. Only aa shows the recessive trait, so the fraction is 1/4.","trap":"Reporting 1/2 because Aa is half the offspring, but heterozygotes show the dominant trait.","diff":2},{"id":"bio-019","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"What does a test cross determine about an individual that shows the dominant trait?","choices":["Whether it is homozygous or heterozygous","Whether it is male or female","Its chromosome number","Whether its alleles are linked"],"answer":"Whether it is homozygous or heterozygous","why":"Crossing with a homozygous recessive reveals the unknown genotype. Any recessive offspring prove the parent carries the recessive allele.","trap":"Expecting a test cross to reveal chromosome number or sex.","diff":1},{"id":"bio-020","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"Two AaBb individuals are crossed. Both genes assort independently and show complete dominance. What phenotypic ratio results?","choices":["9:3:3:1","1:2:1","3:1","1:1:1:1"],"answer":"9:3:3:1","why":"Each gene alone gives a 3:1 ratio. Multiplying (3:1) by (3:1) expands to 9:3:3:1 for the two traits combined.","trap":"Giving 3:1, which is the ratio for a single gene only.","diff":3},{"id":"bio-021","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"A color-blind man and a woman who is homozygous for normal vision have children. Which outcome is expected?","choices":["All daughters are carriers and all sons have normal vision","All daughters are color-blind","All sons are color-blind","Daughters are color-blind and sons are carriers"],"answer":"All daughters are carriers and all sons have normal vision","why":"The father passes his X^c to daughters and his Y to sons. Daughters also get a normal X from the mother, so they are carriers.","trap":"Assuming a son can inherit an X-linked allele from his father.","diff":3},{"id":"bio-022","part":"II","domain":"Science","sub":"DNA, RNA, and Genetics","q":"Which mutation type replaces one nucleotide with another?","choices":["Substitution","Insertion","Deletion","Frameshift"],"answer":"Substitution","why":"A substitution swaps one base for another. Insertions and deletions add or remove bases and can shift the reading frame.","trap":"Choosing frameshift, but a frameshift needs an insertion or a deletion.","diff":2},{"id":"bio-023","part":"II","domain":"Science","sub":"Evolution and Taxonomy","q":"Which statement describes natural selection?","choices":["Organisms with favorable inherited traits leave more offspring","Organisms change their traits during life to fit the environment","All organisms in a population become identical over time","Survival is random and does not change allele frequencies"],"answer":"Organisms with favorable inherited traits leave more offspring","why":"Heritable variation plus unequal reproduction shifts allele frequencies across generations.","trap":"Claiming individuals adapt by changing their genes during life, which is Lamarckian.","diff":1},{"id":"bio-024","part":"II","domain":"Science","sub":"Evolution and Taxonomy","q":"The forelimbs of humans, whales, and bats share the same bone plan. What does this show?","choices":["Common ancestry","Convergent evolution","Identical function","No evolutionary relationship"],"answer":"Common ancestry","why":"The same underlying bone arrangement is a homologous structure. It points to inheritance from a shared ancestor.","trap":"Calling the limbs analogous because they perform different functions.","diff":2},{"id":"bio-025","part":"II","domain":"Science","sub":"Evolution and Taxonomy","q":"In the name Homo sapiens, which part is the genus?","choices":["Homo","sapiens","Both words","Neither word"],"answer":"Homo","why":"The genus is capitalized and comes first. The species epithet follows in lowercase.","trap":"Reversing genus and species because sapiens is the more familiar word.","diff":2},{"id":"bio-026","part":"II","domain":"Science","sub":"Evolution and Taxonomy","q":"Which sequence lists taxonomic ranks from broadest to narrowest?","choices":["Domain, kingdom, phylum, class, order, family, genus, species","Kingdom, domain, class, phylum, order, family, genus, species","Domain, phylum, kingdom, class, family, order, genus, species","Species, genus, family, order, class, phylum, kingdom, domain"],"answer":"Domain, kingdom, phylum, class, order, family, genus, species","why":"Domain is the broadest rank, then kingdom, phylum, class, order, family, genus. Species is the narrowest.","trap":"Swapping phylum and class, or reversing the whole sequence.","diff":2},{"id":"bio-027","part":"II","domain":"Science","sub":"Evolution and Taxonomy","q":"A river splits one population into two isolated groups. What is most likely over many generations?","choices":["The groups may diverge and become separate species","The groups will interbreed more often","Mutation will stop in both groups","Both groups will become genetically identical"],"answer":"The groups may diverge and become separate species","why":"Geographic isolation blocks gene flow. Separate mutations and selection pressures can then push the groups apart until reproductive isolation evolves.","trap":"Assuming isolation makes populations identical rather than divergent.","diff":3},{"id":"bio-028","part":"II","domain":"Science","sub":"Human Physiology","q":"In which organ does most chemical digestion and nutrient absorption occur?","choices":["Small intestine","Stomach","Large intestine","Esophagus"],"answer":"Small intestine","why":"The small intestine receives pancreatic enzymes and bile. Its villi absorb most nutrients.","trap":"Choosing the stomach because it is acidic, but it absorbs few nutrients.","diff":1},{"id":"bio-029","part":"II","domain":"Science","sub":"Human Physiology","q":"What is the main role of bile in digestion?","choices":["Emulsifying fat into smaller droplets","Breaking starch into glucose","Digesting protein into amino acids","Absorbing water in the colon"],"answer":"Emulsifying fat into smaller droplets","why":"Bile salts break large fat globules into smaller droplets. This increases the surface area for lipase.","trap":"Calling bile an enzyme that digests fat, but bile contains no digestive enzyme.","diff":2},{"id":"bio-030","part":"II","domain":"Science","sub":"Human Physiology","q":"Which heart chamber pumps oxygenated blood into the aorta?","choices":["Left ventricle","Right ventricle","Left atrium","Right atrium"],"answer":"Left ventricle","why":"The left ventricle has the thickest wall. It pumps oxygenated blood through the aorta to the body.","trap":"Choosing the right ventricle, which pumps deoxygenated blood to the lungs.","diff":2},{"id":"bio-031","part":"II","domain":"Science","sub":"Human Physiology","q":"Which blood vessel carries oxygenated blood from the lungs to the heart?","choices":["Pulmonary vein","Pulmonary artery","Aorta","Vena cava"],"answer":"Pulmonary vein","why":"The pulmonary vein returns oxygenated blood from the lungs to the left atrium.","trap":"Assuming every vein carries deoxygenated blood, which fails for the pulmonary vein.","diff":1},{"id":"bio-032","part":"II","domain":"Science","sub":"Human Physiology","q":"Which structure is the main site of gas exchange in the lungs?","choices":["Alveoli","Bronchi","Trachea","Pleura"],"answer":"Alveoli","why":"Alveoli have thin walls and a large total surface area next to capillaries. Oxygen and CO_2 diffuse across that surface.","trap":"Choosing bronchi because they carry air, but they do not exchange gases.","diff":2},{"id":"bio-033","part":"II","domain":"Science","sub":"Human Physiology","q":"Which neuron type carries a signal from a receptor toward the central nervous system?","choices":["Sensory neuron","Motor neuron","Interneuron","Neuroglia"],"answer":"Sensory neuron","why":"Sensory neurons carry impulses from receptors toward the CNS. Motor neurons carry impulses away to effectors.","trap":"Picking the motor neuron because it also conducts impulses, but in the opposite direction.","diff":2},{"id":"bio-034","part":"II","domain":"Science","sub":"Human Physiology","q":"Which pair of hormones has opposite effects on blood glucose?","choices":["Insulin and glucagon","Insulin and thyroxine","Glucagon and adrenaline","Cortisol and aldosterone"],"answer":"Insulin and glucagon","why":"Insulin lowers blood glucose by promoting uptake and storage. Glucagon raises it by promoting glycogen breakdown.","trap":"Naming cortisol and aldosterone, which act on stress and sodium, not on opposing glucose control.","diff":3},{"id":"bio-035","part":"II","domain":"Science","sub":"Human Physiology","q":"What is the main role of memory B cells after an infection?","choices":["Producing a faster, stronger antibody response on re-exposure","Engulfing pathogens by phagocytosis","Releasing histamine during inflammation","Destroying virus-infected cells directly"],"answer":"Producing a faster, stronger antibody response on re-exposure","why":"Memory B cells persist after recovery. When the same antigen returns, they divide quickly into antibody-secreting plasma cells.","trap":"Confusing memory B cells with cytotoxic T cells, which kill infected cells.","diff":2},{"id":"bio-036","part":"II","domain":"Science","sub":"Ecology","q":"About what fraction of energy passes from one trophic level to the next?","choices":["10%","50%","90%","1%"],"answer":"10%","why":"Near 90% of energy is lost as heat, respiration, and waste at each step. About 10% reaches the next level.","trap":"Saying 90% passes because 90% is the fraction lost.","diff":1},{"id":"bio-037","part":"II","domain":"Science","sub":"Ecology","q":"What is the main role of decomposers in an ecosystem?","choices":["Returning mineral nutrients to the soil from dead matter","Converting sunlight into chemical energy","Serving as the first trophic level","Producing oxygen through photosynthesis"],"answer":"Returning mineral nutrients to the soil from dead matter","why":"Decomposers break down dead tissue. The released mineral nutrients re-enter the soil and become available to producers.","trap":"Thinking decomposers return energy to producers rather than minerals.","diff":2},{"id":"bio-038","part":"II","domain":"Science","sub":"Ecology","q":"Which human activity returns the most long-stored carbon to the atmosphere?","choices":["Burning coal, oil, and gas","Planting forests","Industrial nitrogen fixation","Growing crops"],"answer":"Burning coal, oil, and gas","why":"Fossil fuels hold carbon fixed long ago. Burning them returns that carbon to the atmosphere as CO_2.","trap":"Confusing the carbon cycle with the nitrogen cycle and naming nitrogen fixation.","diff":2},{"id":"bio-039","part":"II","domain":"Science","sub":"Ecology","q":"A population grows past the carrying capacity of its habitat. What usually happens next?","choices":["Growth slows or reverses as resources run short","Growth continues exponentially forever","The birth rate rises above the death rate","Emigration drops to zero"],"answer":"Growth slows or reverses as resources run short","why":"Carrying capacity is set by available resources. Once it is exceeded, death rates rise and births fall, so the population declines.","trap":"Assuming logistic growth keeps climbing past the carrying capacity.","diff":3},{"id":"bio-040","part":"II","domain":"Science","sub":"Ecology","q":"Which organism in a grassland food web is a primary consumer?","choices":["Grasshopper","Grass","Hawk","Mushroom"],"answer":"Grasshopper","why":"Primary consumers eat producers. A grasshopper eats grass and sits at the second trophic level.","trap":"Choosing the mushroom, which is a decomposer and not a consumer level.","diff":1},{"id":"chem-001","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Which particles are found in the nucleus of an atom?","choices":["Protons and neutrons","Protons and electrons","Neutrons and electrons","Electrons only"],"answer":"Protons and neutrons","why":"The nucleus holds protons and neutrons. Electrons occupy orbitals outside the nucleus.","trap":"Placing electrons in the nucleus because their mass is small.","diff":1},{"id":"chem-002","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Two atoms of the same element have different mass numbers. What differs between them?","choices":["Number of neutrons","Number of protons","Number of electrons","Chemical symbol"],"answer":"Number of neutrons","why":"Isotopes of an element share the same proton count. A different mass number means a different neutron count.","trap":"Changing the proton number, which would make a different element.","diff":2},{"id":"chem-003","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"What is the electron configuration of a sulfur atom, which has 16 electrons?","choices":["1s^2 2s^2 2p^6 3s^2 3p^4","1s^2 2s^2 2p^6 3s^2 3p^6","1s^2 2s^2 2p^6 3p^4","1s^2 2s^2 2p^5 3s^2 3p^3"],"answer":"1s^2 2s^2 2p^6 3s^2 3p^4","why":"Fill 1s with 2, 2s with 2, 2p with 6, 3s with 2, then 3p with 4. The total is 16 electrons.","trap":"Writing 3p^6 and stopping without checking the 16-electron total.","diff":1},{"id":"chem-004","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"How does atomic radius change across a period from left to right?","choices":["It decreases","It increases","It stays the same","It first increases then decreases"],"answer":"It decreases","why":"Nuclear charge rises while electrons enter the same shell. The stronger pull draws the electron cloud inward.","trap":"Assuming radius grows with atomic number across a period.","diff":2},{"id":"chem-005","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Which element has the highest first ionization energy?","choices":["Ne","Na","Mg","K"],"answer":"Ne","why":"Neon has a stable octet and a small radius. Removing one electron breaks that filled 2p stability.","trap":"Choosing Na because it is a metal that ionizes easily, ignoring the trend within a period.","diff":2},{"id":"chem-006","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Which sublevel fills just before 3d in the aufbau order?","choices":["4s","3p","4p","3s"],"answer":"4s","why":"The aufbau order places 4s below 3d in energy, so 4s fills first. That is why K and Ca come before the transition metals.","trap":"Filling 3d first because its principal quantum number is lower.","diff":3},{"id":"chem-007","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Which of these elements is the most electronegative?","choices":["F","O","Cl","N"],"answer":"F","why":"Fluorine sits at the top right of the periodic table, excluding the noble gases. It attracts bonding electrons most strongly.","trap":"Choosing Cl because it belongs to the same group, but electronegativity falls down a group.","diff":1},{"id":"chem-008","part":"II","domain":"Science","sub":"Atomic Structure and Periodicity","q":"Which ion does an aluminum atom form to reach a noble-gas configuration?","choices":["Al^3+","Al^+","Al^2+","Al^-"],"answer":"Al^3+","why":"Aluminum has three valence electrons. Losing all three leaves the neon core, so the ion is Al^3+.","trap":"Gaining five electrons instead of losing the three valence electrons.","diff":3},{"id":"chem-009","part":"II","domain":"Science","sub":"Chemical Bonding","q":"Which pair of elements most likely forms an ionic bond?","choices":["K and Cl","C and O","H and O","N and N"],"answer":"K and Cl","why":"A metal with low ionization energy transfers an electron to a nonmetal with high electron affinity. K and Cl form K^+ and Cl^-.","trap":"Choosing two nonmetals, which share electrons and form covalent bonds.","diff":1},{"id":"chem-010","part":"II","domain":"Science","sub":"Chemical Bonding","q":"How many lone pairs sit on the central oxygen atom of a water molecule, H_2O?","choices":["2","0","1","3"],"answer":"2","why":"Oxygen has 6 valence electrons and shares 2 in bonds. The remaining 4 form 2 lone pairs.","trap":"Counting the bonding pairs as lone pairs and answering 0.","diff":2},{"id":"chem-011","part":"II","domain":"Science","sub":"Chemical Bonding","q":"Which bond is the most polar?","choices":["H-F","H-Cl","H-Br","H-I"],"answer":"H-F","why":"The electronegativity difference is largest for H and F. Fluorine is the most electronegative element.","trap":"Choosing H-I because iodine is the largest atom, but size does not set polarity.","diff":1},{"id":"chem-012","part":"II","domain":"Science","sub":"Chemical Bonding","q":"Which intermolecular force holds two water molecules together in liquid water?","choices":["Hydrogen bonding","Ionic bonding","Metallic bonding","Covalent bonding"],"answer":"Hydrogen bonding","why":"The O-H bond is polar, so the H of one molecule attracts the lone pair on O of another. That is hydrogen bonding.","trap":"Calling the O-H bond itself a hydrogen bond, but that bond is covalent.","diff":2},{"id":"chem-013","part":"II","domain":"Science","sub":"Chemical Bonding","q":"Which substance has the highest boiling point?","choices":["H_2O","H_2S","H_2Se","H_2Te"],"answer":"H_2O","why":"Water forms extensive hydrogen bonds. The others rely on weaker dipole and dispersion forces, so water boils highest despite its low mass.","trap":"Assuming boiling point rises with molar mass down the group and picking H_2Te.","diff":3},{"id":"chem-014","part":"II","domain":"Science","sub":"Chemical Bonding","q":"What is the molecular shape of methane, CH_4?","choices":["Tetrahedral","Trigonal planar","Bent","Linear"],"answer":"Tetrahedral","why":"Four bonding pairs around carbon repel equally. The arrangement that spreads them farthest apart is tetrahedral.","trap":"Guessing trigonal planar by drawing the flat two-dimensional structure.","diff":2},{"id":"chem-015","part":"II","domain":"Science","sub":"Stoichiometry","q":"What is the molar mass of CO_2? (C = 12, O = 16)","choices":["44 g/mol","28 g/mol","32 g/mol","56 g/mol"],"answer":"44 g/mol","why":"12 + 2(16) = 12 + 32 = 44 g/mol.","trap":"Counting one oxygen only and answering 28 g/mol.","diff":1},{"id":"chem-016","part":"II","domain":"Science","sub":"Stoichiometry","q":"How many moles are in 36 g of water? (H_2O = 18 g/mol)","choices":["2.0","0.5","18","36"],"answer":"2.0","why":"n = m / M = 36 g / 18 g/mol = 2.0 mol.","trap":"Dividing the molar mass by the mass and getting 0.5.","diff":1},{"id":"chem-017","part":"II","domain":"Science","sub":"Stoichiometry","q":"How many molecules are in 0.5 mol of O_2? (N_A = 6.02 x 10^23)","choices":["3.01 x 10^23","6.02 x 10^23","1.20 x 10^24","3.01 x 10^22"],"answer":"3.01 x 10^23","why":"0.5 x 6.02 x 10^23 = 3.01 x 10^23 molecules.","trap":"Doubling instead of halving and answering 1.20 x 10^24.","diff":2},{"id":"chem-018","part":"II","domain":"Science","sub":"Stoichiometry","q":"For 2H_2 + O_2 → 2H_2O, how many moles of O_2 react with 4 mol of H_2?","choices":["2","4","8","1"],"answer":"2","why":"The ratio of H_2 to O_2 is 2:1. Then 4 mol H_2 needs 4/2 = 2 mol O_2.","trap":"Using a 1:1 ratio and answering 4.","diff":2},{"id":"chem-019","part":"II","domain":"Science","sub":"Stoichiometry","q":"2 mol N_2 react with 3 mol H_2 by N_2 + 3H_2 → 2NH_3. Which reactant is limiting?","choices":["H_2","N_2","NH_3","Both run out at the same time"],"answer":"H_2","why":"2 mol N_2 needs 6 mol H_2. Only 3 mol H_2 is present, so H_2 runs out first.","trap":"Comparing the given moles directly (2 vs 3) instead of converting with the 1:3 ratio.","diff":2},{"id":"chem-020","part":"II","domain":"Science","sub":"Stoichiometry","q":"4 mol H_2 reacts with excess N_2 by N_2 + 3H_2 → 2NH_3. What is the theoretical yield of NH_3?","choices":["2.67 mol","8 mol","4 mol","1.33 mol"],"answer":"2.67 mol","why":"4 mol H_2 x (2 mol NH_3 / 3 mol H_2) = 8/3 = 2.67 mol NH_3.","trap":"Multiplying by the ammonia coefficient without dividing by the H_2 coefficient, giving 8.","diff":3},{"id":"chem-021","part":"II","domain":"Science","sub":"Stoichiometry","q":"A reaction has a theoretical yield of 20.0 g and produces 15.0 g. What is the percent yield?","choices":["75.0%","133%","5.0%","33.3%"],"answer":"75.0%","why":"Percent yield = (actual / theoretical) x 100 = (15.0 / 20.0) x 100 = 75.0%.","trap":"Dividing theoretical by actual and getting 133%.","diff":2},{"id":"chem-022","part":"II","domain":"Science","sub":"Stoichiometry","q":"A compound is 40.0% C, 6.7% H, and 53.3% O by mass. What is its empirical formula? (C=12, H=1, O=16)","choices":["CH_2O","C_2H_4O_2","CHO","C_2H_6O"],"answer":"CH_2O","why":"Moles are 40.0/12 = 3.33 C, 6.7/1 = 6.7 H, and 53.3/16 = 3.33 O. Divide by 3.33 to get 1:2:1.","trap":"Stopping at the raw mole values without dividing by the smallest.","diff":3},{"id":"chem-023","part":"II","domain":"Science","sub":"Solutions","q":"What is the molarity of a solution with 0.50 mol of solute in 2.0 L of solution?","choices":["0.25 M","4.0 M","1.0 M","0.50 M"],"answer":"0.25 M","why":"M = mol / L = 0.50 / 2.0 = 0.25 M.","trap":"Multiplying moles by volume instead of dividing.","diff":1},{"id":"chem-024","part":"II","domain":"Science","sub":"Solutions","q":"50.0 mL of 2.0 M HCl is diluted to 250 mL. What is the new concentration?","choices":["0.40 M","10. M","1.0 M","0.20 M"],"answer":"0.40 M","why":"M_1 V_1 = M_2 V_2 gives (2.0)(50.0) = M_2(250). Then M_2 = 0.40 M.","trap":"Using only the water added instead of the final total volume.","diff":2},{"id":"chem-025","part":"II","domain":"Science","sub":"Solutions","q":"Which property is a colligative property?","choices":["Boiling point elevation","Density","Color","Molar mass"],"answer":"Boiling point elevation","why":"Colligative properties depend on the number of dissolved particles, not their identity. Boiling point elevation is one of them.","trap":"Choosing density, which depends on the identity of the solute.","diff":2},{"id":"chem-026","part":"II","domain":"Science","sub":"Solutions","q":"Why does adding salt lower the freezing point of water?","choices":["Solute particles disrupt ice crystal formation","Salt adds heat to the water","Salt reacts with water to form a new compound","Salt increases the molar mass of water"],"answer":"Solute particles disrupt ice crystal formation","why":"Dissolved particles interfere with the ordered packing needed to form ice. More energy must be removed, so the freezing point drops.","trap":"Thinking salt heats the ice instead of disrupting crystal formation.","diff":2},{"id":"chem-027","part":"II","domain":"Science","sub":"Solutions","q":"At equal concentration, which solution conducts electricity best?","choices":["NaCl(aq)","C_6H_12O_6(aq)","CH_3OH(aq)","C_12H_22O_11(aq)"],"answer":"NaCl(aq)","why":"NaCl dissociates into two ions per formula unit. The sugars and methanol stay as neutral molecules and carry no current.","trap":"Choosing a sugar because it dissolves well, but dissolving is not ionizing.","diff":2},{"id":"chem-028","part":"II","domain":"Science","sub":"Gas Laws","q":"A gas at 2.0 atm occupies 3.0 L. At constant temperature, what volume does it occupy at 6.0 atm?","choices":["1.0 L","9.0 L","6.0 L","4.0 L"],"answer":"1.0 L","why":"Boyle's law gives P_1 V_1 = P_2 V_2. Then (2.0)(3.0) = (6.0)V_2, so V_2 = 1.0 L.","trap":"Multiplying pressure and volume and answering 9.0 L.","diff":1},{"id":"chem-029","part":"II","domain":"Science","sub":"Gas Laws","q":"A gas occupies 300 mL at 300 K. At constant pressure, what volume does it occupy at 600 K?","choices":["600 mL","150 mL","300 mL","900 mL"],"answer":"600 mL","why":"Charles's law gives V_1/T_1 = V_2/T_2. Volume doubles when the absolute temperature doubles.","trap":"Halving the volume by inverting the ratio.","diff":2},{"id":"chem-030","part":"II","domain":"Science","sub":"Gas Laws","q":"What is the volume of 2.0 mol of an ideal gas at 1.0 atm and 273 K? (R = 0.0821)","choices":["44.8 L","22.4 L","11.2 L","89.6 L"],"answer":"44.8 L","why":"V = nRT/P = (2.0)(0.0821)(273)/1.0 = 44.8 L.","trap":"Using 22.4 L, the volume of one mole, without scaling to two moles.","diff":2},{"id":"chem-031","part":"II","domain":"Science","sub":"Gas Laws","q":"A gas at 1.0 atm and 300 K is heated to 600 K at constant volume. What is the new pressure?","choices":["2.0 atm","0.50 atm","1.0 atm","1200 atm"],"answer":"2.0 atm","why":"At constant volume, P_1/T_1 = P_2/T_2. Doubling the absolute temperature doubles the pressure to 2.0 atm.","trap":"Halving the pressure by inverting the ratio.","diff":3},{"id":"chem-032","part":"II","domain":"Science","sub":"Acids and Bases","q":"What is the pH of a solution with [H^+] = 1.0 x 10^-3 M?","choices":["3","11","-3","0.001"],"answer":"3","why":"pH = -log[H^+]. The log of 1.0 x 10^-3 is -3, so pH = 3.","trap":"Reporting 0.001, which is the concentration, not the pH.","diff":1},{"id":"chem-033","part":"II","domain":"Science","sub":"Acids and Bases","q":"At 25 C, what is the pH of a solution with [OH^-] = 1.0 x 10^-4 M?","choices":["10","4","14","7"],"answer":"10","why":"pOH = -log(1.0 x 10^-4) = 4. Then pH = 14 - 4 = 10.","trap":"Reporting 4 and forgetting the pH to pOH conversion.","diff":2},{"id":"chem-034","part":"II","domain":"Science","sub":"Acids and Bases","q":"What are the products of the reaction between HCl and NaOH?","choices":["NaCl and H_2O","NaCl and H_2 gas","NaH and HClO","Na_2O and H_2O"],"answer":"NaCl and H_2O","why":"H^+ from the acid and OH^- from the base combine to form water. Na^+ and Cl^- remain as dissolved salt.","trap":"Assuming a gas forms, as it does when an acid meets a metal.","diff":2},{"id":"chem-035","part":"II","domain":"Science","sub":"Acids and Bases","q":"25.0 mL of HCl is neutralized by 20.0 mL of 0.10 M NaOH. What is the HCl concentration?","choices":["0.080 M","0.10 M","0.125 M","0.050 M"],"answer":"0.080 M","why":"Moles NaOH = 0.0200 L x 0.10 M = 0.00200 mol. The 1:1 ratio gives M_HCl = 0.00200 / 0.0250 = 0.080 M.","trap":"Using the base volume in place of the acid volume.","diff":3},{"id":"chem-036","part":"II","domain":"Science","sub":"Acids and Bases","q":"In NH_3 + H_2O → NH_4^+ + OH^-, which species is the conjugate acid of NH_3?","choices":["NH_4^+","OH^-","H_2O","NH_3"],"answer":"NH_4^+","why":"The conjugate acid forms when a base accepts a proton. NH_3 accepts H^+ from water and becomes NH_4^+.","trap":"Naming H_2O because it donates the proton, which makes it the acid, not the conjugate acid.","diff":2},{"id":"chem-037","part":"II","domain":"Science","sub":"Organic Chemistry","q":"Which formula represents an alkane?","choices":["C_3H_8","C_3H_6","C_3H_4","C_6H_6"],"answer":"C_3H_8","why":"A saturated acyclic alkane follows C_nH_2n+2. For n = 3 that gives C_3H_8.","trap":"Choosing C_3H_6, which is an alkene with one double bond.","diff":1},{"id":"chem-038","part":"II","domain":"Science","sub":"Organic Chemistry","q":"Which functional group defines a carboxylic acid?","choices":["-COOH","-OH only","-CHO","-NH_2"],"answer":"-COOH","why":"The carboxyl group has a carbonyl C=O and an -OH on the same carbon. That group releases H^+ and makes the compound acidic.","trap":"Choosing the alcohol -OH, which does not make a compound acidic.","diff":2},{"id":"chem-039","part":"II","domain":"Science","sub":"Organic Chemistry","q":"Butane and 2-methylpropane share the molecular formula C_4H_10. What are they?","choices":["Structural isomers","Identical compounds","Isotopes","Polymers"],"answer":"Structural isomers","why":"The same molecular formula with different connectivity makes them structural isomers. Their physical properties differ.","trap":"Calling them isotopes because the formula matches, but isotopes differ in neutrons.","diff":2},{"id":"chem-040","part":"II","domain":"Science","sub":"Organic Chemistry","q":"How many carbon atoms are in the longest chain of 2,3-dimethylpentane?","choices":["5","7","3","2"],"answer":"5","why":"The parent name pentane already means a five-carbon chain. The two methyl groups are branches on carbons 2 and 3.","trap":"Adding the two methyl carbons to the parent and getting seven.","diff":3},{"id":"earth-001","part":"II","domain":"Science","sub":"Plate Tectonics","q":"Which plate boundary forms where two plates move away from each other?","choices":["Convergent","Divergent","Transform","Subduction"],"answer":"Divergent","why":"Divergent boundaries separate plates. Magma rises to fill the gap and forms new oceanic crust at mid-ocean ridges.","trap":"Confusing divergent with subduction; subduction is a convergent process where a plate sinks.","diff":1},{"id":"earth-002","part":"II","domain":"Science","sub":"Plate Tectonics","q":"What happens when an oceanic plate meets a continental plate at a convergent boundary?","choices":["The oceanic plate sinks beneath the continental plate","The continental plate sinks beneath the oceanic plate","Both plates slide past each other","Both plates move apart"],"answer":"The oceanic plate sinks beneath the continental plate","why":"Oceanic crust is denser than continental crust. It sinks into the mantle, forming a trench and a volcanic arc.","trap":"Assuming the continental plate sinks because it is thicker; density, not thickness, controls subduction.","diff":2},{"id":"earth-003","part":"II","domain":"Science","sub":"Volcanoes","q":"A volcano has steep sides and alternating layers of lava and ash. Which type is it?","choices":["Composite volcano","Shield volcano","Cinder cone","Caldera"],"answer":"Composite volcano","why":"Composite volcanoes form from viscous, silica-rich magma that traps gas. Alternating lava and ash layers build steep cones.","trap":"Confusing composite cones with shield volcanoes, which form from runny, low-silica lava.","diff":2},{"id":"earth-004","part":"II","domain":"Science","sub":"Earthquakes","q":"The point on Earth's surface directly above an earthquake's focus is called the...","choices":["epicenter","hypocenter","fault scarp","seismic gap"],"answer":"epicenter","why":"Seismic waves start at the focus underground. The point directly above it on the surface is the epicenter.","trap":"Using hypocenter for the surface point; the hypocenter is the underground focus.","diff":2},{"id":"earth-005","part":"II","domain":"Science","sub":"Faults","q":"Which fault forms when the crust is stretched by tension?","choices":["Normal fault","Reverse fault","Strike-slip fault","Thrust fault"],"answer":"Normal fault","why":"Normal faults form in tension. The hanging wall slides down the fault plane because the crust is being pulled apart.","trap":"Mixing up normal and reverse faults; reverse faults form under compression.","diff":3},{"id":"earth-006","part":"II","domain":"Science","sub":"Earthquakes","q":"Why do S-waves fail to pass through Earth's outer core?","choices":["The outer core is liquid","The outer core is solid","The outer core is extremely dense","The outer core is magnetic"],"answer":"The outer core is liquid","why":"S-waves are shear waves. Liquids cannot support shear stress, so these waves cannot travel through the liquid outer core.","trap":"Thinking density alone blocks S-waves; it is the liquid state that removes shear strength.","diff":3},{"id":"earth-007","part":"II","domain":"Science","sub":"Minerals","q":"Which mineral is hardest on the Mohs hardness scale?","choices":["Diamond","Quartz","Calcite","Talc"],"answer":"Diamond","why":"Diamond ranks 10 on the Mohs scale, the top value. Talc ranks 1 and quartz ranks 7.","trap":"Choosing quartz because it scratches glass; diamond is much harder than quartz.","diff":1},{"id":"earth-008","part":"II","domain":"Science","sub":"Rock Cycle","q":"Which pair of processes turns loose sediment into sedimentary rock?","choices":["Compaction and cementation","Melting and cooling","Heat and pressure","Weathering and erosion"],"answer":"Compaction and cementation","why":"Buried sediment is squeezed by compaction. Minerals then precipitate and cement the grains together.","trap":"Believing heat and pressure alone make sedimentary rock; that path makes metamorphic rock.","diff":2},{"id":"earth-009","part":"II","domain":"Science","sub":"Weathering","q":"Which process is an example of chemical weathering?","choices":["Rusting of iron minerals","Frost wedging of rock","Root wedging of rock","Abrasion by wind-blown sand"],"answer":"Rusting of iron minerals","why":"Oxygen reacts with iron minerals to form rust. This changes the mineral composition, so it is chemical weathering.","trap":"Treating frost wedging as chemical because water is involved; it is physical weathering.","diff":2},{"id":"earth-010","part":"II","domain":"Science","sub":"Erosion","q":"Which statement describes erosion rather than weathering?","choices":["Sand is carried downstream by a river","Feldspar alters to clay in place","Ice expands inside a rock crack","Iron in rock reacts with oxygen"],"answer":"Sand is carried downstream by a river","why":"Erosion moves material from one place to another. Weathering only breaks rock down where it sits.","trap":"Calling any rock breakdown erosion; only transport counts as erosion.","diff":2},{"id":"earth-011","part":"II","domain":"Science","sub":"Rock Cycle","q":"A limestone layer is baked by nearby magma and recrystallizes. Which rock forms?","choices":["Marble","Quartzite","Slate","Granite"],"answer":"Marble","why":"Heat from magma recrystallizes limestone without melting it. The product is marble; sandstone would become quartzite.","trap":"Choosing quartzite because both are non-foliated; quartzite forms from sandstone.","diff":3},{"id":"earth-012","part":"II","domain":"Science","sub":"Atmosphere Layers","q":"In which atmospheric layer do most weather events occur?","choices":["Troposphere","Stratosphere","Mesosphere","Thermosphere"],"answer":"Troposphere","why":"The troposphere holds most of the atmosphere's mass and nearly all its water vapor. Weather forms there.","trap":"Placing weather in the stratosphere because ozone absorbs sunlight there.","diff":1},{"id":"earth-013","part":"II","domain":"Science","sub":"Clouds","q":"Which cloud type is associated with thunderstorms and heavy rain?","choices":["Cumulonimbus","Cirrus","Stratus","Altocumulus"],"answer":"Cumulonimbus","why":"Cumulonimbus clouds have strong vertical growth. Their ice crystals and rapid updrafts produce thunder and heavy rain.","trap":"Linking heavy rain to stratus clouds because both look gray and flat.","diff":2},{"id":"earth-014","part":"II","domain":"Science","sub":"Typhoons","q":"Which condition favors the formation of a tropical cyclone?","choices":["Warm ocean surface","Strong vertical wind shear","Cold ocean surface","High surface air pressure"],"answer":"Warm ocean surface","why":"Evaporation from warm water supplies the latent heat that powers a tropical cyclone. Cool water cannot sustain it.","trap":"Thinking strong wind shear helps; shear tilts and tears the storm apart.","diff":1},{"id":"earth-015","part":"II","domain":"Science","sub":"Monsoon","q":"Which monsoon brings the rainy season to the Philippines?","choices":["Southwest monsoon (habagat)","Northeast monsoon (amihan)","Southeast monsoon","Northwest monsoon"],"answer":"Southwest monsoon (habagat)","why":"The southwest monsoon (habagat) flows from the warm ocean toward the country. It carries moist air and brings most of the wet-season rain. The northeast monsoon (amihan) is the cool, dry season.","trap":"Swapping habagat with amihan; amihan is the cool, dry northeast monsoon.","diff":1},{"id":"earth-016","part":"II","domain":"Science","sub":"Weather","q":"Why does rising air cool as it moves upward?","choices":["It expands as pressure decreases","It loses heat to the ozone layer","It absorbs cold water vapor","It slows down and loses kinetic energy"],"answer":"It expands as pressure decreases","why":"Air pressure falls with altitude. The rising parcel expands, does work, and cools adiabatically.","trap":"Saying heat is lost to space; the cooling comes from expansion, not radiation.","diff":3},{"id":"earth-017","part":"II","domain":"Science","sub":"Greenhouse Effect","q":"Which gas is released by burning fossil fuels and absorbs outgoing infrared radiation?","choices":["Carbon dioxide","Nitrogen","Oxygen","Argon"],"answer":"Carbon dioxide","why":"Fossil fuel combustion releases carbon dioxide. CO_2 absorbs outgoing infrared radiation and warms the lower atmosphere.","trap":"Choosing oxygen because it is abundant; O_2 has no dipole moment and does not absorb infrared.","diff":1},{"id":"earth-018","part":"II","domain":"Science","sub":"Greenhouse Effect","q":"What happens to infrared radiation emitted by Earth's surface?","choices":["It is absorbed by greenhouse gases","It escapes to space unchanged","It is reflected back by the ozone layer","It becomes visible light in the troposphere"],"answer":"It is absorbed by greenhouse gases","why":"Greenhouse gases absorb outgoing infrared radiation. They re-emit it in all directions, including back toward the surface.","trap":"Thinking the atmosphere reflects infrared; greenhouse gases absorb and re-emit it.","diff":2},{"id":"earth-019","part":"II","domain":"Science","sub":"Water Cycle","q":"Which process changes water vapor into liquid droplets?","choices":["Condensation","Evaporation","Transpiration","Sublimation"],"answer":"Condensation","why":"Cooling air cannot hold as much water vapor. Excess vapor condenses onto particles and forms droplets.","trap":"Confusing condensation with evaporation since both change the state of water.","diff":1},{"id":"earth-020","part":"II","domain":"Science","sub":"Ocean Currents","q":"What mainly drives surface ocean currents?","choices":["Global wind patterns","Tidal forces","Earth's magnetic field","Seafloor spreading"],"answer":"Global wind patterns","why":"Winds drag on the sea surface and transfer momentum. This wind stress sets surface currents in motion.","trap":"Assuming tides drive surface currents; tides are minor compared with wind stress.","diff":2},{"id":"earth-021","part":"II","domain":"Science","sub":"Earth's Internal Structure","q":"Which layer of Earth is liquid and produces the magnetic field?","choices":["Outer core","Inner core","Lower mantle","Crust"],"answer":"Outer core","why":"The outer core is liquid iron and nickel. Its convection, coupled with Earth's rotation, generates the magnetic field.","trap":"Choosing the inner core because it is hottest; the inner core is solid.","diff":2},{"id":"earth-022","part":"II","domain":"Science","sub":"Geologic Time","q":"Which principle says that in undisturbed sedimentary layers, the lowest layer is the oldest?","choices":["Superposition","Cross-cutting relationships","Original horizontality","Uniformitarianism"],"answer":"Superposition","why":"In an undisturbed sequence, each layer was deposited on top of the older layer below it.","trap":"Confusing superposition with original horizontality, which is about flat deposition.","diff":2},{"id":"space-001","part":"II","domain":"Science","sub":"Solar System","q":"Which planet is the largest in the solar system?","choices":["Jupiter","Saturn","Neptune","Earth"],"answer":"Jupiter","why":"Jupiter is the most massive planet. Its mass is more than twice that of all the other planets combined.","trap":"Choosing Saturn because of its rings; Jupiter is larger.","diff":1},{"id":"space-002","part":"II","domain":"Science","sub":"Planets","q":"Which of these is a terrestrial planet?","choices":["Mars","Jupiter","Saturn","Neptune"],"answer":"Mars","why":"Mercury, Venus, Earth, and Mars have rocky surfaces. Mars is the only terrestrial planet listed.","trap":"Picking Jupiter or Saturn because they are planets; both are gas giants.","diff":1},{"id":"space-003","part":"II","domain":"Science","sub":"Kepler's Laws","q":"According to Kepler's second law, a planet moves fastest when it is...","choices":["closest to the Sun","farthest from the Sun","at the midpoint of its orbit","moving perpendicular to the Sun"],"answer":"closest to the Sun","why":"Equal areas are swept in equal times. The planet covers the same area faster when it is near the Sun.","trap":"Thinking a planet moves fastest at aphelion because its orbit path is longer there.","diff":2},{"id":"space-004","part":"II","domain":"Science","sub":"Solar System","q":"Where is the main asteroid belt located?","choices":["Between Mars and Jupiter","Between Earth and Mars","Between Saturn and Uranus","Beyond Neptune"],"answer":"Between Mars and Jupiter","why":"The main belt lies in the gap between the orbits of Mars and Jupiter.","trap":"Placing the belt between Earth and Mars; the main belt lies beyond Mars.","diff":1},{"id":"space-005","part":"II","domain":"Science","sub":"Kepler's Laws","q":"Kepler's third law states that the square of a planet's orbital period is proportional to...","choices":["the cube of its semi-major axis","the square of its semi-major axis","its semi-major axis","the inverse of its semi-major axis"],"answer":"the cube of its semi-major axis","why":"For the solar system, T^2 = a^3 with T in years and a in AU. So T^2 is proportional to a^3.","trap":"Using T proportional to a, which drops both the square and the cube.","diff":3},{"id":"space-006","part":"II","domain":"Science","sub":"Gravity","q":"If the distance between two masses is doubled, the gravitational force between them becomes...","choices":["one-fourth as strong","one-half as strong","twice as strong","four times as strong"],"answer":"one-fourth as strong","why":"Newton's law gives F proportional to 1/r^2. Doubling r makes F one-fourth of its original value.","trap":"Doubling the force when the distance doubles, which reverses the inverse-square relation.","diff":3},{"id":"space-007","part":"II","domain":"Science","sub":"Moon Phases","q":"Which Moon phase occurs when the Moon is between Earth and the Sun?","choices":["New moon","Full moon","First quarter","Last quarter"],"answer":"New moon","why":"The Moon sits between Earth and the Sun. Its sunlit side faces away from Earth, so we see no illuminated face.","trap":"Confusing new moon with full moon; at full moon Earth is between the Sun and the Moon.","diff":1},{"id":"space-008","part":"II","domain":"Science","sub":"Eclipses","q":"A lunar eclipse can occur only during which phase?","choices":["Full moon","New moon","First quarter","Waxing crescent"],"answer":"Full moon","why":"Earth must lie between the Sun and the Moon. That alignment happens only at full moon.","trap":"Choosing new moon because the Moon looks dark; lunar eclipses need the full moon.","diff":2},{"id":"space-009","part":"II","domain":"Science","sub":"Eclipses","q":"Why is there not a solar eclipse at every new moon?","choices":["The Moon's orbit is tilted about 5 degrees to Earth's orbital plane","The Moon is too small to cover the Sun","Earth's atmosphere bends sunlight away","The Moon rotates too fast"],"answer":"The Moon's orbit is tilted about 5 degrees to Earth's orbital plane","why":"The Moon's orbit is tilted about 5 degrees from the ecliptic. Most new moons pass above or below the Sun.","trap":"Assuming eclipses need only alignment; the orbital tilt usually breaks the alignment.","diff":3},{"id":"space-010","part":"II","domain":"Science","sub":"Tides","q":"Which tide occurs when the Sun, Earth, and Moon are aligned?","choices":["Spring tide","Neap tide","Diurnal tide","Mixed tide"],"answer":"Spring tide","why":"At new and full moon the solar and lunar tidal bulges add up, giving the largest tidal range.","trap":"Linking spring tide to the spring season; the name refers to the water springing up.","diff":2},{"id":"space-011","part":"II","domain":"Science","sub":"Moon Phases","q":"About how long is one complete cycle of lunar phases?","choices":["29.5 days","27.3 days","24 hours","365 days"],"answer":"29.5 days","why":"The synodic month averages about 29.5 days. The sidereal month of 27.3 days is shorter because Earth also moves.","trap":"Using the 27.3-day sidereal month for the phase cycle.","diff":2},{"id":"space-012","part":"II","domain":"Science","sub":"Stars","q":"What surface property mainly determines a star's color?","choices":["Temperature","Distance from Earth","Diameter","Age"],"answer":"Temperature","why":"Hot stars radiate most strongly at short wavelengths and look blue. Cool stars look red.","trap":"Reading color as distance; distance affects brightness, not color.","diff":2},{"id":"space-013","part":"II","domain":"Science","sub":"H-R Diagram","q":"Where on the H-R diagram do most stars, including the Sun, lie?","choices":["Main sequence","White dwarf region","Red giant branch","Supergiant region"],"answer":"Main sequence","why":"Stars fuse hydrogen into helium on the main sequence. This stable stage is the longest part of a star's life.","trap":"Placing the Sun with the red giants because it looks yellow; it is a main-sequence star.","diff":2},{"id":"space-014","part":"II","domain":"Science","sub":"Stellar Evolution","q":"What remains at the center of a planetary nebula left by a Sun-like star?","choices":["White dwarf","Neutron star","Black hole","Brown dwarf"],"answer":"White dwarf","why":"A Sun-like star sheds its outer layers as a planetary nebula. The exposed core remains as a white dwarf.","trap":"Choosing a neutron star; only massive stars leave neutron stars.","diff":2},{"id":"space-015","part":"II","domain":"Science","sub":"Constellations","q":"Why do different constellations appear in the night sky each season?","choices":["Earth orbits the Sun and faces a different part of space","The stars move quickly around Earth each year","Earth's axis tilt changes every year","The Moon blocks different stars each season"],"answer":"Earth orbits the Sun and faces a different part of space","why":"Earth's night side faces a different direction as it orbits the Sun. Different constellations become visible.","trap":"Thinking the stars themselves move fast; Earth's orbit changes our view.","diff":2},{"id":"space-016","part":"II","domain":"Science","sub":"Light-Year","q":"A light-year is a unit of...","choices":["distance","time","brightness","mass"],"answer":"distance","why":"A light-year is the distance light travels in one year, about 9.5 x 10^12 km.","trap":"Reading light-year as a time; it measures distance despite the word year.","diff":1},{"id":"space-017","part":"II","domain":"Science","sub":"Big Bang","q":"Which observation is the strongest evidence that the universe is expanding?","choices":["Redshift of distant galaxies","Parallax of nearby stars","Rotation of the Milky Way","Orbits of the planets"],"answer":"Redshift of distant galaxies","why":"Light from receding galaxies is stretched to longer wavelengths. Greater redshift with distance indicates expansion.","trap":"Thinking expansion means galaxies only move through space; space itself stretches.","diff":2},{"id":"space-018","part":"II","domain":"Science","sub":"Galaxies","q":"What type of galaxy is the Milky Way?","choices":["Barred spiral","Elliptical","Irregular","Lenticular"],"answer":"Barred spiral","why":"The Milky Way has a central bar and spiral arms. Radio and infrared maps confirm this structure.","trap":"Choosing elliptical because of the bright central bulge; the disk and bar make it a spiral.","diff":3},{"id":"phys-001","part":"II","domain":"Science","sub":"Kinematics","q":"A runner starts from rest and reaches 8 m/s in 4 s. What is the average acceleration?","choices":["0.5 m/s^2","2 m/s^2","4 m/s^2","32 m/s^2"],"answer":"2 m/s^2","why":"a = (v - v_0)/t = (8 - 0)/4 = 2 m/s^2.","trap":"Dividing 4 s by 8 m/s and reporting 0.5 m/s^2.","diff":1},{"id":"phys-002","part":"II","domain":"Science","sub":"Kinematics","q":"A shopper walks 300 m east, then turns and walks 100 m west. What is the displacement?","choices":["200 m east","200 m west","400 m east","400 m west"],"answer":"200 m east","why":"Displacement = 300 - 100 = 200 m east. Distance is the total path, 400 m.","trap":"Adding both legs to get 400 m and calling it displacement.","diff":1},{"id":"phys-003","part":"II","domain":"Science","sub":"Kinematics","q":"A stone is dropped from rest and falls for 3 s. How far does it fall? Use g = 9.8 m/s^2.","choices":["14.7 m","29.4 m","44.1 m","88.2 m"],"answer":"44.1 m","why":"d = 0.5*g*t^2 = 0.5*9.8*3^2 = 44.1 m.","trap":"Using d = g*t^2 and dropping the 0.5 to get 88.2 m.","diff":2},{"id":"phys-004","part":"II","domain":"Science","sub":"Kinematics","q":"A ball is thrown straight up at 20 m/s. How long until it returns to the thrower's hand? Use g = 9.8 m/s^2.","choices":["2.0 s","4.1 s","4.9 s","8.2 s"],"answer":"4.1 s","why":"Rise time = v/g = 20/9.8 = 2.04 s. Total time = 2*2.04 = 4.1 s.","trap":"Reporting only the rise time, 2.0 s.","diff":2},{"id":"phys-005","part":"II","domain":"Science","sub":"Motion Graphs","q":"The grid plots position (vertical) against time (horizontal). The plotted line is flat. What is the object doing?","choices":["At rest","Moving at constant speed","Accelerating","Moving backward"],"answer":"At rest","why":"Position does not change. Velocity is the slope of a position-time graph, and here the slope is zero.","trap":"Reading the flat line as constant speed because the line is horizontal.","diff":1,"grid":["..........","..........","##########","..........","..........",".........."]},{"id":"phys-006","part":"II","domain":"Science","sub":"Motion Graphs","q":"A velocity-time graph shows a constant 6 m/s for 4 s. What displacement does the area under the line give?","choices":["1.5 m","10 m","24 m","48 m"],"answer":"24 m","why":"Area = height*width = 6 m/s * 4 s = 24 m.","trap":"Computing the slope 6/4 and reporting 1.5 m.","diff":2},{"id":"phys-007","part":"II","domain":"Science","sub":"Motion Graphs","q":"The grid shows a velocity-time graph: a straight line rises from 0 to 20 m/s over 5 s. What is the acceleration?","choices":["0.25 m/s^2","4 m/s^2","5 m/s^2","100 m/s^2"],"answer":"4 m/s^2","why":"Acceleration is the slope: a = (20 - 0)/5 = 4 m/s^2.","trap":"Dividing time by speed to get 0.25 m/s^2.","diff":2,"grid":[".........#","........#.",".......#..","......#...",".....#....","....#....."]},{"id":"phys-008","part":"II","domain":"Science","sub":"Kinematics","q":"A car travels 150 m north in 5 s. What is its average velocity?","choices":["30 m/s north","30 m/s south","750 m/s north","0.03 m/s north"],"answer":"30 m/s north","why":"v = d/t = 150/5 = 30 m/s north.","trap":"Multiplying 150 by 5 to get 750 m/s.","diff":1},{"id":"phys-009","part":"II","domain":"Science","sub":"Kinematics","q":"A car moving at 20 m/s brakes and stops in 50 m. What is its deceleration?","choices":["0.4 m/s^2","4 m/s^2","8 m/s^2","10 m/s^2"],"answer":"4 m/s^2","why":"v^2 = v_0^2 + 2ad gives 0 = 400 + 2a(50). a = -4 m/s^2, so deceleration is 4 m/s^2.","trap":"Dividing 20 by 50 to get 0.4 m/s^2.","diff":2},{"id":"phys-010","part":"II","domain":"Science","sub":"Kinematics","q":"A bus covers 120 m in 10 s, then 180 m in 20 s. What is its average speed for the whole trip?","choices":["9 m/s","10 m/s","10.5 m/s","12 m/s"],"answer":"10 m/s","why":"Average speed = total distance/total time = (120 + 180)/(10 + 20) = 300/30 = 10 m/s.","trap":"Averaging the two speeds, 12 and 9, to get 10.5 m/s.","diff":2},{"id":"phys-011","part":"II","domain":"Science","sub":"Kinematics","q":"A coin is dropped from rest. How long does it take to fall 20 m? Use g = 9.8 m/s^2.","choices":["1.4 s","2.0 s","4.1 s","20 s"],"answer":"2.0 s","why":"d = 0.5*g*t^2 gives 20 = 4.9t^2. t^2 = 4.08, so t = 2.0 s.","trap":"Dropping the 0.5 and getting t = sqrt(20/9.8) = 1.4 s.","diff":3},{"id":"phys-012","part":"II","domain":"Science","sub":"Kinematics","q":"Which pair lists only vector quantities?","choices":["Velocity and acceleration","Speed and distance","Distance and displacement","Speed and time"],"answer":"Velocity and acceleration","why":"Vectors have magnitude and direction. Velocity and acceleration qualify. Speed, distance, and time have magnitude only.","trap":"Treating displacement as a scalar because it is measured in meters.","diff":1},{"id":"phys-013","part":"II","domain":"Science","sub":"Newton's Laws","q":"A 5 kg box is pushed with a net force of 20 N. What is its acceleration?","choices":["0.25 m/s^2","4 m/s^2","25 m/s^2","100 m/s^2"],"answer":"4 m/s^2","why":"a = F/m = 20/5 = 4 m/s^2.","trap":"Multiplying 20 N by 5 kg to get 100 m/s^2.","diff":1},{"id":"phys-014","part":"II","domain":"Science","sub":"Newton's Laws","q":"What is the weight of a 60 kg student on Earth? Use g = 9.8 m/s^2.","choices":["6.1 N","60 N","588 N","5880 N"],"answer":"588 N","why":"W = m*g = 60*9.8 = 588 N.","trap":"Reporting the mass, 60 N, and ignoring g.","diff":2},{"id":"phys-015","part":"II","domain":"Science","sub":"Friction","q":"A 10 kg crate moves at constant speed while pushed by a 30 N horizontal force. What is the kinetic friction?","choices":["3 N","30 N","98 N","300 N"],"answer":"30 N","why":"Constant speed means net force is zero. Kinetic friction balances the push, so f = 30 N.","trap":"Reporting the weight, 98 N, as the friction force.","diff":2},{"id":"phys-016","part":"II","domain":"Science","sub":"Newton's Laws","q":"A 2 kg mass hangs from a rope in an elevator accelerating upward at 2 m/s^2. What is the tension? Use g = 9.8 m/s^2.","choices":["4 N","19.6 N","23.6 N","27.2 N"],"answer":"23.6 N","why":"T - mg = ma, so T = m(g + a) = 2(9.8 + 2) = 23.6 N.","trap":"Using T = mg only and getting 19.6 N.","diff":3},{"id":"phys-017","part":"II","domain":"Science","sub":"Newton's Laws","q":"A book rests on a table. Which statement describes the forces on the book?","choices":["They are balanced, so the book stays at rest","They are unbalanced, so the book moves","Only gravity acts on the book","Friction pushes the book upward"],"answer":"They are balanced, so the book stays at rest","why":"Gravity pulls down and the normal force pushes up. The forces are equal and opposite, so net force is zero.","trap":"Thinking a resting object has no forces acting on it.","diff":1},{"id":"phys-018","part":"II","domain":"Science","sub":"Newton's Laws","q":"A 5 kg block sits on a frictionless 30-degree incline. What is the normal force? Use g = 9.8 m/s^2.","choices":["24.5 N","42.4 N","49 N","56.6 N"],"answer":"42.4 N","why":"N = mg*cos(30) = 5(9.8)(0.866) = 42.4 N.","trap":"Using mg*sin(30) = 24.5 N, which is the force along the incline.","diff":3},{"id":"phys-019","part":"II","domain":"Science","sub":"Circular Motion","q":"A 2 kg object moves in a circle of radius 4 m at 6 m/s. What is the centripetal force?","choices":["3 N","18 N","36 N","72 N"],"answer":"18 N","why":"F = m*v^2/r = 2(6^2)/4 = 18 N.","trap":"Forgetting to square v and getting 2*6/4 = 3 N.","diff":2},{"id":"phys-020","part":"II","domain":"Science","sub":"Newton's Laws","q":"Two blocks of 3 kg and 2 kg hang from a light rope over a frictionless pulley. What is the acceleration?
